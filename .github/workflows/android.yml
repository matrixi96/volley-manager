name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Przygotuj projekt Capacitor
        run: |
          mkdir app && cd app
          cp ../android/capacitor.config.json .
          npm init -y >/dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          # gra bez service workera: w aplikacji pliki są lokalne
          cp ../index.html ../manifest.webmanifest ../*.png www/
          npx cap add android

      - name: Ikona i ekran startowy
        run: |
          cd app
          mkdir -p assets && cp ../android/assets/*.png assets/
          npx --yes @capacitor/assets@3 generate --android \
            --iconBackgroundColor '#0f1b33' --iconBackgroundColorDark '#0f1b33' \
            --splashBackgroundColor '#0f1b33' --splashBackgroundColorDark '#0f1b33'

      - name: Wersja
        run: |
          cd app/android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Zbuduj APK (wersja do wydania)
        run: |
          cd app
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../../unsigned.apk

      - name: Podpisz prywatnym kluczem (z sekretów repozytorium)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "Brak sekretów ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS — APK nie zostanie podpisany ani opublikowany."; exit 1; fi
          umask 077
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 unsigned.apk aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias goldenset --out VolleyManager.apk aligned.apk
          rm -f "$RUNNER_TEMP/release.jks"
          $BT/apksigner verify --print-certs VolleyManager.apk | grep -i "DN\|SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: VolleyManager-apk
          path: VolleyManager.apk

      - name: Opublikuj w Releases (stały link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest VolleyManager.apk \
            --title "Golden Set – Android (wersja 1.${{ github.run_number }})" \
            --notes "Pobierz VolleyManager.apk na telefonie i zainstaluj (zezwól na instalację z tego źródła). Aktualizacja instaluje się na poprzednią wersję – zapis gry zostaje. UWAGA: od wersji z nowym kluczem podpisu (listopad 2026) starą aplikację trzeba raz odinstalować – najpierw skopiuj kod zapisu (Zapis gry → Kod zapisu), potem zainstaluj nową wersję i wklej kod."
