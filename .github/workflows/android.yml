name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Przygotuj projekt Capacitor
        run: |
          mkdir app && cd app
          cp ../android/capacitor.config.json .
          npm init -y >/dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          # gra bez service workera: w aplikacji pliki są lokalne
          cp ../index.html ../manifest.webmanifest ../*.png www/
          npx cap add android

      - name: Ikona i ekran startowy
        continue-on-error: true
        run: |
          cd app
          mkdir -p assets && cp ../android/assets/logo.png assets/logo.png
          npx --yes @capacitor/assets@3 generate --android \
            --iconBackgroundColor '#0b1220' --iconBackgroundColorDark '#0b1220' \
            --splashBackgroundColor '#0b1220' --splashBackgroundColorDark '#0b1220'

      - name: Wersja i klucz podpisu
        run: |
          cd app/android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
          # stały klucz = aktualizacje instalują się na starą wersję bez utraty zapisu
          mkdir -p ~/.android && cp ../../android/debug.keystore ~/.android/debug.keystore

      - name: Zbuduj APK
        run: |
          cd app
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../VolleyManager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VolleyManager-apk
          path: VolleyManager.apk

      - name: Opublikuj w Releases (stały link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest VolleyManager.apk \
            --title "Volley Manager – Android (wersja 1.${{ github.run_number }})" \
            --notes "Pobierz VolleyManager.apk na telefonie i zainstaluj (zezwól na instalację z tego źródła). Aktualizacja instaluje się na poprzednią wersję – zapis gry zostaje."
