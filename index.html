const WEIGHTS={
  R:{roz:5,tpa:2,zag:1.5,obr:1.5,blo:1,sko:0.5,szy:0.5,kon:0.5},
  A:{ata:5,zag:2,sil:1.5,blo:1.5,sko:1.5,obr:0.5,kon:0.5},

const POS_OFF={};
function posOff(pos){if(POS_OFF[pos]==null){const w=WEIGHTS[pos];let s=0,t=0;for(const k in w){s+=(TEMPL[pos][k]||0)*w[k];t+=w[k];}POS_OFF[pos]=s/t;}return POS_OFF[pos];}
function rating(p,pos){pos=pos||p.pos;const w=WEIGHTS[pos];let s=0,t=0;for(const k in w){s+=p[k]*w[k];t+=w[k];}let r=s/t-posOff(pos)+2.5;if(pos!=='L')r+=(p.h-HEIGHT[pos][0]-6)*0.05;return Math.round(clamp(r*5,1,100));}

function genTeam(def,idx){
  const rnd=mulberry32(1000+idx*7919);
  const g=()=>(rnd()+rnd()+rnd()-1.5)/1.5;
  const plan=[['R',1.5],['R',-1.5],['A',1.5],['A',-1.5],['P',1.3],['P',1.0],['P',-1.2],['P',-1.8],['S',1.3],['S',1.0],['S',-1.2],['S',-1.8],['L',1.3],['L',-1.5]];
  const used=new Set(),nums=new Set();
  const players=plan.map(([pos,tier],i)=>{
    let first,last;do{first=FIRST[Math.floor(rnd()*FIRST.length)];last=LAST[Math.floor(rnd()*LAST.length)];}while(used.has(last));used.add(last);
    let num;do{num=1+Math.floor(rnd()*25);}while(nums.has(num));nums.add(num);
    const p={id:'t'+idx+'p'+i,first,last,pos,num,age:19+Math.floor(rnd()*15)};
    const hh=HEIGHT[pos];p.h=Math.round(hh[0]+rnd()*(hh[1]-hh[0]));
    for(const [k] of ATTRS.concat(PHYS))p[k]=Math.round(clamp(def.q+TEMPL[pos][k]+tier+g()*1.8,1,20));
    for(const [k] of MENTAL)p[k]=Math.round(clamp(def.q-1+tier*0.3+g()*4,1,20));
    return p;
  });
  return Object.assign({},def,{idx,players});
}
function lineupScore(p,pos){return rating(p,pos)+(p.pos===pos?8:0);}
function autoLineup(team){const u=new Set(),lu={};
  for(const [k,,pos] of LINEUP_KEYS){const c=team.players.filter(p=>!p.inj&&!u.has(p.id)).sort((a,b)=>lineupScore(b,pos)-lineupScore(a,pos))[0]||team.players.filter(p=>!u.has(p.id))[0];if(!c)continue;u.add(c.id);lu[k]=c.id;}
  return lu;}
const LINEUP_KEYS=[['R','Rozgrywający','R'],['A','Atakujący','A'],['P1','Przyjmujący 1','P'],['P2','Przyjmujący 2','P'],['S1','Środkowy 1','S'],['S2','Środkowy 2','S'],['L','Libero','L']];
function validLineup(team,lu){if(!lu)return false;const ids=LINEUP_KEYS.map(k=>lu[k[0]]);if(new Set(ids).size!==7)return false;return ids.every(id=>team.players.some(p=>p.id===id));}
function teamStrength(team){const lu=autoLineup(team);let s=0,t=0;for(const [k,,pos] of LINEUP_KEYS){const p=team.players.find(x=>x.id===lu[k]);if(!p){t+=1;continue;}const w=k==='L'?0.6:1;s+=rating(p,pos)*w;t+=w;}return Math.round(s/t);}

// ---------- mecz ----------
function cloneP(p){return Object.assign({},p,{en:100,st:{srv:0,srvErr:0,ace:0,rec:0,recPos:0,recPerf:0,recErr:0,att:0,kill:0,attErr:0,blocked:0,blk:0,dig:0}});}
function makeSide(team,lu,tac,home,x){
  const ids=new Set(Object.values(lu));const pl=team.players.filter(p=>!p.inj||ids.has(p.id)).map(cloneP);const g=id=>pl.find(p=>p.id===id);
  const slots=[['R',lu.R],['P',lu.P1],['S',lu.S1],['A',lu.A],['P',lu.P2],['S',lu.S2]].map(([role,id])=>({role,p:g(id)}));
  return {team,pl,slots,libero:g(lu.L),rot:[0,1,2,3,4,5],tactics:Object.assign({},tac),mom:0,home:!!home,fatMul:(x&&x.fat)||1,momMul:(x&&x.momMul)||1,prB:(x&&x.prB)||0,trB:(x&&x.trB)||0,form:nz()*0.09+(home?(x&&x.hb!=null?x.hb:0.015):0)+((x&&x.sb)||0),to:2,subs:6};
}
function newMatch(a,b){
  const m={sides:[makeSide(a.team,a.lineup,a.tactics,a.home,a.x),makeSide(b.team,b.lineup,b.tactics,b.home,b.x)],setNo:1,score:[0,0],setsWon:[0,0],sets:[],firstServe:R()<0.5?0:1,run:{t:-1,n:0},over:false,rallies:0,sideout:[0,0]};
  m.serving=m.firstServe;return m;
}
function onCourt(side,serving){
  return side.rot.map((si,z)=>{const s=side.slots[si];
    if(s.role==='S'&&(z===0||z===4||z===5)&&side.libero&&!(serving&&z===0))return {zone:z,role:'L',p:side.libero,slot:'L'};
    return {zone:z,role:s.role,p:s.p,slot:si};});
}
function pressure(m){const a=m.score[0],b=m.score[1],t=m.setNo===5?15:25;return Math.max(a,b)>=t-4&&Math.min(a,b)>=t-8;}
function mb(p,m,i){let b=0;const sd=m.sides[i];if(pressure(m))b+=(p.opa-11)/20*0.14+(sd.prB||0);if(m.score[1-i]-m.score[i]>=3)b+=(p.wal-11)/20*0.1+(sd.trB||0);return b;}
function kc(p,m){let k=1.25-p.kcj/20*0.5;if(pressure(m))k*=1.15-p.opa/20*0.3;return k;}
function nerves(p,m){return pressure(m)&&p.opa<10?' Nerwy w końcówce!':'';}
function bn(s){return s.mom*0.01*(s.momMul||1)+s.form;}
function eff(p,k){return p[k]*(0.82+0.18*p.en/100);}
function nm(p){return p.last;}
const isFront=z=>z>=1&&z<=3;
function pickW(arr,wf){let tot=0;const ws=arr.map(x=>{const w=Math.max(0,wf(x));tot+=w;return w;});if(tot<=0)return arr[Math.floor(R()*arr.length)];let r=R()*tot;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i];}return arr[arr.length-1];}

function rally(m,ex){
  const S=m.serving,D=1-S,sS=m.sides[S],sD=m.sides[D];
  const cS=onCourt(sS,true),cD=onCourt(sD,false);
  const log=[],act=[];const seq=[];m._seq=seq;
  const server=cS[0].p;act.push(server.id);seq.push({k:'srv',id:server.id,s:S});
  const st=sS.tactics.serve;
  const n=(eff(server,'zag')*0.8+eff(server,'sil')*0.2)/20+bn(sS)+mb(server,m,S);
  server.st.srv++;
  const errP=[0.075,0.15,0.25][st]*(1.45-0.9*n)*kc(server,m);
  if(R()<errP){server.st.srvErr++;const net=R()<0.5;seq.push({k:net?'net':'out',s:D});return {winner:D,type:'serr',act,seq,text:`${nm(server)} psuje zagrywkę (${net?'siatka':'aut'}).${nerves(server,m)}`};}
  const pow=n+[-0.14,0,0.13][st];
  let recs=cD.filter(x=>x.role==='L'||x.role==='P');if(!recs.length)recs=cD.filter(x=>x.role!=='R');
  const rec=pickW(recs,x=>x.role==='L'?1.4:1).p;act.push(rec.id);
  const rn=(eff(rec,'prz')*0.7+eff(rec,'tod')*0.2+eff(rec,'zwi')*0.1)/20+bn(sD)+mb(rec,m,D);
  const v=0.52+(rn-pow-0.18)*0.6+nz()*0.6;
  rec.st.rec++;
  if(v<0.17){server.st.ace++;rec.st.recErr++;seq.push({k:'ace',id:rec.id,s:D});return {winner:S,type:'ace',act,seq,text:`${nm(server)} — AS SERWISOWY! ${nm(rec)} bez szans.`};}
  const q=v<0.42?1:v<0.74?2:3;
  seq.push({k:'rec',id:rec.id,s:D});
  if(q>=2)rec.st.recPos++;if(q===3)rec.st.recPerf++;
  log.push(`zagrywa ${nm(server)}`,`przyjmuje ${nm(rec)} (${['','słabo','dobrze','idealnie'][q]})`);
  let A=D,qq=q,by=rec;
  for(let k=0;k<40;k++){
    ex.n=k;
    const r=attackPhase(m,A,qq,by,log,act);
    if(r.done)return {winner:r.winner,type:r.type,act,seq,text:log.join(' → ')};
    A=r.next;qq=r.q;by=r.by;
  }
  seq.push({k:'floor',s:D});return {winner:S,type:'kill',act,seq,text:log.join(' → ')};
}
var KB=0.55;
function attackPhase(m,A,q,by,log,act){
  const side=m.sides[A],opp=m.sides[1-A];
  const cA=onCourt(side,m.serving===A),cO=onCourt(opp,m.serving!==A);
  const sE=cA.find(x=>x.role==='R');
  let setter;
  if(sE&&sE.p!==by)setter=sE.p;
  else{const alt=cA.filter(x=>x.p!==by&&x.role!=='R');setter=(pickW(alt,x=>x.role==='L'?2.5:x.role==='A'?1:0.6)||cA[0]).p;}
  const real=!!(sE&&setter===sE.p);
  const rz=(real?eff(setter,'roz')*0.75+eff(setter,'tpa')*0.25:eff(setter,'roz')*0.4+eff(setter,'tpa')*0.6)/20;
  let sq=[0,0.38,0.68,0.86][q]+(rz-0.55)*0.45*(real?1:0.6)+nz()*0.12-(real?0:0.12);
  sq=clamp(sq,0.05,1);
  const seq=m._seq||[];seq.push({k:'set',id:setter.id,s:A});
  if(R()<(0.006+(1-rz)*0.01)*kc(setter,m)){log.push(`błąd rozegrania (${nm(setter)})`);seq.push({k:'out',s:1-A});return {done:true,winner:1-A,type:'setErr'};}
  const tac=side.tactics.dist;
  const cands=cA.filter(x=>x.p!==setter&&x.role!=='L');
  const att=pickW(cands,x=>{
    const fr=isFront(x.zone);let w=0;
    if(x.role==='A')w=fr?1.35:0.9;
    else if(x.role==='P')w=fr?1.0:0.3;
    else if(x.role==='S')w=fr?(q>=3?0.95:q===2?0.6:0.12):0;
    else if(x.role==='R')w=fr?0.05:0;
    if(!fr&&sq<0.45)w*=0.3;
    if(tac===1&&(x.role==='A'||x.role==='P'))w*=1.3;
    if(tac===2&&x.role==='S')w*=1.7;
    if(tac===3&&x.role==='A')w*=1.6;
    return w*(0.5+eff(x.p,'ata')/20);
  });
  const a=att.p,fr=isFront(att.zone),quick=att.role==='S'&&fr;
  act.push(a.id);seq.push({k:'att',id:a.id,s:A,q:quick});
  const an=0.1+eff(a,'ata')/20*0.4+eff(a,'sil')/20*0.08+eff(a,'sko')/20*0.22+(a.h-197)/100+sq*0.42+bn(side)-(fr?0:0.06)+(quick&&sq>0.7?0.05+(a.szy-12)/20*0.08:0)+mb(a,m,A);
  a.st.att++;
  const setTxt=real?`${nm(setter)} → atak ${nm(a)}`:`podbija ${nm(setter)} → atak ${nm(a)}`;
  const blockers=cO.filter(x=>isFront(x.zone)&&x.role!=='L');
  const nb=quick?1.4:sq<0.4?2.8:2.2;
  const bs=blockers.reduce((s,x)=>s+(eff(x.p,'blo')*0.75+eff(x.p,'sko')*0.15+eff(x.p,'szy')*0.1)/20+(x.p.h-197)/120,0)/blockers.length*(0.75+nb*0.12)+bn(opp);
  const errP=(0.075+(1-sq)*0.08+(0.75-eff(a,'ata')/20)*0.08)*kc(a,m);
  if(R()<errP){a.st.attErr++;const net=R()<0.5;seq.push({k:net?'net':'out',s:1-A});log.push(setTxt,`atak ${net?'w siatkę':'w aut'}${nerves(a,m)}`);return {done:true,winner:1-A,type:'attErr'};}
  const blockP=clamp(0.17+(bs-an+0.17)*0.3,0.03,0.35);
  if(R()<blockP){
    const b=pickW(blockers,x=>eff(x.p,'blo')+(x.role==='S'?4:0)).p;act.push(b.id);seq.push({k:'blk',id:b.id,s:1-A});
    if(R()<0.55){a.st.blocked++;b.st.blk++;seq.push({k:'floor',s:A,blk:1});log.push(setTxt,`BLOK ${nm(b)}!`);return {done:true,winner:1-A,type:'block'};}
    log.push(setTxt,`wybloka ${nm(b)}`);return {done:false,next:1-A,q:2,by:b};
  }
  const defs=cO.filter(x=>!isFront(x.zone));
  const d=pickW(defs,x=>(x.role==='L'?1.6:1)*(0.5+eff(x.p,'obr')/20)).p;
  const dn=(eff(d,'obr')*0.6+eff(d,'zwi')*0.2+eff(d,'szy')*0.2)/20+mb(d,m,1-A)+(d.zaa-11)/20*0.06;
  const killP=clamp(KB+(an-0.95)*0.6-(dn-0.7)*0.3-(bs-0.8)*0.2,0.18,0.85);
  if(R()<killP){a.st.kill++;seq.push({k:'floor',s:1-A});log.push(setTxt,`${quick?'krótka — ':''}PUNKT!`);return {done:true,winner:A,type:'kill'};}
  d.st.dig++;act.push(d.id);seq.push({k:'dig',id:d.id,s:1-A});
  const dq=R()<0.25+dn*0.3+eff(d,'tod')/20*0.15?2:1;
  log.push(setTxt,`broni ${nm(d)}`);
  return {done:false,next:1-A,q:dq,by:d};
}
function fatigue(m,n){
  for(let i=0;i<2;i++){const s=m.sides[i];const on=new Set(onCourt(s,m.serving===i).map(x=>x.p.id));
    for(const p of s.pl){if(on.has(p.id))p.en=Math.max(30,p.en-(0.22+0.12*n)*(1.35-p.kon/20)*(1.2-p.zaa/20*0.4)*(s.fatMul||1));else p.en=Math.min(100,p.en+0.25);}}
}
function startSet(m){
  m.setNo++;m.score=[0,0];m.run={t:-1,n:0};
  for(const s of m.sides){s.rot=[0,1,2,3,4,5];s.to=2;s.subs=6;s.mom=0;s.form=s.form*0.5+nz()*0.06+(s.home?0.0075:0);for(const p of s.pl)p.en=Math.min(100,p.en+12);}
  m.serving=m.setNo===5?(R()<0.5?0:1):(m.firstServe+m.setNo-1)%2;
}
function stepRally(m){
  const ex={n:0};
  const r=rally(m,ex);
  m.rallies++;
  const recv=1-m.serving;m.sideout[1]++;if(r.winner===recv)m.sideout[0]++;
  fatigue(m,ex.n);
  const w=r.winner;m.score[w]++;(m.hist=m.hist||[]).push([m.setNo,m.score[0],m.score[1]]);
  if(m.run.t===w)m.run.n++;else m.run={t:w,n:1};
  const ws=m.sides[w],ls=m.sides[1-w];ws.mom=Math.min(3,Math.max(0,ws.mom)+1);ls.mom=0;
  if(w!==m.serving){m.serving=w;ws.rot.push(ws.rot.shift());}
  const ev=Object.assign({},r,{score:m.score.slice(),setNo:m.setNo});
  const tgt=m.setNo===5?15:25;
  if(m.score[w]>=tgt&&m.score[w]-m.score[1-w]>=2){
    m.sets.push(m.score.slice());m.setsWon[w]++;ev.setEnd=true;ev.setWinner=w;
    if(m.setsWon[w]===3){m.over=true;m.winner=w;ev.matchEnd=true;}else startSet(m);
  }
  return ev;
}

    p.high=prev==='set'||prev==='srv'||prev==='rec'||prev==='dig';p.fast=prev==='att';p.kind=t.k;pts.push(p);prev=t.k;}
  if(pts.length<2){done();return;}

  const label={ace:'AS!',block:'BLOK!',kill:'PUNKT',serr:'BŁĄD ZAGRYWKI',attErr:'BŁĄD ATAKU',setErr:'BŁĄD'}[ev.type]||'PUNKT';

    const a=pts[i],b=pts[i+1];const dur=b.fast?base*0.5:base;const arc=b.fast?H*0.02:H*(b.high?0.24:0.12);const t0=performance.now();
    const step=now=>{const t=Math.min(1,(now-t0)/dur);const k=4*t*(1-t);

function libColor(c,o){const pal=['#fde047','#e5e7eb','#f472b6','#a3e635','#fb923c','#1f2937'];return pal.map(p=>[p,Math.min(cdist(p,c),o?cdist(p,o):999)]).sort((a,b)=>b[1]-a[1])[0][0];}
function jersey(p,color,isLib,opp){
  const c=isLib?libColor(color,opp):color,ink=lum(c)>0.6?'#111827':'#ffffff',edge=lum(c)>0.6?'#00000055':'#ffffff55';
  const name=p.last.toUpperCase();const tl=name.length>8?` textLength="34" lengthAdjust="spacingAndGlyphs"`:'';
  return `<svg viewBox="0 0 60 56" class="jer"><path d="M19 3 L25 5 Q30 9 35 5 L41 3 L58 13 L52 25 L46 22 L46 54 L14 54 L14 22 L8 25 L2 13 Z" fill="${c}" stroke="${edge}" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M25 5 Q30 11 35 5" fill="none" stroke="${edge}" stroke-width="2"/><path d="M8 25 L2 13 M52 25 L58 13" stroke="${edge}" stroke-width="3"/>
  <text x="30" y="21" text-anchor="middle" font-size="7" font-weight="700" fill="${ink}"${tl}>${esc(name)}</text>
  <text x="30" y="45" text-anchor="middle" font-size="21" font-weight="900" fill="${ink}" font-family="Impact,Arial Black,system-ui,sans-serif">${p.num}</text></svg>`;
}
function chip(x,side,i,mine){
  const p=x.p;const hl=ui.match.hl.includes(p.id);const srv=ui.match.serving===i&&x.zone===0;
  return `<div class="pl ${hl?'hl':''} ${mine?'click':''}" data-pid="${p.id}" ${mine?`onclick="selSub(${x.slot==='L'?"'L'":x.slot})"`:''} title="${esc(p.first+' '+p.last)} — ${POS_NAMES[x.role]}">
  ${jersey(p,side.team.color,x.role==='L',ui.match.sides[1-i].team.color)}${srv?'<span class="ball">🏐</span>':''}<span class="rl">${POS_SHORT[x.role]}</span><span class="en"><i style="width:${p.en}%;background:${p.en>75?'var(--good)':p.en>55?'#eab308':'var(--bad)'}"></i></span></div>`;
}
function courtHtml(m){

function teamTotals(s){const t={pts:0,kill:0,att:0,attErr:0,blk:0,ace:0,srvErr:0,rec:0,recPos:0,recErr:0,blocked:0};for(const p of s.pl){const x=p.st;t.kill+=x.kill;t.att+=x.att;t.attErr+=x.attErr;t.blk+=x.blk;t.ace+=x.ace;t.srvErr+=x.srvErr;t.rec+=x.rec;t.recPos+=x.recPos;t.recErr+=x.recErr;t.blocked+=x.blocked;}t.pts=t.kill+t.blk+t.ace;return t;}
const pc=(a,b)=>b?Math.round(a/b*100)+'%':'–';
function histChart(m){
  const h=m.hist||[];if(!h.length)return '';
  const sets={};for(const [sn,a,b] of h)(sets[sn]=sets[sn]||[]).push(a-b);
  const c0=m.sides[0].team.color,c1=m.sides[1].team.color;
  const cell=(sn,arr)=>{const n=Math.max(arr.length,sn==5?20:45),W=260,Hh=90,mid=Hh/2,mx=Math.max(6,...arr.map(Math.abs)),bw=W/n,sc=(mid-6)/mx;
    const bars=arr.map((d,i)=>d===0?'':`<rect x="${(i*bw).toFixed(1)}" y="${d>0?mid-d*sc:mid}" width="${Math.max(1,bw-0.8).toFixed(1)}" height="${Math.abs(d)*sc}" fill="${d>0?c0:c1}"/>`).join('');
    const last=h.filter(x=>x[0]==sn).slice(-1)[0];
    return `<div class="hc"><div class="small mut">Set ${sn}: <b style="color:var(--txt)">${last[1]}:${last[2]}</b></div><svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#ffffff40"/>${bars}</svg></div>`;};
  return `<div class="hcs">${Object.keys(sets).map(sn=>cell(+sn,sets[sn])).join('')}</div><p class="mut small">Przewaga w punktach po każdej akcji: w górę ${esc(m.sides[0].team.short)}, w dół ${esc(m.sides[1].team.short)}.</p>`;
}
function attackShare(sd){const tot=sd.pl.reduce((s,p)=>s+p.st.att,0);if(!tot)return '';

function statsBlock(m){

function rebuildIndex(){PLAYERS={};if(SAVE.world){for(const p of SAVE.world.players)PLAYERS[p.id]={p,t:p.tm>=0&&!p.jr?TEAMS[p.tm]:null};}else for(const t of TEAMS)for(const p of t.players)PLAYERS[p.id]={p,t};}

const N_SPAR=7;
function S(){return SAVE.season;}
function makeFixtures(n){const t=[...Array(n).keys()].sort(()=>R()-0.5);const rounds=[];for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];pr.push(r%2?[b,a]:[a,b]);}rounds.push(pr);t.splice(1,0,t.pop());}return rounds;}
function newSeason(n,phase){
  const first=makeFixtures(TEAMS.length);const second=first.map(rd=>rd.map(([h,a])=>[a,h]));
  const others=TEAMS.map(t=>t.idx).filter(i=>i!==SAVE.team).sort(()=>R()-0.5).slice(0,N_SPAR);
  SAVE.season={n:n||1,phase:phase||'spar',spar:{opps:others,res:[]},rounds:first.concat(second),round:0,results:[],po:null,final:null,ps:{}};
  if(SAVE.world)for(const p of SAVE.world.players)p.base=snap(p);

}
const PHASE_NAMES={off:'Okno transferowe',spar:'Okres przygotowawczy',liga:'Faza zasadnicza',po:'Play-off',end:'Koniec sezonu'};

// ---- tabela ----
function leagueTable(){return tableFrom(S().results);}
function tableFrom(results){const T=TEAMS.map(t=>({i:t.idx,m:0,w:0,l:0,pts:0,sw:0,sl:0,pw:0,pl:0}));
  for(const rd of results)for(const g of rd){const h=T[g.h],a=T[g.a];h.m++;a.m++;h.sw+=g.sw[0];h.sl+=g.sw[1];a.sw+=g.sw[1];a.sl+=g.sw[0];
    for(const st of g.sets){h.pw+=st[0];h.pl+=st[1];a.pw+=st[1];a.pl+=st[0];}
    const hw=g.sw[0]===3,W=hw?h:a,Lo=hw?a:h,ls=Math.min(...g.sw);W.w++;Lo.l++;W.pts+=ls<=1?3:2;Lo.pts+=ls===2?1:0;}
  const ratio=(x,y)=>y?x/y:x?99:0;
  return T.sort((x,y)=>y.pts-x.pts||y.w-x.w||ratio(y.sw,y.sl)-ratio(x.sw,x.sl)||ratio(y.pw,y.pl)-ratio(x.pw,x.pl));}
function rankOf(i){return leagueTable().findIndex(x=>x.i===i)+1;}

function participant(i,home){const t=TEAMS[i];const mine=i===SAVE.team;return {team:t,lineup:mine?healthyLineup(t,myLineup()).lu:autoLineup(t),tactics:mine?Object.assign({},myTac()):{serve:1,dist:0},home,x:(()=>{const md=clubMods(i);const o={hb:md.hb,fat:md.fat,sb:md.sb};if(mine){const cx=coachMatchX();o.sb+=cx.sb||0;o.momMul=cx.momMul;o.prB=cx.prB;o.trB=cx.trB;}return o;})()};}
function resultOf(m,h,a){const flip=m.sides[0].team.idx!==h;return {h,a,sets:m.sets.map(x=>flip?[x[1],x[0]]:x.slice()),sw:flip?[m.setsWon[1],m.setsWon[0]]:m.setsWon.slice()};}
function recordStats(m){const s=S();const ps=s.ps;const ts=s.ts||(s.ts={});
  m.sides.forEach((sd,i)=>{const r=ts[sd.team.idx]||(ts[sd.team.idx]={m:0,sets:0,kill:0,att:0,attErr:0,blk:0,ace:0,srvErr:0,srv:0,rec:0,recPos:0,dig:0,pw:0,pl:0});
    r.m++;r.sets+=m.sets.length;for(const st of m.sets){r.pw+=st[i];r.pl+=st[1-i];}
    for(const p of sd.pl){const x=p.st;r.kill+=x.kill;r.att+=x.att;r.attErr+=x.attErr;r.blk+=x.blk;r.ace+=x.ace;r.srvErr+=x.srvErr;r.srv+=x.srv;r.rec+=x.rec;r.recPos+=x.recPos;r.dig+=x.dig;}});
  for(const sd of m.sides)for(const p of sd.pl){const x=p.st;if(x.srv+x.rec+x.att+x.dig+x.blk===0)continue;
    const r=ps[p.id]||(ps[p.id]={m:0,pts:0,kill:0,att:0,attErr:0,blk:0,ace:0,srvErr:0,rec:0,recPos:0,dig:0,mvp:0});
    r.m++;r.kill+=x.kill;r.att+=x.att;r.attErr+=x.attErr;r.blk+=x.blk;r.ace+=x.ace;r.srvErr+=x.srvErr;r.rec+=x.rec;r.recPos+=x.recPos;r.dig+=x.dig;r.pts+=x.kill+x.blk+x.ace;}
  const w=m.sides[m.winner];const mvp=w.pl.slice().sort((a,b)=>mvpScore(b)-mvpScore(a))[0];if(ps[mvp.id])ps[mvp.id].mvp++;
  injuryCheck(m,1);}
function simFixture(h,a,stats){const m=simMatch(participant(h,true),participant(a,false));if(stats)recordStats(m);return resultOf(m,h,a);}

// ---- mecz użytkownika ----
function myNext(){
  const s=S();
  if(s.phase==='spar'){const k=s.spar.res.length;if(k>=N_SPAR)return null;const o=s.spar.opps[k];return k%2===0?{kind:'spar',h:SAVE.team,a:o}:{kind:'spar',h:o,a:SAVE.team};}
  if(s.phase==='liga'){const f=s.rounds[s.round].find(f=>f[0]===SAVE.team||f[1]===SAVE.team);return {kind:'liga',h:f[0],a:f[1]};}
  if(s.phase==='po'){const sr=activeSeries().find(x=>x.hi===SAVE.team||x.lo===SAVE.team);if(!sr)return null;const h=seriesHome(sr);return {kind:'po',sid:sr.id,h,a:h===sr.hi?sr.lo:sr.hi};}
  return null;
}
function buildMatch(ctx){
  const meHome=ctx.h===SAVE.team;const op=meHome?ctx.a:ctx.h;
  const m=newMatch(participant(SAVE.team,meHome),participant(op,!meHome));
  m.log=[];m.paused=false;m.hl=[];m.ctx=ctx;
  m.log.push({t:`${ctx.kind==='spar'?'Sparing':ctx.kind==='po'?'Play-off':'Liga'} · ${meHome?'mecz u siebie':'mecz wyjazdowy'}. Losowanie: seta zaczyna zagrywką <b>${esc(m.sides[m.serving].team.name)}</b>.`,c:'sys'});
  return m;
}
function playNext(){if(SAVE.fired)return;const c=myNext();if(!c)return;const m=buildMatch(c);ui.match=m;ui.view='log';ui.subSel=null;ui.tab='mecz';persistLive();render();schedule();}
function simNext(){if(SAVE.fired)return;const c=myNext();if(!c)return;const m=buildMatch(c);m.quick=true;while(!m.over)doRally(m);ui.match=m;ui.view='post';ui.tab='mecz';render();}
function finishMatch(m){
  if(m.recorded||!m.ctx)return;m.recorded=true;const c=m.ctx,s=S();
  const res=resultOf(m,c.h,c.a);res.me=true;res.d=today();
  if(c.kind==='spar'){s.spar.res.push(res);injuryCheck(m,0.5);roundTick('spar',false);}
  else if(c.kind==='liga'){recordStats(m);boardAfterMatch(res);const rd=[];for(const f of s.rounds[s.round]){if(f[0]===c.h&&f[1]===c.a)rd.push(res);else rd.push(simFixture(f[0],f[1],true));}
    s.results.push(rd);simJrRound(s.round);s.round++;roundTick('liga',c.h===SAVE.team);if(s.round>=s.rounds.length)startPlayoff();}
  else if(c.kind==='po'){recordStats(m);boardAfterMatch(res);playPoDay(c.sid,res);roundTick('po',c.h===SAVE.team);}
  syncDate();SAVE.live=null;save();
}
function skipSpar(){const s=S();s.phase='liga';syncDate();save();render();}
function endSpar(){const s=S();if(s.phase==='spar'&&s.spar.res.length>=N_SPAR){s.phase='liga';syncDate();save();}}
function simRound(){/* runda bez meczu użytkownika nie występuje w lidze */}

// ---- play-off ----
function mkSeries(st,a,b,need){const ra=rankOf(a),rb=rankOf(b);const hi=ra<rb?a:b,lo=hi===a?b:a;return {id:st+'-'+hi+'-'+lo,st,hi,lo,need,w:[0,0],games:[]};}
function startPlayoff(){const s=S();const tb=leagueTable().map(x=>x.i);s.seed=tb;s.phase='po';
  s.po={stage:'QF',day:0,series:[mkSeries('QF',tb[0],tb[7],2),mkSeries('QF',tb[3],tb[4],2),mkSeries('QF',tb[1],tb[6],2),mkSeries('QF',tb[2],tb[5],2)]};}
function seriesDone(sr){return sr.w[0]>=sr.need||sr.w[1]>=sr.need;}
function seriesWinner(sr){return sr.w[0]>=sr.need?sr.hi:sr.lo;}
function seriesLoser(sr){return sr.w[0]>=sr.need?sr.lo:sr.hi;}
function seriesHome(sr){return sr.games.length%2===0?sr.hi:sr.lo;}
function activeSeries(){const s=S();if(!s.po)return [];const st=s.po.stage;return s.po.series.filter(x=>(st==='FB'?(x.st==='F'||x.st==='B'):x.st===st)&&!seriesDone(x));}
function addGame(sr,res){sr.games.push(res);const hiWon=(res.h===sr.hi)===(res.sw[0]===3);sr.w[hiWon?0:1]++;}
function playPoDay(mySid,myRes){
  const s=S();
  for(const sr of activeSeries()){if(sr.id===mySid){addGame(sr,myRes);continue;}const h=seriesHome(sr);const g=simFixture(h,h===sr.hi?sr.lo:sr.hi,true);g.d=today();addGame(sr,g);}
  s.po.day++;advanceStage();
}
function advanceStage(){
  const s=S(),po=s.po;if(activeSeries().length)return;
  const seedRank=i=>s.seed.indexOf(i);
  if(po.stage==='QF'){const w=po.series.filter(x=>x.st==='QF').map(seriesWinner).sort((a,b)=>seedRank(a)-seedRank(b));
    po.series.push(mkSeriesSeed('SF',w[0],w[3],2),mkSeriesSeed('SF',w[1],w[2],2));po.stage='SF';}
  else if(po.stage==='SF'){const sf=po.series.filter(x=>x.st==='SF');
    po.series.push(mkSeriesSeed('F',seriesWinner(sf[0]),seriesWinner(sf[1]),3),mkSeriesSeed('B',seriesLoser(sf[0]),seriesLoser(sf[1]),2));po.stage='FB';}
  else if(po.stage==='FB'){finishSeason();}
}
function mkSeriesSeed(st,a,b,need){const s=S();const hi=s.seed.indexOf(a)<s.seed.indexOf(b)?a:b;const lo=hi===a?b:a;return {id:st+'-'+hi+'-'+lo,st,hi,lo,need,w:[0,0],games:[]};}
function simPoDay(){if(S().phase!=='po')return;const mine=myNext();if(mine)return;playPoDay(null,null);roundTick('po',false);syncDate();save();render();}
function simPoAll(){while(S().phase==='po'&&!myNext()){playPoDay(null,null);roundTick('po',false);syncDate();}save();render();}
function finishSeason(){
  const s=S(),po=s.po,ser=st=>po.series.filter(x=>x.st===st);
  const F=ser('F')[0],B=ser('B')[0];
  const qfL=ser('QF').map(seriesLoser).sort((a,b)=>s.seed.indexOf(a)-s.seed.indexOf(b));
  s.final=[seriesWinner(F),seriesLoser(F),seriesWinner(B),seriesLoser(B)].concat(qfL,s.seed.slice(8));
  s.phase='end';s.endDate=addDays(s.podates[Math.max(0,s.po.day-1)],3);
  s.final.forEach((ti,pl)=>{const a=SAVE.ai[ti];a.rep=Math.round(clamp(a.rep*0.75+(95-pl*7)*0.25,10,100));});
  const myPl=s.final.indexOf(SAVE.team);money(PRIZE[myPl],'Nagrody');finLog(`Nagroda za ${myPl+1}. miejsce w sezonie ${sLabel(s.n)}`,PRIZE[myPl]);
  SAVE.history=SAVE.history||[];SAVE.history.push({n:s.n,team:SAVE.team,place:s.final.indexOf(SAVE.team)+1,champ:s.final[0],league:s.seed.indexOf(SAVE.team)+1});
  seasonEvaluation();
}
function nextSeason(){if(SAVE.fired)return;offseason();coachOffseason();ui.tab='mecz';render();}

function resTxt(g){return `${tName(g.h)} <b>${g.sw[0]}:${g.sw[1]}</b> ${tName(g.a)} <small class="mut">(${g.sets.map(s=>s[0]+':'+s[1]).join(', ')})</small>`;}

  const meHome=c.h===SAVE.team,op=TEAMS[meHome?c.a:c.h];
  const w=nextEvent();const when=w?`<div class="when">📅 ${w.d===today()?'Dziś, ':''}${fmtLong(w.d)}${w.t?' · godz. '+w.t:''}</div>`:'';
  return `<div class="card nextm"><div class="mut small">${title}</div>${when}<div class="vs"><span style="--c:${TEAMS[c.h].color}">${tName(c.h)}</span><b>vs</b><span style="--c:${TEAMS[c.a].color}">${tName(c.a)}</span></div>
  <p class="small mut">${meHome?'Mecz u siebie (lekka przewaga własnej hali)':'Mecz wyjazdowy'} · Rywal: siła ${teamStrength(op)} ${stars(teamStrength(op))} · Twój skład: ${lineupStrength(myTeam(),myLineup())} · Zagrywka: ${SERVE_OPT[myTac().serve][0]} · Rozegranie: ${DIST_OPT[myTac().dist][0]}</p>

}

function tableHtml(highlightPo){const tb=leagueTable();
  return `<div class="card"><h2>Tabela</h2><div class="tw"><table><thead><tr><th>#</th><th class="l">Drużyna</th><th>M</th><th>Z</th><th>P</th><th>Pkt</th><th>Sety</th><th>Małe pkt</th></tr></thead><tbody>${tb.map((x,i)=>`<tr class="${x.i===SAVE.team?'starter':''} ${i===7?'cut':''}"><td>${i+1}</td><td class="l">${tDot(x.i)}${tName(x.i)}</td><td>${x.m}</td><td>${x.w}</td><td>${x.l}</td><td><b>${x.pts}</b></td><td>${x.sw}:${x.sl}</td><td>${x.pw}:${x.pl}</td></tr>`).join('')}</tbody></table></div>
  <p class="mut small">Miejsca 1–8 grają w play-off. Punktacja: 3:0 i 3:1 to 3 pkt, 3:2 to 2 pkt dla zwycięzcy i 1 pkt dla przegranego.</p></div>`;}
function seasonView(){
  const s=S();let out='';
  if(SAVE.fired)return `<div class="phase">📅 <b>${fmtLong(today())}</b> · Sezon ${sLabel(s.n)}</div>`+firedView()+newsHtml();
  if(s.phase==='off')return `<div class="phase">📅 <b>${fmtLong(today())}</b> · Sezon ${sLabel(s.n)} · ${PHASE_NAMES.off}</div>`+offView()+newsHtml();
  const head=(ui.msg?`<div class="card msg">${ui.msg}</div>`:'')+`<div class="phase">📅 <b>${fmtLong(today())}</b> · Sezon ${sLabel(s.n)} · ${PHASE_NAMES[s.phase]}${s.phase==='liga'?` · kolejka ${s.round+1}/${s.rounds.length}`:''}${s.phase==='spar'?` · sparing ${Math.min(s.spar.res.length+1,N_SPAR)}/${N_SPAR}`:''}</div>`;
  const headB=head+boardCard();
  if(s.phase==='spar'){
    const c=myNext();
    out+=c?nextCard(c,`Sparing ${s.spar.res.length+1}/${N_SPAR} — mecz towarzyski, nie liczy się do tabeli`):`<div class="card"><h2>Sparingi zakończone</h2><button class="btn" onclick="endSpar();render()">Rozpocznij ligę</button></div>`;
    out+=`<div class="card row wrap"><span class="mut small">Sparingi służą do testowania składu i taktyki.</span><span class="sp"></span><button class="ghost" onclick="skipSpar()">Pomiń sparingi i zacznij ligę</button></div>`;
    if(s.spar.res.length)out+=`<div class="card"><h2>Wyniki sparingów</h2>${s.spar.res.map((g,k)=>`<div class="res me"><span class="mut small">${fmtShort(s.sdates[k])}</span> ${resTxt(g)}</div>`).join('')}</div>`;
    return headB+`<div class="card small">🔓 Okno transferowe jest otwarte do końca sparingów. <button class="link" onclick="go('transfery')">Transfery</button></div>`+out+newsHtml();
  }
  if(s.phase==='liga'){
    out+=nextCard(myNext(),`Kolejka ${s.round+1}/${s.rounds.length}`)+tableHtml();
    if(s.results.length)out+=`<div class="card"><h2>Ostatnia kolejka <small class="mut">(${fmtMid(addDays(s.rdates[s.results.length-1],-1))} – ${fmtMid(addDays(s.rdates[s.results.length-1],1))})</small></h2>${s.results[s.results.length-1].map(g=>`<div class="res ${g.me?'me':''}">${resTxt(g)}</div>`).join('')}
      <details><summary class="link">Wszystkie wyniki</summary>${s.results.map((rd,i)=>`<div class="rd"><div class="mut small">Kolejka ${i+1}</div>${rd.map(g=>`<div class="res ${g.me?'me':''}">${resTxt(g)}</div>`).join('')}</div>`).reverse().join('')}</details></div>`;
    out+=`<div class="card"><h2>Twój terminarz</h2><div class="sched">${s.rounds.map((rd,i)=>{const g=rd.find(x=>x[0]===SAVE.team||x[1]===SAVE.team);const r=s.results[i]&&s.results[i].find(x=>x.me);const home=g[0]===SAVE.team;const op=home?g[1]:g[0];
      const won=r&&((r.h===SAVE.team)===(r.sw[0]===3));
      const wd=fixtureWhen(s,i,g);return `<div class="res ${i===s.round?'me':''}"><span class="mut small">K${i+1} · ${fmtShort(wd.d)} ${wd.t}</span> ${home?'🏠':'✈️'} ${tDot(op)}${tName(op)} ${r?`<b class="${won?'good':'bad'}">${home?r.sw[0]+':'+r.sw[1]:r.sw[1]+':'+r.sw[0]}</b>`:''}</div>`;}).join('')}</div></div>`;
    return headB+out+newsHtml();
  }
  if(s.phase==='po'){

   <p>${esc(myTeam().name)} kończy sezon ${sLabel(s.n)} na <b>${my}. miejscu</b>.${s.eval?` Cel zarządu (${GOAL_TXT[s.eval.goal]}): ${s.eval.met?'<b class="good">wykonany ✓</b>':'<b class="bad">niewykonany ✗</b>'} · reputacja trenera ${s.eval.dr>=0?'+':''}${s.eval.dr}.`:''}</p>${awardsHtml()}${SAVE.offers&&SAVE.offers.length?`<div class="card"><h3>📨 Oferty pracy dla Ciebie</h3>${offersList(false)}</div>`:''}<button class="btn" onclick="nextSeason()">Przejdź do okna transferowego (sezon ${sLabel(s.n+1)})</button></div>
   <div class="card"><h2>Klasyfikacja końcowa</h2>${f.map((t,i)=>`<div class="res ${t===SAVE.team?'me':''}"><b>${i+1}.</b> ${i<3?['🥇','🥈','🥉'][i]:''} ${tDot(t)}${tName(t)}</div>`).join('')}</div>`;
  if(SAVE.history&&SAVE.history.length>1)out+=`<div class="card"><h2>Historia</h2>${SAVE.history.map(h=>`<div class="res">Sezon ${sLabel(h.n)}: ${tName(h.team)} — ${h.place}. miejsce (po fazie zasadniczej ${h.league}.) · mistrz: ${tName(h.champ)}</div>`).join('')}</div>`;
  return headB+out+bracketHtml();
}
const STAGE={QF:'Ćwierćfinał',SF:'Półfinał',F:'Finał',B:'Mecz o 3. miejsce'};
function seriesScore(sr){return `${sr.w[0]}:${sr.w[1]}`;}
function bracketHtml(){const s=S();if(!s.po)return '';
  const col=st=>{const list=s.po.series.filter(x=>x.st===st);if(!list.length)return `<div class="bcol"><h4>${STAGE[st]}</h4><div class="mut small">—</div></div>`;
    return `<div class="bcol"><h4>${STAGE[st]}</h4>${list.map(sr=>{const d=seriesDone(sr),w=d?seriesWinner(sr):-1;
      return `<div class="ser ${sr.hi===SAVE.team||sr.lo===SAVE.team?'mine':''}"><div class="${w===sr.hi?'win':''}">${tDot(sr.hi)}<span class="mut small">${s.seed.indexOf(sr.hi)+1}.</span> ${tName(sr.hi)}<b>${sr.w[0]}</b></div><div class="${w===sr.lo?'win':''}">${tDot(sr.lo)}<span class="mut small">${s.seed.indexOf(sr.lo)+1}.</span> ${tName(sr.lo)}<b>${sr.w[1]}</b></div>
      ${sr.games.length?`<div class="mut small">${sr.games.map(g=>`${TEAMS[g.h].short} ${g.sw[0]}:${g.sw[1]} ${TEAMS[g.a].short}`).join(' · ')}</div>`:''}</div>`;}).join('')}</div>`;};
  return `<div class="card"><h2>Play-off</h2><div class="bracket">${col('QF')}${col('SF')}${col('F')}${col('B')}</div><p class="mut small">Ćwierćfinały, półfinały i mecz o 3. miejsce do 2 zwycięstw, finał do 3. Wyżej rozstawiony gra u siebie mecze 1, 3 i 5.</p></div>`;}
function awardsHtml(){const L=leaders();const top=(k)=>L[k][0];
  const a=[['MVP sezonu (najwięcej nagród MVP meczu)','mvp'],['Najlepiej punktujący','pts'],['Najlepiej blokujący','blk'],['Najlepiej zagrywający (asy)','ace']];

// ---- statystyki ----
function leaders(){const ps=S().ps;const arr=Object.entries(ps).map(([id,r])=>Object.assign({id},r));
  const by=(f,min)=>arr.filter(x=>!min||min(x)).map(x=>({id:x.id,v:f(x),r:x})).sort((a,b)=>b.v-a.v).slice(0,10);

function serMatch(m){return {sides:m.sides.map(s=>({ti:s.team.idx,pl:s.pl.map(p=>({id:p.id,en:p.en,st:p.st})),slots:s.slots.map(x=>({role:x.role,id:x.p.id})),lib:s.libero.id,rot:s.rot,tactics:s.tactics,mom:s.mom,home:s.home,fatMul:s.fatMul,momMul:s.momMul,prB:s.prB,trB:s.trB,form:s.form,to:s.to,subs:s.subs})),
  setNo:m.setNo,score:m.score,setsWon:m.setsWon,sets:m.sets,firstServe:m.firstServe,serving:m.serving,run:m.run,rallies:m.rallies,sideout:m.sideout,log:m.log.slice(-150),ctx:m.ctx,hist:m.hist||[]};}
function deserMatch(o){const m=Object.assign({},o,{over:false,paused:true,hl:[]});
  m.sides=o.sides.map(x=>{const t=TEAMS[x.ti];const pl=t.players.map(cloneP);const g=id=>pl.find(p=>p.id===id);
    for(const q of x.pl){const p=g(q.id);p.en=q.en;p.st=q.st;}
    return {team:t,pl,slots:x.slots.map(s=>({role:s.role,p:g(s.id)})),libero:g(x.lib),rot:x.rot,tactics:x.tactics,mom:x.mom,home:x.home,fatMul:x.fatMul||1,momMul:x.momMul||1,prB:x.prB||0,trB:x.trB||0,form:x.form,to:x.to,subs:x.subs};});
  return m;}
function persistLive(){const m=ui.match;SAVE.live=m&&!m.over&&m.ctx?serMatch(m):null;save();}
let storageOk=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));storageOk=true;}catch(e){storageOk=false;}}
function slotKey(i){return KEY+'_slot'+i;}
function slotInfo(i){try{const o=JSON.parse(localStorage.getItem(slotKey(i)));return o;}catch(e){return null;}}
function descSave(o){if(!o||o.team==null)return 'pusty';const s=o.season;return `${esc(TEAMS[o.team].name)} · sezon ${s?sLabel(s.n):''} · ${s?PHASE_NAMES[s.phase]:''}${s&&s.phase==='liga'?' (kolejka '+(s.round+1)+')':''}${o.savedAt?' · '+esc(o.savedAt):''}`;}
function saveSlot(i){persistLive();const o=Object.assign({},SAVE,{savedAt:new Date().toLocaleString('pl-PL')});try{localStorage.setItem(slotKey(i),JSON.stringify(o));ui.msg=`Zapisano w slocie ${i}.`;}catch(e){ui.msg='Nie udało się zapisać — przeglądarka blokuje pamięć. Użyj kodu zapisu.';}render();}
function loadObj(o){clearTimeout(timer);SAVE=o;delete SAVE.savedAt;restoreDefs();if(!SAVE.world)initWorld();else syncTeams();migrateDates();initClub();ui.match=SAVE.live?deserMatch(SAVE.live):null;ui.confirm=null;ui.card=null;save();}
function loadSlot(i){const o=slotInfo(i);if(!o)return;loadObj(o);ui.msg=`Wczytano slot ${i}.`;ui.tab='mecz';render();}
function delSlot(i){if(ui.confirm!=='del'+i){ui.confirm='del'+i;render();return;}try{localStorage.removeItem(slotKey(i));}catch(e){}ui.confirm=null;ui.msg=`Usunięto slot ${i}.`;render();}
function exportCode(){persistLive();ui.code=btoa(unescape(encodeURIComponent(JSON.stringify(SAVE))));render();}
function copyCode(){const t=ui.code;try{navigator.clipboard.writeText(t).then(()=>{ui.msg='Skopiowano kod zapisu.';render();},()=>{ui.msg='Nie udało się skopiować — zaznacz kod i skopiuj ręcznie.';render();});}catch(e){ui.msg='Nie udało się skopiować — zaznacz kod i skopiuj ręcznie.';render();}}
function importCode(){const v=($('#imp')||{}).value||'';try{const o=JSON.parse(decodeURIComponent(escape(atob(v.trim()))));if(o.team==null||!o.season)throw 0;loadObj(o);ui.msg='Wczytano grę z kodu.';ui.code=null;ui.tab='mecz';}catch(e){ui.msg='Ten kod zapisu jest nieprawidłowy.';}render();}
function newGame(){if(ui.confirm!=='new'){ui.confirm='new';render();return;}clearTimeout(timer);SAVE={};resetTeams();ui.match=null;ui.confirm=null;save();render();}

function teamStatsHtml(){const ts=S().ts;if(!ts)return '';
  const cols=[['Atak %',r=>r.kill/r.att*100,1,1],['Błędy ataku / set',r=>r.attErr/r.sets,2,-1],['Bloki / set',r=>r.blk/r.sets,2,1],['Asy / set',r=>r.ace/r.sets,2,1],['Błędy zagr. / set',r=>r.srvErr/r.sets,2,-1],['Przyjęcie poz. %',r=>r.recPos/r.rec*100,1,1],['Obrony / set',r=>r.dig/r.sets,1,1],['Małe pkt / set',r=>(r.pw-r.pl)/r.sets,2,1]];
  const rows=Object.entries(ts).map(([i,r])=>({i:+i,r}));
  const best=cols.map(([,f,,dir])=>{const v=rows.map(x=>f(x.r));return dir>0?Math.max(...v):Math.min(...v);});
  const sk=ui.tsort||0;rows.sort((a,b)=>(cols[sk][1](b.r)-cols[sk][1](a.r))*cols[sk][3]);
  return `<div class="card"><h2>Drużyny</h2><div class="tw"><table><thead><tr><th class="l">Drużyna</th><th>M</th>${cols.map(([l],j)=>`<th onclick="ui.tsort=${j};render()" class="${sk===j?'on':''}">${l}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(({i,r})=>`<tr class="${i===SAVE.team?'starter':''}"><td class="l">${tDot(i)}${tName(i)}</td><td>${r.m}</td>${cols.map(([,f,d],j)=>{const v=f(r);return `<td class="${Math.abs(v-best[j])<1e-9?'best':''}">${v.toFixed(d).replace('.',',')}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="mut small">Liga i play-off. Najlepsza wartość w kolumnie jest wyróżniona. Kliknij nagłówek, żeby posortować.</p></div>`;}
// ================= ZARZĄDZANIE KLUBEM (Etap 3) =================
const POS_MIN={R:2,A:2,P:3,S:3,L:1};
const POS_STD={R:2,A:2,P:4,S:4,L:2};
const SQUAD_MAX=18,SQUAD_MIN=12;
const ALL_KEYS=ALL_ATTRS.map(a=>a[0]);
const PRIZE=[1000000,600000,400000,300000,150000,150000,150000,150000,50000,50000,50000,50000];
let ROUND_PLAYED=new Set();
function W(){return SAVE.world;}
function fmt(n){n=Math.round(n);const a=Math.abs(n);let s;if(a>=1e6)s=(n/1e6).toFixed(2).replace('.',',')+' mln';else if(a>=1e3)s=Math.round(n/1e3)+' tys.';else s=String(n);return s+' zł';}
function fmtFull(n){return Math.round(n).toLocaleString('pl-PL')+' zł';}
function round5k(x){return Math.max(5000,Math.round(x/5000)*5000);}
function pValue(p){const r=rating(p);const af=p.age<=22?1.35:p.age<=28?1.1:p.age<=31?0.85:p.age<=33?0.55:0.3;const pf=1+Math.max(0,(p.pot||r)-r)/35;return Math.max(10000,Math.round(Math.pow(Math.max(0,r-50)/40,2.5)*1500000*af*pf/10000)*10000);}
function wageDemand(p){const r=rating(p);return round5k(Math.max(40000,Math.pow(Math.max(0,r-45)/45,2)*700000)*(p.age>=33?0.8:1));}
function snap(p){const o={};for(const k of ALL_KEYS)o[k]=p[k];return o;}
function baseRating(p){return p.base?rating(Object.assign({},p,p.base)):rating(p);}
function potStars(p){const n=Math.max(1,Math.min(5,Math.round(((p.pot!=null?potSeen(p):rating(p))-62)/7)));return '★'.repeat(n)+'<span class="mut">'+'★'.repeat(5-n)+'</span>';}
function potBonus(age,r){const k=r>=85?0.5:r>=80?0.75:1;return k*(age<=21?3+R()*12:age<=24?2+R()*7:age<=27?R()*3:0);}
function initRep(t){return Math.round(clamp((teamStrength(t)-65)*3.5,20,90));}
function teamQ(t){return teamStrength(t)/5;}
function restoreDefs(){TEAMS.forEach((t,i)=>{const d=TEAM_DEFS[i];t.name=d.name;t.short=d.short;t.color=d.color;t.city='';});applyCustom();}
function resetTeams(){restoreDefs();TEAMS.forEach((t,i)=>{t.players=genTeam(TEAM_DEFS[i],i).players;});rebuildIndex();}
function syncTeams(){for(const t of TEAMS)t.players=W().players.filter(p=>p.tm===t.idx&&!p.jr);rebuildIndex();}
function initPlayerMeta(p,season,free){const r=rating(p);p.pot=Math.min(95,Math.round(r+potBonus(p.age,r)));p.inj=0;p.xp={};p.base=snap(p);
  if(free){p.wage=0;p.ce=0;}else{p.wage=round5k(wageDemand(p)*(0.85+R()*0.3));p.ce=season+(R()<0.2?0:1+Math.floor(R()*3));}}
function randPos(){const x=R()*14;return x<2?'R':x<4?'A':x<8?'P':x<12?'S':'L';}
function genPlayer(pos,q,age){const id='n'+(W().nextId++);
  const p={id,first:FIRST[Math.floor(R()*FIRST.length)],last:LAST[Math.floor(R()*LAST.length)],pos,num:0,age};
  const hh=HEIGHT[pos];p.h=Math.round(hh[0]+R()*(hh[1]-hh[0]));
  for(const [k] of ATTRS.concat(PHYS))p[k]=Math.round(clamp(q+TEMPL[pos][k]+nz()*2.2,1,20));
  for(const [k] of MENTAL)p[k]=Math.round(clamp(q-1+nz()*4,1,20));
  setDob(p);return p;}
function assignNum(p,tm){const used=new Set(W().players.filter(x=>x.tm===tm&&x!==p).map(x=>x.num));if(p.num&&!used.has(p.num))return;for(let n=1;n<=40;n++)if(!used.has(n)){p.num=n;return;}}
function initWorld(){
  resetTeams();
  SAVE.world={players:[],nextId:1};
  const sn=SAVE.season?SAVE.season.n:1;
  for(const t of TEAMS)for(const p0 of t.players){const p=Object.assign({},p0,{tm:t.idx});initPlayerMeta(p,sn,false);setDob(p);W().players.push(p);}
  SAVE.ai=TEAMS.map(t=>({rep:initRep(t),bud:0}));
  for(const a of SAVE.ai)a.bud=round5k(200000+a.rep*15000+R()*300000);
  for(let i=0;i<20;i++){const age=20+Math.floor(R()*13);const p=genPlayer(randPos(),10+R()*3,age);p.tm=-1;initPlayerMeta(p,1,true);W().players.push(p);}
  const rep=SAVE.ai[SAVE.team].rep;
  SAVE.fin={bal:round5k(1000000+rep*15000),log:[],sea:{},prev:null};
  SAVE.training={focus:'bal',int:1};
  SAVE.news=[];SAVE.inbox=[];
  syncTeams();initClub();
}
function news(t){SAVE.news=SAVE.news||[];SAVE.news.unshift({d:today(),t});SAVE.news=SAVE.news.slice(0,40);}
function money(amt,cat){const f=SAVE.fin;f.bal+=amt;f.sea[cat]=(f.sea[cat]||0)+amt;}
function finLog(t,a){const f=SAVE.fin;f.log.unshift({d:today(),t,a});f.log=f.log.slice(0,80);}
function payroll(){return myTeam().players.reduce((s,p)=>s+(p.wage||0),0);}
function sponsorAmt(){return 1800000+SAVE.ai[SAVE.team].rep*30000;}
const TV_ROUND=30000,TICKET=35;
function ticketIncome(mult,est){const rep=SAVE.ai[SAVE.team].rep;const L=myInfra().hala;const att=Math.min(HALA_CAP[L-1],Math.round((1400+rep*25)*(1+0.05*(L-1))*(est?1:0.85+R()*0.3)*mult));return {att,inc:att*TICKET};}

// ---- trening / rozwój / kontuzje ----
const TRAIN_FOCUS=[['bal','Zrównoważony','Rozwój wszystkich cech, z naciskiem na te ważne dla pozycji.',[]],['atk','Atak','Atak, siła, skoczność.',['ata','sil','sko']],['def','Przyjęcie i obrona','Przyjęcie, obrona, odbicie dołem, zwinność.',['prz','obr','tod','zwi']],['blk','Blok','Blok, skoczność, szybkość.',['blo','sko','szy']],['srv','Zagrywka','Zagrywka i siła.',['zag','sil']],['set','Rozegranie','Rozegranie i odbicie palcami.',['roz','tpa']],['phy','Przygotowanie fizyczne','Siła, szybkość, skoczność, zwinność, kondycja.',['sil','szy','sko','zwi','kon']],['men','Mentalny','Koncentracja, opanowanie, zaangażowanie, waleczność.',['kcj','opa','zaa','wal']]];
const TRAIN_INT=[['Lekki',0.7,0.6,'Wolniejszy rozwój, mniej kontuzji.'],['Normalny',1,1,'Balans rozwoju i ryzyka.'],['Ciężki',1.35,1.8,'Szybszy rozwój, ale prawie 2× więcej kontuzji.']];
const GRP={};for(const [k] of ATTRS)GRP[k]='tech';for(const [k] of PHYS)GRP[k]='phys';for(const [k] of MENTAL)GRP[k]='ment';
function develop(p,focus,intI,played,mods,jr){
  const r=rating(p);const gap=(p.pot||r)-r;if(gap<=0)return;
  const af=p.age<=20?1:p.age<=23?0.75:p.age<=26?0.45:p.age<=29?0.2:0.05;
  const pts=af*TRAIN_INT[intI][1]*(played?1.25:1)*Math.min(1.5,0.5+gap/20)*0.17*(mods?(jr?mods.jr:mods.all):1);
  const fk=(TRAIN_FOCUS.find(f=>f[0]===focus)||TRAIN_FOCUS[0])[3];const pw=WEIGHTS[p.pos];
  const w={};let tot=0;for(const k of ALL_KEYS){let x=0.3;if(pw[k])x+=1.5;if(fk.includes(k))x+=3;w[k]=x;tot+=x;}
  p.xp=p.xp||{};
  for(const k of ALL_KEYS){if(p[k]>=20)continue;const v=(p.xp[k]||0)+pts*w[k]/tot*(mods?mods[GRP[k]]:1);if(v>=1){p[k]++;p.xp[k]=Math.round((v-1)*100)/100;}else p.xp[k]=Math.round(v*1000)/1000;}
}
function injuryCheck(m,mult){
  for(const sd of m.sides){const mine=sd.team.idx===SAVE.team;const md=clubMods(sd.team.idx);const im=(mine?TRAIN_INT[SAVE.training.int][2]:1)*md.injChance;
    for(const cp of sd.pl){const x=cp.st;if(x.srv+x.rec+x.att+x.dig+x.blk===0)continue;ROUND_PLAYED.add(cp.id);
      const P=PLAYERS[cp.id];if(!P)continue;const p=P.p;if(p.inj)continue;
      if(R()<0.012*im*(1.3-p.kon/20*0.6)*mult){const d=1+Math.floor(R()*R()*7);const days=Math.max(3,Math.round((d*7-3+R()*6)*md.injDur));p.inj=days;p.injUntil=addDays(today(),days);if(mine)news(`🚑 ${p.first} ${p.last} doznał kontuzji — przerwa ok. ${days} dni (powrót ok. ${fmtDMY(p.injUntil)}).`);}}}
}
function roundTick(kind,home){
  const tr=SAVE.training;
  const MODS={};const mm=ti=>MODS[ti]||(MODS[ti]=clubMods(ti));
  for(const p of W().players){
    if(p.tm<0)continue;const mine=p.tm===SAVE.team;develop(p,mine?tr.focus:'bal',mine?tr.int:1,ROUND_PLAYED.has(p.id),mm(p.tm),p.jr);}
  ROUND_PLAYED=new Set();
  const s=S();
  if(kind==='liga'){money(TV_ROUND,'Prawa TV');
    let t=null;if(home){t=ticketIncome(1);money(t.inc,'Bilety');}
    finLog(`Kolejka ${s.round}: prawa TV${t?`, bilety (${t.att} widzów)`:''}`,TV_ROUND+(t?t.inc:0));}
  if(kind==='po'&&home){const t=ticketIncome(1.5);money(t.inc,'Bilety');finLog(`Play-off: bilety (${t.att} widzów)`,t.inc);}
}

// ---- transfery ----
function windowOpen(){const p=S().phase;return p==='off'||p==='spar';}
function posCount(t,pos){return t.players.filter(p=>p.pos===pos).length;}
function isStarter(p){if(p.tm<0)return false;const lu=autoLineup(TEAMS[p.tm]);return Object.values(lu).includes(p.id);}
function askingPrice(p){return Math.round(pValue(p)*(isStarter(p)?1.35:1.05)/10000)*10000;}
function canSellAI(p){const t=TEAMS[p.tm];return posCount(t,p.pos)-1>=POS_MIN[p.pos]&&t.players.length-1>=SQUAD_MIN;}
function wageNeeded(p){if(p.tm===SAVE.team)return round5k(wageDemand(p)*negF());const my=SAVE.ai[SAVE.team].rep;const cur=p.tm>=0?SAVE.ai[p.tm].rep:0;return round5k(wageDemand(p)*(p.tm<0?0.9:cur>my+10?1.15:1)*negF());}
function contractEndFor(years){const s=S();return (s.phase==='off'?s.n-1:s.n)+years;}
function movePlayer(p,tm){p.tm=tm;if(tm>=0)assignNum(p,tm);syncTeams();}
function tradeMsg(ok,t){ui.tmsg={ok,t};render();}
function makeOffer(pid,fee,wage,years){
  const P=PLAYERS[pid];if(!P)return;const p=P.p;const me=myTeam();
  if(!windowOpen())return tradeMsg(false,'Okno transferowe jest zamknięte (otwarte przed sezonem i w trakcie sparingów).');
  if(me.players.length>=SQUAD_MAX)return tradeMsg(false,`Kadra jest pełna (maks. ${SQUAD_MAX}). Najpierw kogoś sprzedaj albo zwolnij.`);
  fee=p.tm>=0?Math.max(0,Math.round(fee)):0;
  if(p.tm>=0){const club=TEAMS[p.tm].name;
    if(!canSellAI(p))return tradeMsg(false,`${club} nie sprzeda zawodnika — nie ma go kim zastąpić.`);
    const ask=Math.round(askingPrice(p)*(1.05-cA('neg')/200)/10000)*10000;if(fee<ask)return tradeMsg(false,`${club} odrzuca ofertę. Oczekuje co najmniej ${fmt(ask)}.`);}
  if(SAVE.fin.bal-fee<-500000)return tradeMsg(false,'Za mało pieniędzy. Dopuszczalny debet to 500 tys. zł.');
  const need=wageNeeded(p);if(wage<need)return tradeMsg(false,`${p.first} ${p.last} odrzuca warunki. Chce co najmniej ${fmt(need)} rocznie.`);
  const from=p.tm;
  if(from>=0){money(-fee,'Transfery');SAVE.ai[from].bud+=fee;finLog(`Zakup: ${p.first} ${p.last} (${TEAMS[from].short})`,-fee);}
  movePlayer(p,SAVE.team);p.wage=round5k(wage);p.ce=contractEndFor(years);
  news(`✍️ ${p.first} ${p.last} dołącza do zespołu${from>=0?` z ${TEAMS[from].name} za ${fmt(fee)}`:' jako wolny zawodnik'}.`);
  ui.card=null;save();tradeMsg(true,`${p.first} ${p.last} podpisał kontrakt do ${ceDate(p.ce)}!`);
}
function findBuyers(pid){const p=PLAYERS[pid].p;const r=rating(p);const out=[];
  for(const t of TEAMS){if(t.idx===SAVE.team||t.players.length>=17)continue;
    const best=t.players.filter(x=>x.pos===p.pos).map(x=>rating(x)).sort((a,b)=>b-a);
    const need=best.length<POS_STD[p.pos]||r>(best[1]||0);if(!need)continue;
    const fee=Math.round(pValue(p)*(0.8+R()*0.3)*(0.95+cA('neg')/200)/10000)*10000;if(SAVE.ai[t.idx].bud<fee)continue;out.push({tm:t.idx,fee});}
  return out.sort((a,b)=>b.fee-a.fee).slice(0,3);}
function seekBuyers(pid){if(!windowOpen())return tradeMsg(false,'Okno transferowe jest zamknięte.');ui.offers={pid,list:findBuyers(pid)};render();}
function acceptBuy(pid,tm,fee){const p=PLAYERS[pid].p;
  if(myTeam().players.length-1<SQUAD_MIN)return tradeMsg(false,`Nie możesz zejść poniżej ${SQUAD_MIN} zawodników w kadrze.`);
  money(fee,'Transfery');SAVE.ai[tm].bud-=fee;finLog(`Sprzedaż: ${p.first} ${p.last} (${TEAMS[tm].short})`,fee);
  movePlayer(p,tm);p.wage=wageDemand(p);p.ce=contractEndFor(1+Math.floor(R()*3));
  SAVE.inbox=(SAVE.inbox||[]).filter(o=>o.pid!==pid);
  news(`💰 ${p.first} ${p.last} sprzedany do ${TEAMS[tm].name} za ${fmt(fee)}.`);ui.offers=null;ui.card=null;save();tradeMsg(true,`Sprzedano: ${p.first} ${p.last} za ${fmt(fee)}.`);}
function rejectInbox(i){SAVE.inbox.splice(i,1);save();render();}

// ---- AI: transfery i kontrakty ----
function aiSign(t,pos){
  const fa=W().players.filter(p=>p.tm<0&&p.pos===pos&&!p.inj).sort((a,b)=>rating(b)-rating(a));
  let p=fa.find(x=>rating(x)<=teamStrength(t)+4)||fa[0];
  if(!p){p=genPlayer(pos,teamQ(t)-2.5+R(),21+Math.floor(R()*10));initPlayerMeta(p,S().n,true);W().players.push(p);}
  p.tm=t.idx;assignNum(p,t.idx);p.wage=wageDemand(p);p.ce=S().n+Math.floor(R()*2);
  t.players=W().players.filter(x=>x.tm===t.idx&&!x.jr);return p;}
function aiOffseason(){
  const n=S().n;
  for(const t of TEAMS){if(t.idx===SAVE.team)continue;
    for(const p of t.players){if(p.ce<n){const keep=R()<(isStarter(p)?0.85:0.55)&&p.age<34;if(keep){p.wage=wageDemand(p);p.ce=n+Math.floor(R()*3);}else{p.tm=-1;p.wage=0;p.ce=0;}}}}
  syncTeams();
  const order=TEAMS.filter(t=>t.idx!==SAVE.team).sort(()=>R()-0.5);
  for(const t of order){
    if(R()<0.4){const pos=['R','A','P','P','S','S','L'][Math.floor(R()*7)];
      const cur=t.players.filter(x=>x.pos===pos).map(x=>rating(x)).sort((a,b)=>b-a);
      const c=W().players.filter(p=>p.tm>=0&&p.tm!==t.idx&&p.tm!==SAVE.team&&p.pos===pos&&!isStarter(p)&&canSellAI(p)&&rating(p)>(cur[1]||0)).sort((a,b)=>rating(b)-rating(a))[0];
      if(c){const fee=askingPrice(c);if(SAVE.ai[t.idx].bud>=fee){const from=c.tm;SAVE.ai[t.idx].bud-=fee;SAVE.ai[from].bud+=fee;movePlayer(c,t.idx);c.wage=wageDemand(c);c.ce=n+1+Math.floor(R()*2);
        news(`🔁 Transfer: ${c.first} ${c.last} przechodzi z ${TEAMS[from].name} do ${t.name} za ${fmt(fee)}.`);}}}
    for(const pos of ['R','A','P','S','L'])while(posCount(t,pos)<POS_STD[pos]&&t.players.length<16)aiSign(t,pos);
    while(t.players.length<SQUAD_MIN+1)aiSign(t,randPos());
    while(t.players.length>16){const ex=t.players.filter(p=>posCount(t,p.pos)>POS_STD[p.pos]).sort((a,b)=>rating(a)-rating(b))[0]||t.players.slice().sort((a,b)=>rating(a)-rating(b))[0];ex.tm=-1;ex.wage=0;ex.ce=0;t.players=W().players.filter(x=>x.tm===t.idx&&!x.jr);}
  }
  syncTeams();
}
function offseason(){
  const old=S(),n=old.n+1;
  advanceTo(`${2026+old.n}-06-01`);
  // starzenie, spadek formy, emerytury
  const keep=[];
  for(const p of W().players){
    if(p.age>=28)for(const [k] of PHYS)if(R()<(p.age-27)*0.14&&p[k]>1)p[k]--;
    if(p.age>=31)for(const [k] of ATTRS)if(R()<(p.age-30)*0.1&&p[k]>1)p[k]--;
    const r=rating(p);if(p.pot<r)p.pot=r;
    const retire=p.age>=37||(p.age>=35&&R()<0.5)||(p.tm<0&&p.age>=33&&R()<0.5);
    if(retire){if(p.tm===SAVE.team)news(`👋 ${p.first} ${p.last} (${p.age} l.) kończy karierę.`);continue;}
    keep.push(p);}
  W().players=keep;syncTeams();
  // nowy sezon (okno transferowe)
  newSeason(n,'off');
  aiOffseason();juniorsOffseason();aiInfraOffseason();refreshStaffPool();
  for(const r in SAVE.staff){const st=SAVE.staff[r];if(st){st.age++;if(st.age<50&&R()<0.4&&st.skill<20)st.skill++;}}
  // wolni zawodnicy: porządki i uzupełnienie
  let fa=W().players.filter(p=>p.tm<0).sort((a,b)=>rating(b)-rating(a));
  if(fa.length>30){const drop=new Set(fa.slice(30).map(p=>p.id));W().players=W().players.filter(p=>!drop.has(p.id));}
  while(W().players.filter(p=>p.tm<0).length<20){const p=genPlayer(randPos(),10+R()*3,20+Math.floor(R()*12));p.tm=-1;initPlayerMeta(p,n,true);W().players.push(p);}
  for(const a of SAVE.ai)a.bud=round5k(a.bud*0.5+200000+a.rep*15000+R()*300000);
  for(const p of W().players){p.base=snap(p);}
  // oferty za zawodników użytkownika
  SAVE.inbox=[];
  const mine=myTeam().players.filter(p=>rating(p)>=74&&p.ce>=n).sort(()=>R()-0.5);
  for(const p of mine.slice(0,1+Math.floor(R()*2))){const buyers=findBuyers(p.id);if(buyers.length&&R()<0.7){const b=buyers[0];SAVE.inbox.push({pid:p.id,tm:b.tm,fee:Math.round(b.fee*(1.05+R()*0.25)/10000)*10000});}}
  SAVE.fin.prev=SAVE.fin.sea;SAVE.fin.sea={};
  syncTeams();save();
}

function startSeasonFromOff(){

  if(left<SQUAD_MIN&&ui.confirm!=='start'){ui.tmsg={ok:false,t:`Po odejściu zawodników z wygasającymi kontraktami zostanie Ci ${left} zawodników, a minimum to ${SQUAD_MIN}. Przedłuż kontrakty albo kup zawodników.`};render();return;}
  if(exp.length&&ui.confirm!=='start'){ui.confirm='start';render();return;}
  ui.confirm=null;
  for(const p of exp){p.tm=-1;p.wage=0;p.ce=0;news(`👋 ${p.first} ${p.last} odchodzi — wygasł kontrakt.`);}
  for(const p of agedOut()){p.tm=-1;p.jr=false;news(`👋 ${p.first} ${p.last} (${p.age} l.) kończy wiek juniora i odchodzi z akademii.`);}

}

function ccExp(k){const d=ccDraft();d.exp=k;while(ccPool()<0){const top=C_ATTR.map(a=>a[0]).sort((a,b)=>d.attrs[b]-d.attrs[a])[0];d.attrs[top]--;}render();}

const GOAL_TXT={2:'finał (top 2)',4:'półfinał (top 4)',8:'play-off (top 8)',10:'miejsce w pierwszej dziesiątce',12:'budowa zespołu (bez presji wyniku)'};
function goalFor(ti){const rk=TEAMS.map(t=>({i:t.idx,s:teamStrength(t)})).sort((a,b)=>b.s-a.s).findIndex(x=>x.i===ti)+1;return rk<=2?2:rk<=4?4:rk<=8?8:rk<=10?10:12;}
function initBoard(fresh){SAVE.board=SAVE.board||{conf:60};if(fresh)SAVE.board.conf=60;const s=S();if(s&&s.goal==null)s.goal=goalFor(SAVE.team);}
function boardAfterMatch(res){const b=SAVE.board;if(!b||!coach())return;
  const me=res.h===SAVE.team,my=me?res.sw[0]:res.sw[1],op=me?res.sw[1]:res.sw[0],oi=me?res.a:res.h;
  const p=1/(1+Math.exp(-(teamStrength(myTeam())-teamStrength(TEAMS[oi]))/4));
  const won=my>op?1:0;let d=(won-p)*5;if(won&&op===0)d+=0.5;if(!won&&my===0)d-=0.5;
  if(d>0)d*=0.9+cA('aut')/100;else d*=1.1-cA('aut')/100;
  b.conf=clamp(b.conf+d,0,100);
  const s=S();if(b.conf<8&&s.phase==='liga'&&s.round>=8&&!SAVE.fired&&!SAVE.ownClub)fireCoach('Zarząd stracił zaufanie po serii słabych wyników w trakcie sezonu.');}
function seasonEvaluation(){const s=S(),c=coach();if(!c||!s.final)return;const place=s.final.indexOf(SAVE.team)+1;const g=s.goal||goalFor(SAVE.team);const b=SAVE.board;
  const met=place<=g;const diff=g-place;
  b.conf=clamp(b.conf+(met?15+Math.min(15,diff*4):-10*Math.min(4,1-diff)),0,100);
  let dr=diff*1.5+(place===1?8:place<=3?3:0)+(met?3:-3);if(dr>0)dr*=0.85+cA('aut')/66;c.rep=Math.round(clamp(c.rep+dr,0,100));
  c.seasons++;c.hist.push({n:s.n,team:SAVE.team,place,goal:g,met,league:s.seed.indexOf(SAVE.team)+1});
  if(place===1)c.trophies.push(`🏆 Mistrzostwo Polski ${sLabel(s.n)} (${TEAMS[SAVE.team].name})`);
  if(place===2)c.trophies.push(`🥈 Wicemistrzostwo ${sLabel(s.n)} (${TEAMS[SAVE.team].name})`);
  if(place===3)c.trophies.push(`🥉 Brąz ${sLabel(s.n)} (${TEAMS[SAVE.team].name})`);
  if(s.jchamp===SAVE.team)c.trophies.push(`🏆 Mistrzostwo juniorów ${sLabel(s.n)} (${TEAMS[SAVE.team].name})`);
  s.eval={place,goal:g,met,dr:Math.round(dr)};
  news(met?`👔 Zarząd zadowolony: cel „${GOAL_TXT[g]}” wykonany (${place}. miejsce). Reputacja trenera: ${c.rep}.`:`👔 Zarząd rozczarowany: cel „${GOAL_TXT[g]}” niewykonany (${place}. miejsce). Zaufanie: ${Math.round(b.conf)}%.`);
  if(b.conf<20&&!SAVE.ownClub)fireCoach('Zarząd nie przedłużył współpracy po nieudanym sezonie.');
  else if(met)SAVE.offers=makeOffers(false);}
function makeOffers(fired){const c=coach();const cur=initRepStatic(myTeam());
  let pool=TEAMS.filter(t=>t.idx!==SAVE.team&&canTake(t.idx,c.rep));
  pool=fired?pool.sort((a,b)=>teamStrength(a)-teamStrength(b)).slice(0,4):pool.filter(t=>initRepStatic(t)>cur).sort(()=>R()-0.5);
  if(fired&&pool.length<2)pool=TEAMS.filter(t=>t.idx!==SAVE.team).sort((a,b)=>teamStrength(a)-teamStrength(b)).slice(0,3);
  const n=fired?2+(R()<0.5?1:0):(R()<0.6?1:0)+(R()<0.3?1:0);
  return pool.sort(()=>R()-0.5).slice(0,n).map(t=>({tm:t.idx,goal:goalFor(t.idx)}));}
function fireCoach(why){SAVE.fired={why,d:today()};SAVE.offers=makeOffers(true);news(`❌ Zostałeś zwolniony z ${myTeam().name}. ${why}`);
  coach().hist.push({n:S().n,team:SAVE.team,fired:true,d:today()});coach().rep=Math.max(0,coach().rep-5);}

  if(SAVE.build){const b=SAVE.build;infraOf(old)[b.k]=b.to;SAVE.build=null;}

  if(o.short.length<2){ui.ocErr='Skrót klubu: 2–4 litery.';render();return;}
  if(TEAMS.some(t=>t.idx!==o.replace&&t.name.toLowerCase()===o.name.toLowerCase())){ui.ocErr='Taki klub już jest w lidze.';render();return;}
  ui.ocErr=null;const ti=o.replace;const oldName=TEAMS[ti].name;
  SAVE={team:ti,tactics:{serve:1,dist:0},date:GAME_START};
  initWorld();
  const avg=leagueAvg();
  // nowa kadra
  W().players=W().players.filter(p=>p.tm!==ti);
  SAVE.custom={idx:ti,name:o.name,short:o.short,color:o.color,city:o.city||'',replaced:oldName};applyCustom();
  const plan=['R','R','A','A','P','P','P','P','S','S','S','S','L','L'];const si=plan.indexOf(o.star);plan.splice(si,1);
  const squad=[];
  const star=genTarget(o.star,avg+7,26+Math.floor(R()*4));squad.push(star);star.star=true;
  for(const pos of plan){const p=genTarget(pos,avg-9+Math.round(nz()*3),20+(R()<0.35?1:0));squad.push(p);}
  for(const p of squad){p.tm=ti;p.jr=false;p.inj=0;p.xp={};p.base=snap(p);p.wage=wageDemand(p);
    if(p.star){p.pot=rating(p)+2;p.wage=round5k(p.wage*1.1);p.ce=2;}else{p.pot=Math.min(92,rating(p)+14+Math.round(R()*8));p.ce=3;}
    assignNum(p,ti);W().players.push(p);}
  SAVE.ai[ti].rep=20;SAVE.ai[ti].infra=Object.fromEntries(INFRA.map(f=>[f.k,1]));SAVE.ai[ti].bud=0;
  for(let i=0;i<12;i++)W().players.push(genJunior(ti,16+(i%4),JR_PLAN[i]));
  SAVE.staff={};for(const [r] of STAFF_ROLES)SAVE.staff[r]=null;
  for(const r of ['asy','fiz','jr']){const s=genStaff(r,5+R()*3);s.wage=staffWage(s.skill);SAVE.staff[r]=s;}
  refreshStaffPool();
  SAVE.fin={bal:1500000,log:[],sea:{},prev:null};
  SAVE.ownClub=true;syncTeams();
  SAVE.lineup=autoLineup(TEAMS[ti]);SAVE.coach=c;c.joined=GAME_START;c.founder=ti;
  newSeason(1);initBoard(true);
  news(`🏗️ Powstaje nowy klub: ${o.name}${o.city?' ('+o.city+')':''}! Zajmuje w lidze miejsce ${oldName}. Pierwszym trenerem zostaje ${c.first} ${c.last}.`);
  news(`⭐ Gwiazda zespołu: ${star.first} ${star.last} (${POS_NAMES[star.pos]}, ${star.age} l., ocena ${rating(star)}).`);
  ui.cc=null;ui.pendingCoach=null;ui.oc=null;ui.tab='mecz';syncDate();save();render();}
function foundCard(){return `<button class="teamcard foundcard" onclick="ui.cc.step=3;render()"><b>🏗️ Załóż nowy klub</b><small>Własna nazwa, barwy i herb. Start od zera: infrastruktura na poziomie 1, młodzi zawodnicy z dużym potencjałem i jedna gwiazda. Zawsze dostępny, bez wymagań co do reputacji.</small></button>`;}
applyCustom();
// ================= START =================
if(SAVE.team!=null){if(!SAVE.date&&!SAVE.world)SAVE.date=GAME_START;if(!SAVE.world)initWorld();else syncTeams();if(!SAVE.season)newSeason(1);migrateDates();initClub();}
if(SAVE.live){try{ui.match=deserMatch(SAVE.live);ui.match.log.push({t:'Wznowiono zapisany mecz — kliknij „Graj”, żeby kontynuować.',c:'sys'});}catch(e){SAVE.live=null;ui.match=null;}}
render();
