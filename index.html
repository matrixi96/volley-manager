function genTeam(def,idx){
  const rnd=mulberry32(1000+idx*7919);

    let first,last;do{first=FIRST[Math.floor(rnd()*FIRST.length)];last=LAST[Math.floor(rnd()*LAST.length)];}while(used.has(last));used.add(last);
    let num;do{num=1+Math.floor(rnd()*25);}while(nums.has(num));nums.add(num);
    const p={id:'t'+idx+'p'+i,first,last,pos,num,age:19+Math.floor(rnd()*15)};
    const hh=HEIGHT[pos];p.h=Math.round(hh[0]+rnd()*(hh[1]-hh[0]));
    for(const [k] of ATTRS.concat(PHYS))p[k]=Math.round(clamp(def.q+TEMPL[pos][k]+tier+g()*1.8,1,20));
    for(const [k] of MENTAL)p[k]=Math.round(clamp(def.q-1+tier*0.3+g()*4,1,20));
    return p;
  });
  return Object.assign({},def,{idx,players});
}

function schedule(ms){clearTimeout(timer);const m=ui.match;if(!m||m.over||m.paused)return;timer=setTimeout(tick,ms==null?ui.speed:ms);}
function animOn(){return ui.anim!==false&&ui.speed>=800&&typeof requestAnimationFrame!=='undefined';}
function tick(){const m=ui.match;if(!m||m.over||m.paused||m.animating||ui.to)return;if(ui.tab!=='mecz'){m.paused=true;persistLive();return;}
  // decyzje rywala (czas, zmiany) zapadają po zakończonej akcji, przed kolejną zagrywką
  const to1=m.sides[1].to;for(const s of aiTurn(m,1))m.log.push({t:esc(s),c:'sys'});

  const after=()=>{m.comm=cm;if(ui.toReq&&!m.over){ui.toReq=false;startTimeout(0);return true;}return false;};
  if(animOn()){m.animating=true;const fin=()=>{m.animating=false;if(after())return;render();schedule(ui.speed>=1600?650:380);};if(hall)hallAnim(m,pre,ev,fin);else animateRally(ev,fin);}
  else{if(after())return;render();schedule();}}
function animateRally(ev,done){
  const court=document.querySelector('.court'),ball=document.getElementById('vball');
  if(!court||!ball||!court.getBoundingClientRect){done();return;}
  const cr=court.getBoundingClientRect();if(!cr.width){done();return;}
  const W=cr.width,H=cr.height;
  const chip=id=>{const el=court.querySelector('[data-pid="'+id+'"]');if(!el)return null;const r=el.getBoundingClientRect();return {x:r.left-cr.left+r.width/2,y:r.top-cr.top+r.height*0.38,el};};
  const half=(s,a,b)=>(s===0?a:1-b)*W+R()*(b-a)*W;
  const pts=[];let prev=null;
  for(const t of ev.seq){let p=null;
    if(t.k==='floor')p={x:t.blk?half(t.s,0.36,0.46):half(t.s,0.06,0.42),y:(0.12+R()*0.76)*H};
    else if(t.k==='ace'){const c=chip(t.id);p=c?{x:c.x+(R()-0.5)*30,y:c.y+28,el:null}:{x:half(t.s,0.1,0.4),y:H/2};}
    else if(t.k==='out')p={x:t.s===0?W*0.01:W*0.99,y:R()<0.5?-12:H+12};
    else if(t.k==='net')p={x:W/2,y:(0.3+R()*0.4)*H};
    else p=chip(t.id);
    if(!p){prev=t.k;continue;}
    p.high=prev==='set'||prev==='srv'||prev==='rec'||prev==='dig';p.fast=prev==='att';p.kind=t.k;pts.push(p);prev=t.k;}
  if(pts.length<2){done();return;}
  const base=ui.speed>=1600?470:300;
  const label={ace:'AS!',block:'BLOK!',kill:'PUNKT',serr:'BŁĄD ZAGRYWKI',attErr:'BŁĄD ATAKU',setErr:'BŁĄD',mix:'NIEPOROZUMIENIE'}[ev.type]||'PUNKT';
  ball.style.display='block';ball.style.transform=`translate(${pts[0].x}px,${pts[0].y}px)`;
  let i=0;
  const seg=()=>{if(i>=pts.length-1){flashLabel(label,ev.winner);setTimeout(()=>{ball.style.display='none';done();},ui.speed>=1600?650:380);return;}
    const a=pts[i],b=pts[i+1];const dur=b.fast?base*0.5:base;const arc=b.fast?H*0.02:H*(b.high?0.24:0.12);const t0=performance.now();
    const step=now=>{const t=Math.min(1,(now-t0)/dur);const k=4*t*(1-t);
      ball.style.transform=`translate(${a.x+(b.x-a.x)*t}px,${a.y+(b.y-a.y)*t-arc*k}px) scale(${1+0.6*k*arc/(H*0.24)})`;
      if(t<1)requestAnimationFrame(step);else{if(b.el){b.el.classList.add('touch');setTimeout(()=>b.el.classList.remove('touch'),260);}i++;seg();}};
    requestAnimationFrame(step);};
  seg();
}

function lum(h){const n=parseInt(h.slice(1),16);return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255;}
function rgb(h){const n=parseInt(h.slice(1),16);return [n>>16,n>>8&255,n&255];}

function libColor(c,o){const pal=['#fde047','#e5e7eb','#f472b6','#a3e635','#fb923c','#1f2937'];return pal.map(p=>[p,Math.min(cdist(p,c),o?cdist(p,o):999)]).sort((a,b)=>b[1]-a[1])[0][0];}

function teamTotals(s){const t={pts:0,kill:0,att:0,attErr:0,blk:0,ace:0,srvErr:0,rec:0,recPos:0,recErr:0,blocked:0};for(const p of s.pl){const x=p.st;t.kill+=x.kill;t.att+=x.att;t.attErr+=x.attErr;t.blk+=x.blk;t.ace+=x.ace;t.srvErr+=x.srvErr;t.rec+=x.rec;t.recPos+=x.recPos;t.recErr+=x.recErr;t.blocked+=x.blocked;}t.pts=t.kill+t.blk+t.ace;return t;}

let PLAYERS={};

const N_SPAR=7;

function newSeason(n,phase){

function leagueTable(){return tableFrom(S().results);}
function tableFrom(results){const T=TEAMS.map(t=>({i:t.idx,m:0,w:0,l:0,pts:0,sw:0,sl:0,pw:0,pl:0}));
  for(const rd of results)for(const g of rd){const h=T[g.h],a=T[g.a];h.m++;a.m++;h.sw+=g.sw[0];h.sl+=g.sw[1];a.sw+=g.sw[1];a.sl+=g.sw[0];

    const hw=g.sw[0]===3,W=hw?h:a,Lo=hw?a:h,ls=Math.min(...g.sw);W.w++;Lo.l++;W.pts+=ls<=1?3:2;Lo.pts+=ls===2?1:0;}

  return T.sort((x,y)=>y.pts-x.pts||y.w-x.w||ratio(y.sw,y.sl)-ratio(x.sw,x.sl)||ratio(y.pw,y.pl)-ratio(x.pw,x.pl));}

function participant(i,home){const t=TEAMS[i];const mine=i===SAVE.team;return {team:t,lineup:mine?healthyLineup(t,myLineup()).lu:autoLineup(t),tactics:mine?Object.assign({},myTac()):{serve:1,dist:0},home,x:(()=>{const md=clubMods(i);const o={hb:md.hb,fat:md.fat,sb:md.sb};if(mine){const cx=coachMatchX();o.sb+=cx.sb||0;o.momMul=cx.momMul;o.prB=cx.prB;o.trB=cx.trB;}return o;})()};}

function recordStats(m){addTogether(m);const s=S();const ps=s.ps;const ts=s.ts||(s.ts={});
  m.sides.forEach((sd,i)=>{const r=ts[sd.team.idx]||(ts[sd.team.idx]={m:0,sets:0,kill:0,att:0,attErr:0,blk:0,ace:0,srvErr:0,srv:0,rec:0,recPos:0,dig:0,pw:0,pl:0});

    for(const p of sd.pl){const x=p.st;r.kill+=x.kill;r.att+=x.att;r.attErr+=x.attErr;r.blk+=x.blk;r.ace+=x.ace;r.srvErr+=x.srvErr;r.srv+=x.srv;r.rec+=x.rec;r.recPos+=x.recPos;r.dig+=x.dig;}});
  for(const sd of m.sides)for(const p of sd.pl){const x=p.st;if(x.srv+x.rec+x.att+x.dig+x.blk===0)continue;
    const r=ps[p.id]||(ps[p.id]={m:0,pts:0,kill:0,att:0,attErr:0,blk:0,ace:0,srvErr:0,rec:0,recPos:0,dig:0,mvp:0});
    r.m++;r.kill+=x.kill;r.att+=x.att;r.attErr+=x.attErr;r.blk+=x.blk;r.ace+=x.ace;r.srvErr+=x.srvErr;r.rec+=x.rec;r.recPos+=x.recPos;r.dig+=x.dig;r.pts+=x.kill+x.blk+x.ace;}
  const w=m.sides[m.winner];const mvp=w.pl.slice().sort((a,b)=>mvpScore(b)-mvpScore(a))[0];if(ps[mvp.id])ps[mvp.id].mvp++;

function myNext(){

  if(s.phase==='liga'){const f=s.rounds[s.round].find(f=>f[0]===SAVE.team||f[1]===SAVE.team);return {kind:'liga',h:f[0],a:f[1]};}

  m.log.push({t:`${ctx.kind==='spar'?'Sparing':ctx.kind==='po'?'Play-off':'Liga'} · ${meHome?'mecz u siebie':'mecz wyjazdowy'}. Losowanie: seta zaczyna zagrywką <b>${esc(m.sides[m.serving].team.name)}</b>.`,c:'sys'});
  return m;
}
function playNext(){if(SAVE.fired)return;syncDate();const c=myNext();if(!c)return;const m=buildMatch(c);ui.match=m;ui.view='log';ui.subSel=null;ui.tab='mecz';persistLive();render();schedule();}
function simNext(){if(SAVE.fired)return;syncDate();const c=myNext();if(!c)return;const m=buildMatch(c);m.quick=true;while(!m.over)doRally(m);ui.match=m;ui.view='post';ui.tab='mecz';render();}
function finishMatch(m){
  if(m.recorded||!m.ctx)return;m.recorded=true;const c=m.ctx,s=S();
  const res=resultOf(m,c.h,c.a);res.me=true;res.d=today();
  if(c.kind==='spar'){addTogether(m);s.spar.res.push(res);injuryCheck(m,0.5);roundTick('spar',false);}
  else if(c.kind==='liga'){recordStats(m);boardAfterMatch(res);const rd=[];for(const f of s.rounds[s.round]){if(f[0]===c.h&&f[1]===c.a)rd.push(res);else rd.push(simFixture(f[0],f[1],true));}
    s.results.push(rd);simJrRound(s.round);s.round++;roundTick('liga',c.h===SAVE.team,m.att);if(s.round>=s.rounds.length)startPlayoff();}
  else if(c.kind==='po'){recordStats(m);boardAfterMatch(res);playPoDay(c.sid,res);roundTick('po',c.h===SAVE.team,m.att);}

}
function storeLast(m,c){try{const me=m.sides[0];const T=teamTotals(me);const w=m.sides[m.winner];const mvp=w.pl.slice().sort((a,b)=>mvpScore(b)-mvpScore(a))[0];
  const r=resultOf(m,c.h,c.a);const won=m.winner===0;const sc=c.h===SAVE.team?r.sw[0]+':'+r.sw[1]:r.sw[1]+':'+r.sw[0];const op=TEAMS[c.h===SAVE.team?c.a:c.h];
  news(`${won?'✅ Wygrana':'❌ Porażka'} ${sc} z ${op.short} (${c.kind==='spar'?'sparing':c.kind==='po'?'play-off':'liga'}) · MVP: ${mvp?mvp.first+' '+mvp.last:'—'}`);
  if(c.kind==='liga'){const ld=leagueTable()[0].i;if(SAVE.lastLeader!==ld){SAVE.lastLeader=ld;news(`🏆 ${TEAMS[ld].name} ${ld===SAVE.team?'— jesteśmy liderem ligi!':'nowym liderem ligi'}`);}}
  SAVE.lastMatch={h:c.h,a:c.a,sets:r.sets,sw:r.sw,d:today(),home:c.h===SAVE.team,att:m.att||0,mvp:mvp?mvp.last:'',atk:T.att?Math.round(T.kill/T.att*100):0,blk:T.blk,ace:T.ace};}catch(e){}}
function skipSpar(){const s=S();s.phase='liga';syncDate();save();render();}
function endSpar(){const s=S();if(s.phase==='spar'&&s.spar.res.length>=N_SPAR){s.phase='liga';syncDate();save();}}

// ---- play-off ----
function mkSeries(st,a,b,need){const ra=rankOf(a),rb=rankOf(b);const hi=ra<rb?a:b,lo=hi===a?b:a;return {id:st+'-'+hi+'-'+lo,st,hi,lo,need,w:[0,0],games:[]};}
function startPlayoff(){const s=S();const tb=leagueTable().map(x=>x.i);s.seed=tb;s.phase='po';
  s.po={stage:'QF',day:0,series:[mkSeries('QF',tb[0],tb[7],2),mkSeries('QF',tb[3],tb[4],2),mkSeries('QF',tb[1],tb[6],2),mkSeries('QF',tb[2],tb[5],2)]};}
function seriesDone(sr){return sr.w[0]>=sr.need||sr.w[1]>=sr.need;}
function seriesWinner(sr){return sr.w[0]>=sr.need?sr.hi:sr.lo;}
function seriesLoser(sr){return sr.w[0]>=sr.need?sr.lo:sr.hi;}
function seriesHome(sr){return sr.games.length%2===0?sr.hi:sr.lo;}
function activeSeries(){const s=S();if(!s.po)return [];const st=s.po.stage;return s.po.series.filter(x=>(st==='FB'?(x.st==='F'||x.st==='B'):x.st===st)&&!seriesDone(x));}
function addGame(sr,res){sr.games.push(res);const hiWon=(res.h===sr.hi)===(res.sw[0]===3);sr.w[hiWon?0:1]++;}
function playPoDay(mySid,myRes){
  const s=S();
  for(const sr of activeSeries()){if(sr.id===mySid){addGame(sr,myRes);continue;}const h=seriesHome(sr);const g=simFixture(h,h===sr.hi?sr.lo:sr.hi,true);g.d=today();addGame(sr,g);}
  s.po.day++;advanceStage();
}
function advanceStage(){
  const s=S(),po=s.po;if(activeSeries().length)return;
  const seedRank=i=>s.seed.indexOf(i);
  if(po.stage==='QF'){const w=po.series.filter(x=>x.st==='QF').map(seriesWinner).sort((a,b)=>seedRank(a)-seedRank(b));
    po.series.push(mkSeriesSeed('SF',w[0],w[3],2),mkSeriesSeed('SF',w[1],w[2],2));po.stage='SF';}
  else if(po.stage==='SF'){const sf=po.series.filter(x=>x.st==='SF');
    po.series.push(mkSeriesSeed('F',seriesWinner(sf[0]),seriesWinner(sf[1]),3),mkSeriesSeed('B',seriesLoser(sf[0]),seriesLoser(sf[1]),2));po.stage='FB';}
  else if(po.stage==='FB'){finishSeason();}
}
function mkSeriesSeed(st,a,b,need){const s=S();const hi=s.seed.indexOf(a)<s.seed.indexOf(b)?a:b;const lo=hi===a?b:a;return {id:st+'-'+hi+'-'+lo,st,hi,lo,need,w:[0,0],games:[]};}
function simPoDay(){if(S().phase!=='po')return;const mine=myNext();if(mine)return;playPoDay(null,null);roundTick('po',false);syncDate();save();render();}
function simPoAll(){while(S().phase==='po'&&!myNext()){playPoDay(null,null);roundTick('po',false);syncDate();}save();render();}
function finishSeason(){
  const s=S(),po=s.po,ser=st=>po.series.filter(x=>x.st===st);
  const F=ser('F')[0],B=ser('B')[0];
  const qfL=ser('QF').map(seriesLoser).sort((a,b)=>s.seed.indexOf(a)-s.seed.indexOf(b));
  s.final=[seriesWinner(F),seriesLoser(F),seriesWinner(B),seriesLoser(B)].concat(qfL,s.seed.slice(8));
  s.phase='end';s.endDate=addDays(s.podates[Math.max(0,s.po.day-1)],3);
  s.final.forEach((ti,pl)=>{const a=SAVE.ai[ti];a.rep=Math.round(clamp(a.rep*0.75+(95-pl*7)*0.25,10,100));});
  const myPl=s.final.indexOf(SAVE.team);money(PRIZE[myPl],'Nagrody');finLog(`Nagroda za ${myPl+1}. miejsce w sezonie ${sLabel(s.n)}`,PRIZE[myPl]);
  SAVE.history=SAVE.history||[];SAVE.history.push({n:s.n,team:SAVE.team,place:s.final.indexOf(SAVE.team)+1,champ:s.final[0],league:s.seed.indexOf(SAVE.team)+1});
  seasonEvaluation();
}

  <p class="mut small">Miejsca 1–8 grają w play-off. Punktacja: 3:0 i 3:1 to 3 pkt, 3:2 to 2 pkt dla zwycięzcy i 1 pkt dla przegranego.</p></div>`;}

      <details><summary class="link">Wszystkie wyniki</summary>${s.results.map((rd,i)=>`<div class="rd"><div class="mut small">Kolejka ${i+1}</div>${rd.map(g=>`<div class="res ${g.me?'me':''}">${resTxt(g)}</div>`).join('')}</div>`).reverse().join('')}</details></div>`;
    out+=`<div class="card"><h2>Twój terminarz</h2><div class="sched">${s.rounds.map((rd,i)=>{const g=rd.find(x=>x[0]===SAVE.team||x[1]===SAVE.team);const r=s.results[i]&&s.results[i].find(x=>x.me);const home=g[0]===SAVE.team;const op=home?g[1]:g[0];
      const won=r&&((r.h===SAVE.team)===(r.sw[0]===3));
      const wd=fixtureWhen(s,i,g);return `<div class="res ${i===s.round?'me':''}"><span class="mut small">K${i+1} · ${fmtShort(wd.d)} ${wd.t}</span> ${home?'🏠':'✈️'} ${tDot(op)}${tName(op)} ${r?`<b class="${won?'good':'bad'}">${home?r.sw[0]+':'+r.sw[1]:r.sw[1]+':'+r.sw[0]}</b>`:''}</div>`;}).join('')}</div></div>`;

const STAGE={QF:'Ćwierćfinał',SF:'Półfinał',F:'Finał',B:'Mecz o 3. miejsce'};
function seriesScore(sr){return `${sr.w[0]}:${sr.w[1]}`;}
function bracketHtml(){const s=S();if(!s.po)return '';
  const col=st=>{const list=s.po.series.filter(x=>x.st===st);if(!list.length)return `<div class="bcol"><h4>${STAGE[st]}</h4><div class="mut small">—</div></div>`;
    return `<div class="bcol"><h4>${STAGE[st]}</h4>${list.map(sr=>{const d=seriesDone(sr),w=d?seriesWinner(sr):-1;
      return `<div class="ser ${sr.hi===SAVE.team||sr.lo===SAVE.team?'mine':''}"><div class="${w===sr.hi?'win':''}">${tDot(sr.hi)}<span class="mut small">${s.seed.indexOf(sr.hi)+1}.</span> ${tName(sr.hi)}<b>${sr.w[0]}</b></div><div class="${w===sr.lo?'win':''}">${tDot(sr.lo)}<span class="mut small">${s.seed.indexOf(sr.lo)+1}.</span> ${tName(sr.lo)}<b>${sr.w[1]}</b></div>
      ${sr.games.length?`<div class="mut small">${sr.games.map(g=>`${TEAMS[g.h].short} ${g.sw[0]}:${g.sw[1]} ${TEAMS[g.a].short}`).join(' · ')}</div>`:''}</div>`;}).join('')}</div>`;};
  return `<div class="card"><h2>Play-off</h2><div class="bracket">${col('QF')}${col('SF')}${col('F')}${col('B')}</div><p class="mut small">Ćwierćfinały, półfinały i mecz o 3. miejsce do 2 zwycięstw, finał do 3. Wyżej rozstawiony gra u siebie mecze 1, 3 i 5.</p></div>`;}

function serMatch(m){return {sides:m.sides.map(s=>({ti:s.team.idx,pl:s.pl.map(p=>({id:p.id,en:p.en,st:p.st,mor:p.mor})),tmp:s.tmp,slots:s.slots.map(x=>({role:x.role,id:x.p.id})),lib:s.libero.id,rot:s.rot,tactics:s.tactics,mom:s.mom,home:s.home,fatMul:s.fatMul,momMul:s.momMul,prB:s.prB,trB:s.trB,form:s.form,to:s.to,subs:s.subs,chem:s.chem})),
  setNo:m.setNo,score:m.score,setsWon:m.setsWon,sets:m.sets,firstServe:m.firstServe,serving:m.serving,run:m.run,rallies:m.rallies,sideout:m.sideout,log:m.log.slice(-150),ctx:m.ctx,hist:m.hist||[],att:m.att,cap:m.cap,hallLv:m.hallLv,homeIdx:m.homeIdx,mid:m.mid,dirStats:m.dirStats||[],mixN:m.mixN||[0,0]};}
function deserMatch(o){const m=Object.assign({},o,{over:false,paused:true,hl:[]});
  m.sides=o.sides.map(x=>{const t=TEAMS[x.ti];const pl=t.players.map(cloneP);const g=id=>pl.find(p=>p.id===id);
    for(const q of x.pl){const p=g(q.id);if(!p)continue;p.en=q.en;p.st=q.st;if(q.mor!=null)p.mor=q.mor;}
    return {team:t,pl,slots:x.slots.map(s=>({role:s.role,p:g(s.id)})),libero:g(x.lib),tmp:x.tmp,rot:x.rot,tactics:x.tactics,mom:x.mom,home:x.home,fatMul:x.fatMul||1,momMul:x.momMul||1,prB:x.prB||0,trB:x.trB||0,form:x.form,to:x.to,subs:x.subs,chem:x.chem!=null?x.chem:chemOf(x.slots.map(s=>g(s.id)).concat([g(x.lib)]),t.idx)};});
  if(m.att==null&&m.ctx)matchCrowd(m);
  return m;}

function teamStatsHtml(){const ts=S().ts;if(!ts)return '';

const POS_MIN={R:2,A:2,P:3,S:3,L:1};
const POS_STD={R:2,A:2,P:4,S:4,L:2};
const SQUAD_MAX=18,SQUAD_MIN=12;
const ALL_KEYS=ALL_ATTRS.map(a=>a[0]);
const PRIZE=[1000000,600000,400000,300000,150000,150000,150000,150000,50000,50000,50000,50000];
let ROUND_PLAYED=new Set();
function W(){return SAVE.world;}
function fmt(n){n=Math.round(n);const a=Math.abs(n);let s;if(a>=1e6)s=(n/1e6).toFixed(2).replace('.',',')+' mln';else if(a>=1e3)s=Math.round(n/1e3)+' tys.';else s=String(n);return s+' zł';}
function fmtFull(n){return Math.round(n).toLocaleString('pl-PL')+' zł';}
function round5k(x){return Math.max(5000,Math.round(x/5000)*5000);}
function pValue(p){const r=rating(p);const af=p.age<=22?1.35:p.age<=28?1.1:p.age<=31?0.85:p.age<=33?0.55:0.3;const pf=1+Math.max(0,(p.pot||r)-r)/35;return Math.max(10000,Math.round(Math.pow(Math.max(0,r-50)/40,2.5)*1500000*af*pf/10000)*10000);}
function wageDemand(p){const r=rating(p);return round5k(Math.max(40000,Math.pow(Math.max(0,r-45)/45,2)*700000)*(p.age>=33?0.8:1));}
function snap(p){const o={};for(const k of ALL_KEYS)o[k]=p[k];return o;}
function baseRating(p){return p.base?rating(Object.assign({},p,p.base)):rating(p);}
function potStars(p){const n=Math.max(1,Math.min(5,Math.round(((p.pot!=null?potSeen(p):rating(p))-62)/7)));return '★'.repeat(n)+'<span class="mut">'+'★'.repeat(5-n)+'</span>';}
function potBonus(age,r){const k=r>=85?0.5:r>=80?0.75:1;return k*(age<=21?3+R()*12:age<=24?2+R()*7:age<=27?R()*3:0);}
function initRep(t){return Math.round(clamp((teamStrength(t)-65)*3.5,20,90));}
function teamQ(t){return teamStrength(t)/5;}
function restoreDefs(){TEAMS.forEach((t,i)=>{const d=TEAM_DEFS[i];t.name=d.name;t.short=d.short;t.color=d.color;t.city='';});applyCustom();}
function resetTeams(){restoreDefs();TEAMS.forEach((t,i)=>{t.players=genTeam(TEAM_DEFS[i],i).players;});rebuildIndex();}
function hashN(id){let h=3;for(const c of String(id))h=(h*131+c.charCodeAt(0))>>>0;return h;}
function syncTeams(){for(const p of W().players){if(p.czy==null||p.kiw==null||p.kom==null){ensAttrs(p);if(p.base){p.base.czy=p.czy;p.base.kiw=p.kiw;p.base.kom=p.kom;}}
    if(!W().chemInit&&p.tcTm==null&&p.tm>=0&&!p.jr){p.tcTm=p.tm;p.tc=6+hashN(p.id)%35;}}W().chemInit=1;for(const t of TEAMS)t.players=W().players.filter(p=>p.tm===t.idx&&!p.jr);rebuildIndex();}
function initPlayerMeta(p,season,free){const r=rating(p);p.pot=Math.min(95,Math.round(r+potBonus(p.age,r)));p.inj=0;p.xp={};p.base=snap(p);
  if(free){p.wage=0;p.ce=0;}else{p.wage=round5k(wageDemand(p)*(0.85+R()*0.3));p.ce=season+(R()<0.2?0:1+Math.floor(R()*3));}}
function randPos(){const x=R()*14;return x<2?'R':x<4?'A':x<8?'P':x<12?'S':'L';}
function genPlayer(pos,q,age){const id='n'+(W().nextId++);
  const p={id,first:FIRST[Math.floor(R()*FIRST.length)],last:LAST[Math.floor(R()*LAST.length)],pos,num:0,age};
  const hh=HEIGHT[pos];p.h=Math.round(hh[0]+R()*(hh[1]-hh[0]));
  for(const [k] of ATTRS.concat(PHYS))p[k]=Math.round(clamp(q+TEMPL[pos][k]+nz()*2.2,1,20));
  for(const [k] of MENTAL)p[k]=Math.round(clamp(q-1+nz()*4,1,20));
  p.tc=0;setDob(p);return p;}
function assignNum(p,tm){const used=new Set(W().players.filter(x=>x.tm===tm&&x!==p).map(x=>x.num));if(p.num&&!used.has(p.num))return;for(let n=1;n<=40;n++)if(!used.has(n)){p.num=n;return;}}
function initWorld(){
  resetTeams();
  SAVE.world={players:[],nextId:1};
  const sn=SAVE.season?SAVE.season.n:1;
  for(const t of TEAMS)for(const p0 of t.players){const p=Object.assign({},p0,{tm:t.idx});initPlayerMeta(p,sn,false);setDob(p);W().players.push(p);}
  SAVE.ai=TEAMS.map(t=>({rep:initRep(t),bud:0}));
  for(const a of SAVE.ai)a.bud=round5k(200000+a.rep*15000+R()*300000);
  for(let i=0;i<20;i++){const age=20+Math.floor(R()*13);const p=genPlayer(randPos(),10+R()*3,age);p.tm=-1;initPlayerMeta(p,1,true);W().players.push(p);}
  const rep=SAVE.ai[SAVE.team].rep;
  SAVE.fin={bal:round5k(1000000+rep*15000),log:[],sea:{},prev:null};
  SAVE.training={focus:'bal',int:1};
  SAVE.news=[];SAVE.inbox=[];
  syncTeams();initClub();
}

function money(amt,cat){const f=SAVE.fin;f.bal+=amt;f.sea[cat]=(f.sea[cat]||0)+amt;}
function finLog(t,a){const f=SAVE.fin;f.log.unshift({d:today(),t,a});f.log=f.log.slice(0,80);}

function ticketIncome(mult,est){const rep=SAVE.ai[SAVE.team].rep;const L=myInfra().hala;const att=Math.min(HALA_CAP[L-1],Math.round((1400+rep*25)*(1+0.05*(L-1))*(est?1:0.85+R()*0.3)*mult));return {att,inc:att*TICKET};}

// ---- trening / rozwój / kontuzje ----
const TRAIN_FOCUS=[['bal','Zrównoważony','Rozwój wszystkich cech, z naciskiem na te ważne dla pozycji.',[]],['atk','Atak','Atak, siła, skoczność.',['ata','sil','sko']],['def','Przyjęcie i obrona','Przyjęcie, obrona, odbicie dołem, zwinność.',['prz','obr','tod','zwi']],['blk','Blok','Blok, skoczność, szybkość.',['blo','sko','szy']],['srv','Zagrywka','Zagrywka i siła.',['zag','sil']],['set','Rozegranie','Rozegranie i odbicie palcami.',['roz','tpa']],['phy','Przygotowanie fizyczne','Siła, szybkość, skoczność, zwinność, kondycja.',['sil','szy','sko','zwi','kon']],['men','Mentalny','Koncentracja, opanowanie, zaangażowanie, waleczność.',['kcj','opa','zaa','wal']]];
const TRAIN_INT=[['Lekki',0.7,0.6,'Wolniejszy rozwój, mniej kontuzji.'],['Normalny',1,1,'Balans rozwoju i ryzyka.'],['Ciężki',1.35,1.8,'Szybszy rozwój, ale prawie 2× więcej kontuzji.']];
const GRP={};for(const [k] of ATTRS)GRP[k]='tech';for(const [k] of PHYS)GRP[k]='phys';for(const [k] of MENTAL)GRP[k]='ment';
function develop(p,focus,intI,played,mods,jr){
  const r=rating(p);const gap=(p.pot||r)-r;if(gap<=0)return;
  const af=p.age<=20?1:p.age<=23?0.75:p.age<=26?0.45:p.age<=29?0.2:0.05;
  const pts=af*TRAIN_INT[intI][1]*(played?1.25:1)*Math.min(1.5,0.5+gap/20)*0.17*(mods?(jr?mods.jr:mods.all):1);
  const fk=(TRAIN_FOCUS.find(f=>f[0]===focus)||TRAIN_FOCUS[0])[3];const pw=WEIGHTS[p.pos];
  const w={};let tot=0;for(const k of ALL_KEYS){let x=0.3;if(pw[k])x+=1.5;if(fk.includes(k))x+=3;w[k]=x;tot+=x;}
  p.xp=p.xp||{};
  for(const k of ALL_KEYS){if(p[k]>=20)continue;const v=(p.xp[k]||0)+pts*w[k]/tot*(mods?mods[GRP[k]]:1);if(v>=1){p[k]++;p.xp[k]=Math.round((v-1)*100)/100;}else p.xp[k]=Math.round(v*1000)/1000;}
}
function injuryCheck(m,mult){
  for(const sd of m.sides){const mine=sd.team.idx===SAVE.team;const md=clubMods(sd.team.idx);const im=(mine?TRAIN_INT[SAVE.training.int][2]:1)*md.injChance;
    for(const cp of sd.pl){const x=cp.st;if(x.srv+x.rec+x.att+x.dig+x.blk===0)continue;ROUND_PLAYED.add(cp.id);
      const P=PLAYERS[cp.id];if(!P)continue;const p=P.p;if(p.inj)continue;
      if(R()<0.012*im*(1.3-p.kon/20*0.6)*mult){const d=1+Math.floor(R()*R()*7);const days=Math.max(3,Math.round((d*7-3+R()*6)*md.injDur));p.inj=days;p.injUntil=addDays(today(),days);if(mine)news(`🚑 ${p.first} ${p.last} doznał kontuzji — przerwa ok. ${days} dni (powrót ok. ${fmtDMY(p.injUntil)}).`);}}}
}
function roundTick(kind,home,att){
  const tr=SAVE.training;
  const MODS={};const mm=ti=>MODS[ti]||(MODS[ti]=clubMods(ti));
  for(const p of W().players){
    if(p.tm<0)continue;const mine=p.tm===SAVE.team;develop(p,mine?tr.focus:'bal',mine?tr.int:1,ROUND_PLAYED.has(p.id),mm(p.tm),p.jr);}
  ROUND_PLAYED=new Set();
  const s=S();
  if(kind==='liga'){money(TV_ROUND,'Prawa TV');
    let t=null;if(home){t=att!=null?{att,inc:att*TICKET}:ticketIncome(1);money(t.inc,'Bilety');}
    finLog(`Kolejka ${s.round}: prawa TV${t?`, bilety (${t.att} widzów)`:''}`,TV_ROUND+(t?t.inc:0));}
  if(kind==='po'&&home){const t=att!=null?{att,inc:att*TICKET}:ticketIncome(1.5);money(t.inc,'Bilety');finLog(`Play-off: bilety (${t.att} widzów)`,t.inc);}
}

function posCount(t,pos){return t.players.filter(p=>p.pos===pos).length;}
function isStarter(p){if(p.tm<0)return false;const lu=autoLineup(TEAMS[p.tm]);return Object.values(lu).includes(p.id);}
function askingPrice(p){return Math.round(pValue(p)*(isStarter(p)?1.35:1.05)/10000)*10000;}
function canSellAI(p){const t=TEAMS[p.tm];return posCount(t,p.pos)-1>=POS_MIN[p.pos]&&t.players.length-1>=SQUAD_MIN;}
function wageNeeded(p){if(p.tm===SAVE.team)return round5k(wageDemand(p)*negF());const my=SAVE.ai[SAVE.team].rep;const cur=p.tm>=0?SAVE.ai[p.tm].rep:0;return round5k(wageDemand(p)*(p.tm<0?0.9:cur>my+10?1.15:1)*negF());}
function contractEndFor(years){const s=S();return (s.phase==='off'?s.n-1:s.n)+years;}
function movePlayer(p,tm){p.tm=tm;if(tm>=0)assignNum(p,tm);syncTeams();}
function tradeMsg(ok,t){ui.tmsg={ok,t};render();}
function makeOffer(pid,fee,wage,years){
  const P=PLAYERS[pid];if(!P)return;const p=P.p;const me=myTeam();
  if(!windowOpen())return tradeMsg(false,'Okno transferowe jest zamknięte (otwarte przed sezonem i w trakcie sparingów).');
  if(me.players.length>=SQUAD_MAX)return tradeMsg(false,`Kadra jest pełna (maks. ${SQUAD_MAX}). Najpierw kogoś sprzedaj albo zwolnij.`);
  fee=p.tm>=0?Math.max(0,Math.round(fee)):0;
  if(p.tm>=0){const club=TEAMS[p.tm].name;
    if(!canSellAI(p))return tradeMsg(false,`${club} nie sprzeda zawodnika — nie ma go kim zastąpić.`);
    const ask=Math.round(askingPrice(p)*(1.05-cA('neg')/200)/10000)*10000;if(fee<ask)return tradeMsg(false,`${club} odrzuca ofertę. Oczekuje co najmniej ${fmt(ask)}.`);}
  if(SAVE.fin.bal-fee<-500000)return tradeMsg(false,'Za mało pieniędzy. Dopuszczalny debet to 500 tys. zł.');
  const need=wageNeeded(p);if(wage<need)return tradeMsg(false,`${p.first} ${p.last} odrzuca warunki. Chce co najmniej ${fmt(need)} rocznie.`);
  const from=p.tm;
  if(from>=0){money(-fee,'Transfery');SAVE.ai[from].bud+=fee;finLog(`Zakup: ${p.first} ${p.last} (${TEAMS[from].short})`,-fee);}
  movePlayer(p,SAVE.team);p.wage=round5k(wage);p.ce=contractEndFor(years);
  news(`✍️ ${p.first} ${p.last} dołącza do zespołu${from>=0?` z ${TEAMS[from].name} za ${fmt(fee)}`:' jako wolny zawodnik'}.`);
  ui.card=null;save();tradeMsg(true,`${p.first} ${p.last} podpisał kontrakt do ${ceDate(p.ce)}!`);
}
function findBuyers(pid){const p=PLAYERS[pid].p;const r=rating(p);const out=[];
  for(const t of TEAMS){if(t.idx===SAVE.team||t.players.length>=17)continue;
    const best=t.players.filter(x=>x.pos===p.pos).map(x=>rating(x)).sort((a,b)=>b-a);
    const need=best.length<POS_STD[p.pos]||r>(best[1]||0);if(!need)continue;
    const fee=Math.round(pValue(p)*(0.8+R()*0.3)*(0.95+cA('neg')/200)/10000)*10000;if(SAVE.ai[t.idx].bud<fee)continue;out.push({tm:t.idx,fee});}
  return out.sort((a,b)=>b.fee-a.fee).slice(0,3);}
function seekBuyers(pid){if(!windowOpen())return tradeMsg(false,'Okno transferowe jest zamknięte.');ui.offers={pid,list:findBuyers(pid)};render();}
function acceptBuy(pid,tm,fee){const p=PLAYERS[pid].p;
  if(myTeam().players.length-1<SQUAD_MIN)return tradeMsg(false,`Nie możesz zejść poniżej ${SQUAD_MIN} zawodników w kadrze.`);
  money(fee,'Transfery');SAVE.ai[tm].bud-=fee;finLog(`Sprzedaż: ${p.first} ${p.last} (${TEAMS[tm].short})`,fee);
  movePlayer(p,tm);p.wage=wageDemand(p);p.ce=contractEndFor(1+Math.floor(R()*3));
  SAVE.inbox=(SAVE.inbox||[]).filter(o=>o.pid!==pid);
  news(`💰 ${p.first} ${p.last} sprzedany do ${TEAMS[tm].name} za ${fmt(fee)}.`);ui.offers=null;ui.card=null;save();tradeMsg(true,`Sprzedano: ${p.first} ${p.last} za ${fmt(fee)}.`);}
function rejectInbox(i){SAVE.inbox.splice(i,1);save();render();}
function releaseCost(p){return round5k(p.wage*Math.max(1,p.ce-S().n+(S().phase==='off'?1:0))*0.5);}
function releasePlayer(pid){const p=PLAYERS[pid].p;
  if(ui.confirm!=='rel'+pid){ui.confirm='rel'+pid;render();return;}ui.confirm=null;
  if(myTeam().players.length-1<SQUAD_MIN)return tradeMsg(false,`Nie możesz zejść poniżej ${SQUAD_MIN} zawodników w kadrze.`);
  const c=releaseCost(p);money(-c,'Odprawy');finLog(`Rozwiązanie kontraktu: ${p.first} ${p.last}`,-c);
  movePlayer(p,-1);p.wage=0;p.ce=0;news(`📄 Rozwiązano kontrakt z ${p.first} ${p.last} (odprawa ${fmt(c)}).`);ui.card=null;save();tradeMsg(true,`Rozwiązano kontrakt. Odprawa: ${fmt(c)}.`);}
function renew(pid,wage,years){const p=PLAYERS[pid].p;const need=wageNeeded(p);
  if(wage<need)return tradeMsg(false,`${p.last} nie zgadza się. Chce co najmniej ${fmt(need)} rocznie.`);
  p.wage=round5k(wage);p.ce=contractEndFor(years);news(`✍️ ${p.first} ${p.last} przedłużył kontrakt do ${ceDate(p.ce)}.`);save();tradeMsg(true,`${p.last} przedłużył kontrakt do ${ceDate(p.ce)}.`);}

// ---- AI: transfery i kontrakty ----
function aiSign(t,pos){
  const fa=W().players.filter(p=>p.tm<0&&p.pos===pos&&!p.inj).sort((a,b)=>rating(b)-rating(a));
  let p=fa.find(x=>rating(x)<=teamStrength(t)+4)||fa[0];
  if(!p){p=genPlayer(pos,teamQ(t)-2.5+R(),21+Math.floor(R()*10));initPlayerMeta(p,S().n,true);W().players.push(p);}
  p.tm=t.idx;assignNum(p,t.idx);p.wage=wageDemand(p);p.ce=S().n+Math.floor(R()*2);
  t.players=W().players.filter(x=>x.tm===t.idx&&!x.jr);return p;}
function aiOffseason(){
  const n=S().n;
  for(const t of TEAMS){if(t.idx===SAVE.team)continue;
    for(const p of t.players){if(p.ce<n){const keep=R()<(isStarter(p)?0.85:0.55)&&p.age<34;if(keep){p.wage=wageDemand(p);p.ce=n+Math.floor(R()*3);}else{p.tm=-1;p.wage=0;p.ce=0;}}}}
  syncTeams();
  const order=TEAMS.filter(t=>t.idx!==SAVE.team).sort(()=>R()-0.5);
  for(const t of order){
    if(R()<0.4){const pos=['R','A','P','P','S','S','L'][Math.floor(R()*7)];
      const cur=t.players.filter(x=>x.pos===pos).map(x=>rating(x)).sort((a,b)=>b-a);
      const c=W().players.filter(p=>p.tm>=0&&p.tm!==t.idx&&p.tm!==SAVE.team&&p.pos===pos&&!isStarter(p)&&canSellAI(p)&&rating(p)>(cur[1]||0)).sort((a,b)=>rating(b)-rating(a))[0];
      if(c){const fee=askingPrice(c);if(SAVE.ai[t.idx].bud>=fee){const from=c.tm;SAVE.ai[t.idx].bud-=fee;SAVE.ai[from].bud+=fee;movePlayer(c,t.idx);c.wage=wageDemand(c);c.ce=n+1+Math.floor(R()*2);
        news(`🔁 Transfer: ${c.first} ${c.last} przechodzi z ${TEAMS[from].name} do ${t.name} za ${fmt(fee)}.`);}}}
    for(const pos of ['R','A','P','S','L'])while(posCount(t,pos)<POS_STD[pos]&&t.players.length<16)aiSign(t,pos);
    while(t.players.length<SQUAD_MIN+1)aiSign(t,randPos());
    while(t.players.length>16){const ex=t.players.filter(p=>posCount(t,p.pos)>POS_STD[p.pos]).sort((a,b)=>rating(a)-rating(b))[0]||t.players.slice().sort((a,b)=>rating(a)-rating(b))[0];ex.tm=-1;ex.wage=0;ex.ce=0;t.players=W().players.filter(x=>x.tm===t.idx&&!x.jr);}
  }
  syncTeams();
}
function offseason(){
  const old=S(),n=old.n+1;
  advanceTo(`${2026+old.n}-06-01`);
  // starzenie, spadek formy, emerytury
  const keep=[];
  for(const p of W().players){
    if(p.age>=28)for(const [k] of PHYS)if(R()<(p.age-27)*0.14&&p[k]>1)p[k]--;
    if(p.age>=31)for(const [k] of ATTRS)if(k!=='czy'&&R()<(p.age-30)*0.1&&p[k]>1)p[k]--;
    const r=rating(p);if(p.pot<r)p.pot=r;
    const retire=p.age>=37||(p.age>=35&&R()<0.5)||(p.tm<0&&p.age>=33&&R()<0.5);
    if(retire){if(p.tm===SAVE.team)news(`👋 ${p.first} ${p.last} (${p.age} l.) kończy karierę.`);continue;}
    keep.push(p);}
  W().players=keep;syncTeams();
  // nowy sezon (okno transferowe)
  newSeason(n,'off');
  aiOffseason();juniorsOffseason();aiInfraOffseason();refreshStaffPool();
  for(const r in SAVE.staff){const st=SAVE.staff[r];if(st){st.age++;if(st.age<50&&R()<0.4&&st.skill<20)st.skill++;}}
  // wolni zawodnicy: porządki i uzupełnienie
  let fa=W().players.filter(p=>p.tm<0).sort((a,b)=>rating(b)-rating(a));
  if(fa.length>30){const drop=new Set(fa.slice(30).map(p=>p.id));W().players=W().players.filter(p=>!drop.has(p.id));}
  while(W().players.filter(p=>p.tm<0).length<20){const p=genPlayer(randPos(),10+R()*3,20+Math.floor(R()*12));p.tm=-1;initPlayerMeta(p,n,true);W().players.push(p);}
  for(const a of SAVE.ai)a.bud=round5k(a.bud*0.5+200000+a.rep*15000+R()*300000);
  for(const p of W().players){p.base=snap(p);}
  // oferty za zawodników użytkownika
  SAVE.inbox=[];
  const mine=myTeam().players.filter(p=>rating(p)>=74&&p.ce>=n).sort(()=>R()-0.5);
  for(const p of mine.slice(0,1+Math.floor(R()*2))){const buyers=findBuyers(p.id);if(buyers.length&&R()<0.7){const b=buyers[0];SAVE.inbox.push({pid:p.id,tm:b.tm,fee:Math.round(b.fee*(1.05+R()*0.25)/10000)*10000});}}
  SAVE.fin.prev=SAVE.fin.sea;SAVE.fin.sea={};
  syncTeams();save();
}
function expiring(){const n=S().n;return myTeam().players.filter(p=>p.ce<n);}
function startSeasonFromOff(){
  const s=S();const exp=expiring();const left=myTeam().players.length-exp.length;
  if(left<SQUAD_MIN&&ui.confirm!=='start'){ui.tmsg={ok:false,t:`Po odejściu zawodników z wygasającymi kontraktami zostanie Ci ${left} zawodników, a minimum to ${SQUAD_MIN}. Przedłuż kontrakty albo kup zawodników.`};render();return;}
  if(exp.length&&ui.confirm!=='start'){ui.confirm='start';render();return;}
  ui.confirm=null;
  for(const p of exp){p.tm=-1;p.wage=0;p.ce=0;news(`👋 ${p.first} ${p.last} odchodzi — wygasł kontrakt.`);}
  for(const p of agedOut()){p.tm=-1;p.jr=false;news(`👋 ${p.first} ${p.last} (${p.age} l.) kończy wiek juniora i odchodzi z akademii.`);}
  syncTeams();
  if(myTeam().players.length<SQUAD_MIN){while(myTeam().players.length<SQUAD_MIN){const t=myTeam();const pos=['R','A','P','S','L'].find(x=>posCount(t,x)<POS_MIN[x])||randPos();aiSign(t,pos);syncTeams();}news('Klub dobrał zawodników z wolnego rynku, żeby uzupełnić kadrę do minimum.');}
  s.phase='spar';ui.tmsg=null;syncDate();save();render();
}

function healthyLineup(team,lu){

  const Y=seasonYear(s.n);
  if(!s.sdates){let d=nextDow(`${Y}-08-15`,6);s.sdates=[];for(let k=0;k<N_SPAR;k++){s.sdates.push(d);d=addDays(d,k%2?3:4);}}

function fixtureWhen(s,r,f){const i=s.rounds[r].findIndex(x=>x[0]===f[0]&&x[1]===f[1]);const sl=SLOTS[Math.max(0,i)%SLOTS.length];return {d:addDays(s.rdates[r],sl[0]),t:sl[1]};}

  if(s.phase==='po'){const d=s.podates[Math.min(s.po.day,s.podates.length-1)];return {d,t:poTime(d)};}

function weakestReceiver(m){const oc=onCourt(m.sides[1],m.serving===1).filter(e=>e.role==='L'||e.role==='P');return oc.map(e=>e.p).sort((a,b)=>(a.prz+a.tod)-(b.prz+b.tod))[0];}
function talkList(m){const w=weakestReceiver(m);return [
  ['belief','Wierzę w was!','Słowa otuchy. Siła zależy od Twojej motywacji. Najbardziej pomaga, gdy przegrywacie i gdy morale jest niskie.'],
  ['calm','Spokojnie, gramy swoje','Uspokaja zespół. Najbardziej pomaga nerwowym zawodnikom (niskie opanowanie) i tym z niskim morale.'],
  ['rage','Obudźcie się! Tak się nie gra!','Ostra reprymenda. Waleczni i zaangażowani się nakręcą, nerwowi mogą się spiąć. Lepiej działa przy dużym autorytecie trenera.'],
  ['srv','Ryzykujcie na zagrywce!','Przez kilka akcji mocniejsza zagrywka: więcej asów, ale i więcej błędów.'],
  ['rec','Skupcie się na przyjęciu','Przez kilka akcji lepsze przyjęcie. Spokój dla przyjmujących i libero.'],
  ['target',`Zagrywka w ${w?w.last:'słabszego przyjmującego'}`,`Przez kilka akcji serwujecie w najsłabiej przyjmującego rywala${w?` (${w.last}, przyjęcie ${w.prz})`:''}.`]];}
function myTimeout(){const m=ui.match;if(!m||m.over||ui.to)return;if(m.sides[0].to<=0)return;
  if(m.animating){ui.toReq=!ui.toReq;document.querySelectorAll('.tobtn').forEach(b=>b.textContent=ui.toReq?'⏱ Czas po akcji…':`⏱ Czas (${m.sides[0].to})`);return;}
  startTimeout(0);}
function applyTalk(k){const m=ui.match;if(!m)return;const s=m.sides[0];const oc=onCourt(s,m.serving===0).map(e=>e.p);
  const behind=m.score[1]-m.score[0];const mot=cA('mot'),aut=cA('aut'),tak=cA('tak');const amp=0.8+aut/50;const dur=5+Math.floor(tak/4);const del={};
  for(const p of oc){const mor=p.mor==null?60:p.mor;let d=0;
    if(k==='belief')d=2+(mot-10)*0.5+(behind>=3?3:0)+(mor<50?2:0);
    if(k==='calm')d=1+(60-mor)*0.12+(12-p.opa)*0.45;
    if(k==='rage')d=((p.wal+p.zaa)/2-10.5)*1.1+(aut-10)*0.5-(p.opa<9?3:0);
    if(k==='srv')d=p.zag>=13?2:0;
    if(k==='rec')d=(p.pos==='L'||p.pos==='P')?2:0;
    if(k==='target')d=1;
    d=Math.round(d*amp+(R()-0.5)*2);addMor(p,d);del[p.id]=d;}
  if(k==='srv'||k==='rec')s.tmp={k,n:dur};
  if(k==='target'){const t=weakestReceiver(m);if(t)s.tmp={k:'target',n:dur,id:t.id};}
  const t=talkList(m).find(x=>x[0]===k);const up=Object.values(del).filter(d=>d>0).length,dn=Object.values(del).filter(d=>d<0).length;
  m.log.push({t:`🗣️ ${esc(coach()?coach().last:'Trener')}: „${esc(t[1])}” — ${up} zawodników podbudowanych${dn?`, ${dn} spiętych`:''}.`,c:'sys'});
  ui.talk=false;ui.talkRes={k,del};if(ui.to)ui.to.said=t[1];persistLive();render();}
function talkCard(m){const to=ui.to;return `<div class="card talk"><div class="row"><h3 style="margin:0">⏱ ${to&&to.side===1?`Czas dla ${esc(m.sides[1].team.short)} — możesz porozmawiać ze swoimi`:'Czas — co mówisz zawodnikom?'}</h3>${to?`<span class="tobar" style="width:140px;margin-left:10px"><i style="width:${Math.max(0,(to.end-Date.now())/150)}%"></i></span><b class="tocount" style="margin-left:6px">${Math.max(0,Math.ceil((to.end-Date.now())/1000))} s</b>`:''}<span class="sp"></span><button class="ghost" onclick="ui.talk=false;render()">Bez przemowy</button>${to?'<button class="btn" onclick="endTimeout()">↩ Wracamy na boisko</button>':''}</div>
  <p class="small mut">Każdy zawodnik reaguje inaczej (zależy od jego cech mentalnych i Twoich atrybutów trenera). Reakcje zobaczysz przy nazwiskach w panelu.</p>
  <div class="opts">${talkList(m).map(([k,n,d])=>`<button class="opt" onclick="applyTalk('${k}')"><b>${esc(n)}</b><small>${esc(d)}</small></button>`).join('')}</div></div>`;}
// ---- karta ustawienia ----
const ROT_TIP={1:'Rozgrywający z tyłu na prawej: trzech atakujących w pierwszej linii.',6:'Rozgrywający z tyłu w środku: trzech atakujących z przodu.',5:'Rozgrywający z tyłu na lewej: trzech atakujących z przodu, najdłuższy dobieg do siatki.',4:'Rozgrywający z przodu na lewej: tylko dwóch atakujących w pierwszej linii.',3:'Rozgrywający z przodu w środku: dwóch atakujących z przodu, możliwa kiwka.',2:'Rozgrywający z przodu na prawej: dwóch atakujących z przodu, klasyczna wystawa.'};
function rotBox(m,i){const sd=m.sides[i];const sv=m.serving===i;const oc=onCourt(sd,sv);const kc=kitColors(m)[i];
  const setter=oc.find(e=>e.role==='R');const rz=setter?setter.zone+1:0;const front=oc.filter(e=>isFrontZ(e.zone)),back=oc.filter(e=>!isFrontZ(e.zone));
  const atk=front.filter(e=>e.role!=='R'&&e.role!=='L').length;const lib=oc.find(e=>e.role==='L');const libFor=lib?sd.slots[sd.rot[lib.zone]]:null;
  const cell=z=>{const e=oc.find(x=>x.zone===z-1);if(!e)return '<div class="rz"></div>';const col=e.role==='L'?libColor(kc,'#000'):kc;
    return `<div class="rz ${e.role==='R'?'rs':''}" title="Strefa ${z}: ${esc(e.p.first+' '+e.p.last)} (${POS_NAMES[e.role]})"><span class="rzn">${z}</span><i style="background:${col};color:${lum(col)>0.6?'#111':'#fff'}">${e.p.num}</i><small>${POS_SHORT[e.role]}</small></div>`;};
  const grid=i===0?[[5,4],[6,3],[1,2]]:[[2,1],[3,6],[4,5]];
  const tac=sd.tactics||{serve:1,dist:0};
  return `<div class="rbox"><div class="row"><b style="color:${kc}">●</b> <b>${esc(sd.team.short)}</b><span class="sp"></span><span class="rtag ${sv?'srv':'rcv'}">${sv?'🏐 na zagrywce':'🛡️ w przyjęciu'}</span></div>
   <div class="rmain"><div class="rgrid ${i===0?'l':'r'}">${grid.map(r=>r.map(cell).join('')).join('')}<div class="rnet"></div></div>
   <div class="rtxt"><div class="rtitle">Ustawienie ${rz||'?'}</div><div class="small mut">${rz?`rozgrywający w strefie ${rz} · system 5-1`:'system 5-1'}</div>
   <div class="small">${ROT_TIP[rz]||''}</div>
   <div class="small mut" style="margin-top:4px">Atakujący z przodu: <b style="color:var(--txt)">${atk}</b>${lib?` · libero ${esc(lib.p.last)} za ${esc(libFor?libFor.p.last:'środkowego')}`:''}</div>
   <div class="small mut">W obronie: ${[1,6,5].map(z=>{const e=back.find(x=>defZone(x)===z);return e?`<b style="color:var(--txt)">${z}</b> ${POS_SHORT[e.role]} ${esc(e.p.last)}`:''}).filter(Boolean).join(' · ')}</div>
   <div class="small mut">Zagrywka: <b style="color:var(--txt)">${SERVE_OPT[tac.serve][0]}</b> · rozegranie: <b style="color:var(--txt)">${DIST_OPT[tac.dist][0]}</b></div>
   ${sd.tmp&&sd.tmp.n>0?`<div class="small tmpb">📋 ${esc(TALK_TMP[sd.tmp.k]||'')} — ${sd.tmp.n} akcji</div>`:''}</div></div></div>`;}
function rotCard(m){if(m.over)return '';return `<div class="card rotcard"><div class="row"><h3 style="margin:0">Grane ustawienie</h3><span class="sp"></span><span class="small mut">Set ${m.setNo} · ${m.score[0]}:${m.score[1]}</span></div><div class="rboxes">${rotBox(m,0)}${rotBox(m,1)}</div>
  <p class="small mut" style="margin:6px 0 0">Numer ustawienia = strefa, w której stoi rozgrywający. Ustawienie zmienia się, gdy drużyna odbiera zagrywkę rywalowi (rotacja zgodnie z ruchem wskazówek zegara).</p></div>`;}
// ================= EKRAN MECZU W UKŁADZIE „MENEDŻERSKIM” (jak FM) =================
// ocena meczowa na żywo (skala 1–10, start 6,0)
function liveRating(p){const x=p.st;const act=x.srv+x.rec+x.att+x.dig+x.blk;if(!act)return null;
  const v=6+0.3*x.kill+0.45*x.blk+0.45*x.ace+0.12*x.dig+0.06*x.recPos-0.3*x.attErr-0.25*x.srvErr-0.35*x.recErr-0.2*x.blocked-0.04*(x.att-x.kill-x.attErr);
  return Math.max(3,Math.min(10,v));}
const fmtR=v=>v==null?'–':v.toFixed(1).replace('.',',');
const rCls=v=>v==null?'':v>=7?'up':v<=5.4?'dn':'';
function energyCol(v){return v>75?'#22c55e':v>55?'#eab308':'#ef4444';}
function fmJersey(m,i,e,size){const kc=kitColors(m)[i];const col=e&&e.role==='L'?libColor(kc,'#000'):kc;
  return `<span class="fmj" style="background:${col};color:${lum(col)>0.6?'#111':'#fff'};${size?`width:${size}px;height:${size}px`:''}">${e.p.num}</span>`;}
// ---- boczna karta „Formacja” ----
function fmFormation(m,i){const sd=m.sides[i],mine=i===0,sv=m.serving===i;const oc=onCourt(sd,sv);const kc=kitColors(m)[i];
  const setter=oc.find(e=>e.role==='R');const rz=setter?setter.zone+1:0;
  const cell=z=>{const e=oc.find(x=>x.zone===z-1);if(!e)return '<div class="fmz"></div>';const p=e.p;const r=liveRating(p);
    const click=mine&&!m.over?`onclick="selSub(${e.slot==='L'?"'L'":e.slot})"`:'';
    const d=ui.talkRes&&mine&&ui.talkRes.del?ui.talkRes.del[p.id]:null;
    return `<div class="fmz ${click?'clk':''} ${ui.subSel!=null&&mine&&(ui.subSel===e.slot)?'sel':''}" ${click} title="Strefa ${z}: ${esc(p.first+' '+p.last)} · ${POS_NAMES[e.role]} · energia ${Math.round(p.en)}%">
      ${fmJersey(m,i,e)}<span class="fmrt ${rCls(r)}">${fmtR(r)}</span><span class="fmps">${POS_SHORT[e.role]}</span>
      <b class="fmnm">${esc(p.last)}</b>${d?`<span class="dlt ${d>0?'good':'bad'}">${d>0?'+':''}${d}</span>`:''}
      <span class="fmen"><i style="width:${Math.round(p.en)}%;background:${energyCol(p.en)}"></i></span></div>`;};
  const back=oc.filter(e=>!isFrontZ(e.zone));
  return `<div class="card fmcard" style="border-top:3px solid ${kc}">
   <div class="fmh"><b>${esc(sd.team.short)}: ustawienie ${rz||'?'}</b><span class="rtag ${sv?'srv':'rcv'}">${sv?'🏐 zagrywka':'🛡️ przyjęcie'}</span></div>
   <div class="fmnet">siatka</div>
   <div class="fmgrid">${[4,3,2,5,6,1].map(cell).join('')}</div>
   <div class="small mut fmdef">${ROT_TIP[rz]||''}</div>
   <div class="small mut">W obronie: ${[5,6,1].map(z=>{const e=back.find(x=>defZone(x)===z);return e?`<b style="color:var(--txt)">${z}</b> ${POS_SHORT[e.role]}`:''}).filter(Boolean).join(' · ')}</div>
   ${sd.tmp&&sd.tmp.n>0?`<div class="small tmpb">📋 ${esc(TALK_TMP[sd.tmp.k]||'')} — ${sd.tmp.n} akcji</div>`:''}</div>`;}
// ---- tabela na żywo (wynik w setach traktowany jak końcowy, gdy ktoś prowadzi) ----
function fmLiveTable(m){const c=m.ctx;if(!c||c.kind!=='liga')return '';const s=S();
  const base=leagueTable().map(x=>x.i);
  let proj=s.results.slice();const [a,b]=m.setsWon;let note='';
  if(a!==b){const w=a>b?0:1;const ls=Math.min(a,b);const meIdx=m.sides[0].team.idx;const sw0=w===0?[3,ls]:[ls,3];
    const g={h:c.h,a:c.a,sets:[],sw:c.h===meIdx?sw0:[sw0[1],sw0[0]]};proj=proj.concat([[g]]);note='wg wyniku w setach';}
  const t=tableFrom(proj);const my=SAVE.team,op=c.h===my?c.a:c.h;
  const myPos=t.findIndex(x=>x.i===my);const from=Math.max(0,Math.min(t.length-5,myPos-2));
  return `<div class="card fmside2"><div class="fmh"><b>Tabela na żywo</b><span class="small mut">${note}</span></div>
   ${t.slice(from,from+5).map((x,k)=>{const pos=from+k,old=base.indexOf(x.i);const mv=old>pos?'<span class="good">▲</span>':old<pos?'<span class="bad">▼</span>':'<span class="mut">–</span>';
     return `<div class="fmtr ${x.i===my?'me':x.i===op?'op':''}"><span>${pos+1}</span>${mv}<span class="fmtn">${tDot(x.i)}${esc(TEAMS[x.i].short)}</span><span class="mut">${x.m}</span><b>${x.pts}</b></div>`;}).join('')}</div>`;}
// ---- ostatnie wyniki (poprzednia kolejka / play-off) ----
function fmRecent(m){const s=S();let rows=[],title='Ostatnie wyniki';
  if(m.ctx&&m.ctx.kind==='po'&&s.po){title='Play-off';rows=activeSeries().map(sr=>`<div class="fmtr"><span class="fmtn">${esc(TEAMS[sr.hi].short)} – ${esc(TEAMS[sr.lo].short)}</span><b>${sr.w[0]}:${sr.w[1]}</b></div>`);}
  else{const last=s.results&&s.results.length?s.results[s.results.length-1]:null;
    if(last)rows=last.filter(g=>!g.me).slice(0,5).map(g=>`<div class="fmtr"><span class="fmtn">${esc(TEAMS[g.h].short)} – ${esc(TEAMS[g.a].short)}</span><b>${g.sw[0]}:${g.sw[1]}</b></div>`);
    else if(s.spar&&s.spar.res.length){title='Sparingi';rows=s.spar.res.slice(-4).map(g=>`<div class="fmtr"><span class="fmtn">${esc(TEAMS[g.h].short)} – ${esc(TEAMS[g.a].short)}</span><b>${g.sw[0]}:${g.sw[1]}</b></div>`);}}
  return `<div class="card fmside2"><div class="fmh"><b>${title}</b></div>${rows.join('')||'<div class="small mut">Brak wcześniejszych wyników.</div>'}</div>`;}
// ---- asystent ----
function fmAdvice(m){if(m.over)return null;const a=m.sides[0],b=m.sides[1];const h=(m.hist||[]).filter(x=>x[0]===m.setNo);
  let run=0;for(let k=h.length-1;k>=0;k--){const prev=k?h[k-1]:[0,0,0];if(h[k][2]>prev[2])run++;else break;}
  if(run>=3&&a.to>0)return {k:'to'+m.setNo+'-'+h.length,t:`Rywal zdobył ${run} punkty z rzędu. Weź czas i porozmawiaj z zespołem.`,btn:'Weź czas',act:'myTimeout()'};
  const oc=onCourt(a,m.serving===0);const tired=oc.filter(e=>e.role!=='L'&&e.p.en<55).sort((x,y)=>x.p.en-y.p.en)[0];
  if(tired&&a.subs>0)return {k:'sub'+tired.p.id,t:`${tired.p.last} opada z sił (energia ${Math.round(tired.p.en)}%). Wpuść zmiennika.`,btn:'Wybierz zmianę',act:`selSub(${tired.slot})`};
  const ana=anaAdvice(m);if(ana)return ana;
  const A=teamTotals(a),B=teamTotals(b);
  if(A.rec>=6&&A.recPos/A.rec<0.4&&a.to>0)return {k:'rec'+m.setNo,t:`Przyjęcie słabe (${pc(A.recPos,A.rec)} pozytywnego). Czas i przemowa „Skupcie się na przyjęciu” pomogą.`,btn:'Weź czas',act:'myTimeout()'};
  if(B.rec>=6&&B.recPos/B.rec<0.45&&a.tactics.serve<2)return {k:'srv'+m.setNo,t:`Rywal źle przyjmuje (${pc(B.recPos,B.rec)}). Zaryzykuj mocniejszą zagrywkę.`,btn:'Ryzykowna zagrywka',act:'setServe(2)'};
  if(B.att>=8&&B.kill/B.att>0.55&&a.tactics.dist!==2)return {k:'blk'+m.setNo,t:`Atak rywala kończy ${pc(B.kill,B.att)} piłek. Pilnuj bloku, przemowa uspokoi zespół.`,btn:null};
  return {k:'ok',t:`Gramy swoje. Atak ${pc(A.kill,A.att)} wobec ${pc(B.kill,B.att)} rywala.`,btn:null};}
function fmAssistant(m){const ad=fmAdvice(m);if(!ad)return `<div class="card fmw"><div class="fmh"><b>Asystent</b></div><div class="small">Mecz zakończony.</div></div>`;
  const hid=ui.asstHide===ad.k;
  return `<div class="card fmw"><div class="fmh"><b>Asystent</b><button class="ghost sm" onclick="ui.fmPanel=ui.fmPanel==='asst'?null:'asst';render();window.scrollTo({top:0,behavior:'smooth'})">💬 Zapytaj</button></div>
   <div class="small fmat">${hid?'<span class="mut">Brak nowych uwag.</span>':esc(ad.t)}</div>
   ${ad.btn&&!hid?`<div class="row" style="gap:6px;margin-top:6px"><button class="btn sm" onclick="${ad.act}">✓ ${esc(ad.btn)}</button><button class="ghost sm" onclick="ui.asstHide='${ad.k}';render()">✕</button></div>`:''}</div>`;}
// ---- dynamika meczu ----
function fmMomentum(m){const h=m.hist||[];const kc=kitColors(m);const W=240,H=70,mid=H/2;
  const sets=[...new Set(h.map(x=>x[0]))];const n=Math.max(h.length,50);
  let pts=[],seps=[];let prevSet=null;h.forEach((x,k)=>{if(x[0]!==prevSet&&prevSet!=null)seps.push(k);prevSet=x[0];pts.push([k,x[1]-x[2]]);});
  const mx=Math.max(5,...pts.map(p=>Math.abs(p[1])));const X=k=>(k/(n-1)*W).toFixed(1),Y=d=>(mid-d/mx*(mid-4)).toFixed(1);
  const bars=pts.map(([k,d])=>d===0?'':`<rect x="${X(k)}" y="${d>0?Y(d):mid}" width="${Math.max(1,W/n-0.6).toFixed(1)}" height="${Math.abs(Y(d)-mid).toFixed(1)}" fill="${d>0?kc[0]:kc[1]}"/>`).join('');
  return `<div class="card fmw"><div class="fmh"><b>Dynamika meczu</b><span class="small mut">przewaga w punktach</span></div>
   <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="fmmom"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#ffffff40"/>${seps.map(k=>`<line x1="${X(k)}" x2="${X(k)}" y1="0" y2="${H}" stroke="#ffffff30" stroke-dasharray="2 2"/>`).join('')}${bars}</svg>
   <div class="fmleg small mut">${sets.map(s=>`<span>set ${s}</span>`).join('')||'<span>czeka na pierwszy punkt</span>'}</div></div>`;}
// ---- kto kończy ataki ----
function fmAttack(m){const sd=m.sides[0];const tot=sd.pl.reduce((s,p)=>s+p.st.att,0);const kc=kitColors(m)[0];
  const arr=sd.pl.filter(p=>p.st.att).sort((a,b)=>b.st.att-a.st.att).slice(0,4);
  return `<div class="card fmw"><div class="fmh"><b>Rozkład ataków</b><span class="small mut">${esc(sd.team.short)}</span></div>
   ${arr.map(p=>`<div class="fmar"><span class="fmtn">${esc(p.last)}</span><span class="shb"><i style="width:${p.st.att/tot*100}%;background:${kc}"></i></span><span class="small mut">${p.st.kill}/${p.st.att}</span></div>`).join('')||'<div class="small mut">Jeszcze bez ataków.</div>'}</div>`;}
// ---- statystyki przy boisku ----
function fmTeamStats(m,i){const t=teamTotals(m.sides[i]);const kc=kitColors(m)[i];
  const sd=m.sides[i];const mixN=(m.mixN||[0,0])[i];
  const rows=[['Punkty',t.pts],['Atak',pc(t.kill,t.att)],['Przyjęcie+',pc(t.recPos,t.rec)],['Asy',t.ace],['Bloki',t.blk],['Błędy',t.attErr+t.srvErr],['Zgranie',chemPct(sd.chem??0.6)+'%'],['Nieporoz.',mixN]];
  return `<div class="fmst"><div class="fmh"><b style="border-bottom:2px solid ${kc}">${esc(m.sides[i].team.short)}</b></div>${rows.map(r=>`<div class="fmsr"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`;}
// ---- pasek składu ----
function fmStrip(m){const a=m.sides[0];const oc=onCourt(a,m.serving===0);const ord={R:0,A:1,P:2,S:3,L:4};
  const on=oc.slice().sort((x,y)=>ord[x.role]-ord[y.role]||x.zone-y.zone);
  const mine=e=>{const p=e.p,r=liveRating(p),mor=p.mor==null?60:p.mor;const click=!m.over?`onclick="selSub(${e.slot==='L'?"'L'":e.slot})"`:'';
    return `<div class="fmsp ${click?'clk':''} ${ui.subSel===e.slot?'sel':''}" ${click} title="${esc(p.first+' '+p.last)} · energia ${Math.round(p.en)}% · morale ${mor}">
      <span class="fmps2">${POS_SHORT[e.role]}</span>${fmJersey(m,0,e,28)}<b class="fmnm">${esc(p.last)}</b><span class="fmps2">ogólna <b style="color:var(--acc)">${rating(p)}</b></span>

const BLK_OPT=[['Skos','Blok zamyka skos.'],['Zrównoważony','Blokujący czytają atak.'],['Prosta','Blok zamyka prostą.']];

  <div class="tacrow"><div class="tacl"><b>Blok — prawa strona siatki</b><small class="mut">przeciw przyjmującemu rywala (jego lewe skrzydło)</small></div>${segBtns(t.blkR,"setBlk.bind(null,'R')")}<div class="small mut tacd">${defTxt('R',t.blkR??1)}</div></div>

  <div class="small mut">Obie strony naraz: ${BLK_OPT.map((o,i)=>`<button class="link" onclick="setBlk('B',${i})">${o[0].toLowerCase()}</button>`).join(' · ')}. Przyjmujący w strefie 6 zawsze broni szóstki i asekuruje plecy stref 1 i 5.</div>`;}
function freeTacHtml(t){return `<div class="tacrow"><div class="tacl"><b>Piłki sytuacyjne</b><small class="mut">gdy nie da się zaatakować: przebicie</small></div>

function tgtTacHtml(m){const t=m.sides[0].tactics;const opp=m.sides[1];const ord={L:0,P:1,A:2,R:3,S:4};
  const ps=opp.pl.slice().sort((a,b)=>ord[a.pos]-ord[b.pos]);

// ================= ANALITYK =================
function anaSkill(){const s=SAVE.staff&&SAVE.staff.sta;return s?s.skill:0;}
function anaName(){const s=SAVE.staff&&SAVE.staff.sta;return s?`${s.first||''} ${s.last||''}`.trim():'';}
// dane kierunków z dokładnością zależną od analityka
function anaData(m,i){const sk=anaSkill();let ds=(m.dirStats||[]).filter(d=>d.i===i&&d.d!=='free');
  if(sk>0&&sk<9)ds=ds.slice(0,Math.floor(ds.length/6)*6);
  const step=sk>=15?1:sk>=9?5:10;
  const noise=(k)=>{if(sk>=15)return 0;let h=m.setNo*7+k.length*13+i*31;return ((h%7)-3)*(sk>=9?1:3);};
  const rnd=v=>Math.max(0,Math.min(100,Math.round(v/step)*step));
  const agg=(xs,key)=>{const n=xs.length;if(!n)return null;const c=xs.filter(d=>d.d==='cross').length,l=xs.filter(d=>d.d==='line').length,t=xs.filter(d=>d.d==='tip').length,mi=xs.filter(d=>/^mid/.test(d.d)).length,mS=xs.filter(d=>d.d==='midS').length,mL=xs.filter(d=>d.d==='midL').length,mR=xs.filter(d=>d.d==='midR').length,k=xs.filter(d=>d.r==='kill').length;
    const cr=rnd(c/n*100+noise(key)),ln=rnd(l/n*100-noise(key));return {n,cross:c?cr:0,line:l?ln:0,tip:rnd(t/n*100),mid:rnd(mi/n*100),mS:rnd(mS/n*100),mL:rnd(mL/n*100),mR:rnd(mR/n*100),kill:rnd(k/n*100),rawC:c/(c+l||1)};};
  const wings={L4:agg(ds.filter(d=>d.w==='L4'),'L4'),R2:agg(ds.filter(d=>d.w==='R2'),'R2'),M:agg(ds.filter(d=>d.w==='M'),'M')};
  const sd=m.sides[i];const ids=[...new Set(ds.map(d=>d.id))];
  const pl=ids.map(id=>{const p=sd.pl.find(x=>x.id===id);const xs=ds.filter(d=>d.id===id);return {p,w:xs[0].w,...agg(xs,id)};}).filter(x=>x.p&&x.n>=2).sort((a,b)=>b.n-a.n);
  return {sk,wings,pl,n:ds.length};}
function anaAdvice(m){const sk=anaSkill();if(sk<9)return null;const D=anaData(m,1);const t=m.sides[0].tactics;
  for(const [w,key,side,who] of [['L4','blkR','R','przyjmujący'],['R2','blkL','L','atakujący']]){const x=D.wings[w];if(!x||x.n<(sk>=15?6:9))continue;
    const best=x.rawC>=0.62?0:x.rawC<=0.38?2:null;if(best==null||(t[key]??1)===best)continue;
    const pp=sk>=15?D.pl.filter(q=>q.w===w)[0]:null;
    const src=pp&&pp.n>=4?pp:x;return {k:'ana'+w+best+m.setNo,t:`Analityk: ${pp&&pp.n>=4?esc(pp.p.last)+' ('+who+')':who+' rywala'} bije ${best===0?'po skosie':'po prostej'} w ${best===0?src.cross:src.line}% ataków. Ustaw blok „${BLK_OPT[best][0].toLowerCase()}” na ${side==='L'?'lewej':'prawej'} stronie siatki.`,btn:`Blok ${BLK_OPT[best][0].toLowerCase()} (${side==='L'?'lewa':'prawa'})`,act:`setBlk('${side}',${best})`};}
  const x=D.wings.M;if(x&&x.n>=(sk>=15?6:9)){const arr=[['midS',0,x.mS,'prosto'],['midL',2,x.mL,'skos na strefę 5'],['midR',3,x.mR,'skos na strefę 1']].sort((a,b)=>b[2]-a[2]);const b=arr[0];
    if(b[2]>=55&&(t.blkM??1)!==b[1])return {k:'anaM'+b[1]+m.setNo,t:`Analityk: ataki rywala ze środka idą głównie ${b[3]} (${b[2]}%). Ustaw blok na środku: „${MID_OPT[b[1]][0].toLowerCase()}”.`,btn:`Blok środek: ${MID_OPT[b[1]][0].toLowerCase()}`,act:`tacSet('blkM',${b[1]})`};}

function benchScene(m,sc){const out=sc.map(o=>Object.assign({},o,{j:0}));const by=MV.FY1?(MV.FY1-24-MV.Y0)/MV.SC:10.4;
  for(const i of [0,1]){const ps=out.filter(o=>o.i===i);const cx=i===0?3.6:14.4,cy=Math.min(by-0.6,10.1),r=1.45;ps.forEach((o,k)=>{const ang=-Math.PI/2+k/ps.length*Math.PI*2;o.x=cx+Math.cos(ang)*r*1.35;o.y=cy+Math.sin(ang)*r*0.62;});}
  return out;}
function animScene(m,from,to,dur,done){const cv=document.getElementById('mcv');if(!cv){done&&done();return;}let t0=null;
  const sc=from.map(o=>Object.assign({},o));const tg={};for(const o of to)tg[o.id]=o;
  const fr=now=>{if(t0==null)t0=now;const t=Math.min(1,(now-t0)/dur),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    for(let k=0;k<sc.length;k++){const a=from[k],b=tg[a.id]||a;sc[k].x=a.x+(b.x-a.x)*e;sc[k].y=a.y+(b.y-a.y)*e;}
    if(ui.to)ui.to.scene=sc;drawHall(m,sc,null,null);if(t<1&&document.getElementById('mcv'))requestAnimationFrame(fr);else done&&done();};
  requestAnimationFrame(fr);}

const pickT=a=>a[Math.floor(Math.random()*a.length)];
function rallyComment(m,ev,setEnded,pre){const seq=ev.seq||[];const N=id=>{const p=findPl(m,id);return p?p.last:'?';};
  const last=k=>{for(let i=seq.length-1;i>=0;i--)if(seq[i].k===k)return seq[i];return null;};
  const w=ev.winner,T=i=>m.sides[i].team.short;const att=last('att'),blk=last('blk'),srv=seq[0],rec=seq.find(x=>x.k==='rec'),setI=att?seq.slice(0,seq.indexOf(att)).reverse().find(x=>x.k==='set'):last('set');

    case 'block':t=att&&att.tr?`Potrójny blok! ${N(att.id)} zatrzymany.`:pickT([`Monster blok: ${N(blk.id)}! Atakował ${N(att.id)}.`,`Ściana! ${N(blk.id)} zatrzymuje atak (${N(att.id)}).`,`${N(blk.id)} zamyka drogę — punkt blokiem!`]);break;
    case 'attErr':t=att?(att.d==='tip'?`${N(att.id)} kiwa prosto w siatkę.`:pickT([`${N(att.id)} psuje atak.`,`Za mocno! ${N(att.id)} w aut.`,`${N(att.id)} nie trafia w boisko.`])):'Błąd w ataku.';break;
    case 'setErr':t=`Błąd rozegrania${setI?': '+N(setI.id):''}.`;break;
    case 'mix':{const mx=last('mix');t=mx?`Nieporozumienie! ${N(mx.ids[0])} i ${N(mx.ids[1])} patrzą na siebie, a piłka spada.`:'Nieporozumienie w przyjęciu!';break;}
    default:{if(!att){const fr=last('free');t=fr?`Przebicie: ${N(fr.id)} — zamieszanie u rywala i punkt!`:'Punkt!';break;}
      const a=N(att.id),d=att.d;
      t=d==='tip'?pickT([`Sprytna kiwka: ${a}!`,`${a} oszukuje blok kiwką.`,`Kiwka za blok — ${a}!`])
       :d==='line'?pickT([`${a} wzdłuż linii — czysto!`,`${a} po prostej, obrona bez szans.`,`Atak po linii — ${a}!`])
       :d==='cross'?pickT([`${a} kończy po skosie!`,`Mocny skos — ${a}!`,`${a} omija blok po przekątnej.`])
       :att.q?pickT([`Szybka piłka — ${a}!${setI?` ${N(setI.id)} świetnie rozegrał.`:''}`,`${a} ze środka, nie do obrony.`])
       :pickT([`${a} kończy z drugiej linii!`,`Atak przez środek — ${a}!`]);}
  }
  if(atts>=3)t=`Co za wymiana! `+t;else if(digs>=2&&ev.type!=='ace')t=t+` Świetna obrona w tej akcji.`;
  let x='';const tgt=m.setNo===5?15:25;
  if(setEnded){const s=m.sets[m.sets.length-1];x=m.over?` KONIEC MECZU! ${T(m.winner)} wygrywa ${Math.max(...m.setsWon)}:${Math.min(...m.setsWon)}!`:` ${T(w)} wygrywa seta ${s[0]}:${s[1]}!`;}
  else{if(m.run&&m.run.t===w&&m.run.n>=3)x=` To już ${m.run.n}. punkt z rzędu ${T(w)}!`;
    const [a,b]=m.score;for(const i of [0,1]){const me=i?b:a,op=i?a:b;if(me>=tgt-1&&me>op){const mp=m.setsWon[i]===(2);x+=mp?` Piłka meczowa dla ${T(i)}!`:` Piłka setowa dla ${T(i)}!`;}}}
  return {t:t+x,w};}

function asstAll(m){const a=m.sides[0],b=m.sides[1];const sk=staffSkill('asy');const A=teamTotals(a),B=teamTotals(b);const out=[];const h=(m.hist||[]).filter(x=>x[0]===m.setNo);

  if(lastN.length>=6)out.push({g:'Przebieg',t:my>=6?`Gramy świetnie: ${my} z ostatnich ${lastN.length} punktów dla nas. Nic nie zmieniaj.`:my<=2?`Ostatnie ${lastN.length} akcji: tylko ${my} punkty dla nas. Rywal przejął inicjatywę.`:`Wyrównana gra: ${my} z ostatnich ${lastN.length} punktów dla nas.`,btn:my<=2&&a.to>0?'Weź czas':null,act:'myTimeout()'});
  // przyjęcie
  if(A.rec>=4){const r=A.recPos/A.rec;const worst=a.pl.filter(p=>p.st.rec>=3).sort((x,y)=>(x.st.recPos/x.st.rec)-(y.st.recPos/y.st.rec))[0];
    out.push({g:'Przyjęcie',t:r<0.45?`Przyjęcie słabe: ${pc(A.recPos,A.rec)} pozytywnego.${worst?` Najwięcej problemów ma ${worst.last} (${pc(worst.st.recPos,worst.st.rec)}).`:''} Przemowa „Skupcie się na przyjęciu” albo zmiana przyjmującego.`:`Przyjęcie w porządku: ${pc(A.recPos,A.rec)} pozytywnego.`,btn:r<0.45&&a.to>0?'Weź czas':null,act:'myTimeout()'});}
  // atak
  if(A.att>=6){const best=a.pl.filter(p=>p.st.att>=4).sort((x,y)=>y.st.kill/y.st.att-x.st.kill/x.st.att)[0];const poor=a.pl.filter(p=>p.st.att>=5).sort((x,y)=>x.st.kill/x.st.att-y.st.kill/y.st.att)[0];
    let t=`Nasz atak: ${pc(A.kill,A.att)} skuteczności.`;if(best)t+=` Najlepiej kończy ${best.last} (${best.st.kill}/${best.st.att}).`;if(poor&&poor!==best&&poor.st.kill/poor.st.att<0.3)t+=` ${poor.last} ma tylko ${poor.st.kill}/${poor.st.att}.`;
    const dist=best&&best.pos==='A'&&a.tactics.dist!==3?{btn:'Graj na atakującego',act:'setDist(3)'}:best&&best.pos==='S'&&a.tactics.dist!==2&&A.recPos/Math.max(1,A.rec)>0.55?{btn:'Graj środkiem',act:'setDist(2)'}:best&&best.pos==='P'&&a.tactics.dist!==1?{btn:'Graj na skrzydła',act:'setDist(1)'}:{};
    out.push(Object.assign({g:'Atak',t},sk>=8?dist:{}));}
  // blok i rywal (analityk)
  const ana=anaAdvice(m);if(ana)out.push({g:'Blok',t:ana.t,btn:ana.btn,act:ana.act});
  else if(B.att>=8)out.push({g:'Rywal',t:`Rywal kończy ${pc(B.kill,B.att)} ataków.${anaSkill()?'':' Bez analityka nie powiem, w które kierunki gra — zatrudnij go w Sztabie.'}`});
  // zagrywka

    if(r<0.45&&a.tactics.serve<2)out.push({g:'Zagrywka',t:`Rywal źle przyjmuje (${pc(B.recPos,B.rec)}). Możemy zaryzykować mocniejszą zagrywką.`,btn:'Ryzykowna zagrywka',act:'setServe(2)'});
    else if(w&&!a.tactics.tgt&&sk>=6&&(()=>{const rs=onCourt(b,m.serving===1).filter(e=>(e.role==='L'||e.role==='P')&&e.p!==w).map(e=>e.p.prz);return rs.length&&w.prz<=Math.min(...rs)-2;})())out.push({g:'Zagrywka',t:`Najsłabiej przyjmuje ${w.last} (przyjęcie ${w.prz}). Celujmy w niego.`,btn:`Zagrywka w ${w.last}`,act:`setTgt('${w.id}')`});
    else if(A.srvErr>=4&&a.tactics.serve===2)out.push({g:'Zagrywka',t:`Za dużo błędów zagrywki (${A.srvErr}). Zmniejsz ryzyko.`,btn:'Normalna zagrywka',act:'setServe(1)'});}

   <div class="asl">${L.map(x=>`<div class="asi"><span class="asg">${x.g}</span><span class="ast">${esc(x.t)}</span>${x.btn?`<button class="btn sm" onclick="${x.act};ui.fmPanel='asst';render()">✓ ${esc(x.btn)}</button>`:''}</div>`).join('')}</div>
   <p class="small mut" style="margin:6px 0 0">${sk<6?'Słaby asystent widzi tylko najważniejsze rzeczy. Lepszy (Sztab) da więcej i trafniejszych rad, np. o rozegraniu.':sk<8?'Lepszy asystent (8+) podpowie też, na kogo rozgrywać.':'Rady odświeżają się po każdej akcji.'}</p></div>`;}
// ================= SZKIELET INTERFEJSU: MENU BOCZNE, PASEK KLUBU, EKRAN GŁÓWNY =================
const NAV=[['home','🏠','Ekran główny'],['mecz','🏐','Mecz i sezon'],['sklad','👥','Skład'],['taktyka','📋','Taktyka'],['trening','🏋️','Trening'],['kalendarz','📅','Terminarz'],['tabela','🏆','Tabela'],['staty','📈','Statystyki'],['transfery','🔁','Transfery'],['finanse','💰','Finanse'],['sztab','🧑‍🏫','Sztab'],['juniorzy','🌱','Juniorzy'],['klub','🏟️','Infrastruktura'],['trener','🎓','Trener']];
function teamCrest(i,size){const t=TEAMS[i];if(!t)return '';if(SAVE.custom&&SAVE.custom.idx===i)return crestSvg(t.name,t.short,t.color,size,SAVE.custom.crest);return crestSvg(t.name,t.short,t.color,size,(i*7+3)%20);}
function liveMatch(){return ui.match&&!ui.match.over;}
function sideNav(){const mini=ui.tab==='mecz'&&liveMatch();const newsN=(SAVE.news||[]).filter(x=>x.d===today()).length;
  const item=([k,ic,l])=>`<button class="nav ${ui.tab===k?'on':''}" onclick="ui.navOpen=false;go('${k}')" title="${l}"><span class="ic">${ic}</span><span class="tx">${l}</span></button>`;
  return `<aside class="side ${mini?'mini':''} ${ui.navOpen?'open':''}">
   <button class="nav act" onclick="ui.navOpen=false;nextAction()" title="Następna akcja"><span class="ic">⏩</span><span class="tx">Następna akcja</span></button>
   <button class="nav" onclick="ui.navOpen=false;nextDay()" title="Następny dzień"><span class="ic">▶</span><span class="tx">Następny dzień</span></button>
   <div class="navsep"></div>
   ${NAV.map(item).join('')}
   <div class="navgap"></div>
   <button class="nav ${ui.tab==='zapis'?'on':''}" onclick="ui.navOpen=false;go('zapis')" title="Zapis i wczytanie"><span class="ic">💾</span><span class="tx">Zapis gry</span></button>
   <button class="nav small ${ui.tab==='test'?'on':''}" onclick="ui.navOpen=false;go('test')" title="Test silnika"><span class="ic">🧪</span><span class="tx">Test silnika</span></button>
  </aside>${ui.navOpen?'<div class="navshade" onclick="ui.navOpen=false;render()"></div>':''}`;}
// ---- pasek klubu ----
function myLineupPlayers(){const t=myTeam();const lu=SAVE.lineup||{};return Object.values(lu).map(id=>t.players.find(p=>p.id===id)).filter(Boolean);}
function topBar(){const t=myTeam();const ps=t.players;const mor=Math.round(ps.reduce((s,p)=>s+(p.mor==null?60:p.mor),0)/Math.max(1,ps.length));
  const chem=chemPct(chemOf(myLineupPlayers(),t.idx));const conf=SAVE.board?Math.round(SAVE.board.conf):60;
  const lu=SAVE.lineup;const okLu=validLineup(t,lu)&&!myLineupPlayers().some(p=>p.inj);
  const s=S();let pos='—';if(s&&(s.phase==='liga'||s.phase==='po'||s.phase==='end')){const tb=leagueTable();pos=(tb.findIndex(x=>x.i===SAVE.team)+1)+'. miejsce';}
  const bar=(l,v)=>`<div class="tbr"><i style="width:${Math.max(4,v)}%;background:${v>=70?'#22c55e':v>=45?'#eab308':'#ef4444'}"></i><span>${l} ${v}%</span></div>`;
  const d=today();
  return `<div class="topbar">
   <button class="burger" onclick="ui.navOpen=!ui.navOpen;render()" aria-label="Menu">☰</button>
   <div class="tlogo">🏐 Volley<b>Manager</b></div>
   <div class="tcr" onclick="go('home')">${teamCrest(SAVE.team,40)}</div>
   <div class="tclub"><span class="lab">Klub</span><b>${esc(t.name)}</b></div>
   <div class="tbars"><span class="lab">Drużyna</span>${bar('Morale',mor)}${bar('Zgranie',chem)}${bar('Zarząd',conf)}</div>
   <div class="tcell" onclick="go('sklad')" title="${okLu?'Skład gotowy':'W składzie jest kontuzjowany zawodnik albo brakuje pozycji'}"><span class="lab">Skład</span><b style="font-size:22px;color:${okLu?'var(--good)':'var(--bad)'}">${okLu?'✔':'⚠'}</b></div>
   <div class="tcell"><span class="lab">Pozycja</span><b>${pos}</b></div>
   <div class="tcell" onclick="go('finanse')"><span class="lab">Budżet</span><b>${fmt(SAVE.fin?SAVE.fin.bal:0)}</b></div>
   <div class="tcell"><span class="lab">Data</span><b>${DOW[dow(d)]}<br>${fmtDMY(d)}</b></div>
  </div>`;}
// ---- czas gry ----
function nextAction(){if(liveMatch()){go('mecz');return;}const s=S();if(!s||SAVE.fired){go('mecz');return;}
  const e=nextEvent();if(!e){go('mecz');return;}
  if(e.d>today()){advanceTo(e.d);save();ui.tab='home';render();return;}
  const c=myNext();if(c&&(s.phase==='spar'||s.phase==='liga'||s.phase==='po')){playNext();return;}
  go('mecz');}
function nextDay(){if(liveMatch()){go('mecz');return;}const e=nextEvent();const t=addDays(today(),1);
  if(e&&t>e.d){ui.msg='Dziś jest dzień meczowy — najpierw rozegraj mecz („Następna akcja”).';ui.tab='home';render();return;}
  advanceTo(t);save();ui.tab='home';render();}
// ---- ekran główny ----
function teamForm(i){const s=S();const out=[];
  if(i===SAVE.team&&s.spar)for(const g of s.spar.res)out.push(g);
  for(const rd of s.results||[])for(const g of rd)if(g.h===i||g.a===i)out.push(g);
  if(s.po)for(const sr of s.po.series)for(const g of sr.games)if(g.h===i||g.a===i)out.push(g);
  return out.slice(-5).map(g=>{const w=(g.h===i)===(g.sw[0]===3);return w;});}
function formDots(i){const f=teamForm(i);const pad=Array(Math.max(0,5-f.length)).fill(null);return `<div class="hdots">${pad.concat(f).map(w=>`<span class="${w==null?'n':w?'w':'l'}"></span>`).join('')}</div>`;}
function hNext(){const s=S();
  if(SAVE.fired)return `<div class="pan hnext"><div class="ttl">Następny mecz</div><div class="hvs"><b>Jesteś bez klubu</b><div class="mut">Sprawdź oferty w zakładce Trener.</div><button class="btn" onclick="go('trener')">Oferty pracy</button></div></div>`;
  if(s.phase==='off'||s.phase==='end')return `<div class="pan hnext"><div class="ttl">Następny mecz</div><div class="hvs"><b>${s.phase==='off'?'Przerwa między sezonami':'Sezon zakończony'}</b><div class="mut">${s.phase==='off'?'Okno transferowe otwarte. Kontrakty, transfery i przygotowania.':'Podsumowanie sezonu czeka w zakładce Mecz i sezon.'}</div><button class="btn" onclick="go('mecz')">Przejdź</button></div></div>`;
  const c=myNext();const e=nextEvent();
  if(!c)return `<div class="pan hnext"><div class="ttl">Następny mecz</div><div class="hvs"><b>Brak planowanych spotkań</b><div class="mut">Twoja drużyna nie gra w tej fazie.</div><button class="btn" onclick="go('mecz')">Pozostałe mecze</button></div></div>`;
  const home=c.h===SAVE.team,op=home?c.a:c.h;
  const comp=s.phase==='spar'?`Sparing ${s.spar.res.length+1}/${N_SPAR}`:s.phase==='liga'?`Liga · ${s.round+1}. kolejka`:`Play-off · ${STAGE[s.po.series.find(x=>x.id===c.sid).st]}`;
  const days=e?daysBetween(today(),e.d):0;const isDay=days<=0;
  return `<div class="pan hnext"><div class="ttl">Następny mecz</div><div class="hnx">
   <div class="hcr">${teamCrest(c.h,96)}${formDots(c.h)}</div>
   <div class="hvs"><b>${esc(TEAMS[c.h].name)} – ${esc(TEAMS[c.a].name)}</b>
    <div class="mut">${comp} · ${home?'u siebie':'na wyjeździe'}</div>
    <div class="mut">${e?fmtLong(e.d)+(e.t?' · '+e.t:''):''}</div>
    ${isDay?`<div class="hday">Dzień meczowy!</div><div class="row" style="justify-content:center;gap:8px;margin-top:8px"><button class="btn" onclick="playNext()">▶ Przejdź do meczu</button><button class="ghost" onclick="simNext()">Symuluj</button></div>`
     :`<div class="hday mut">za ${days} ${days===1?'dzień':'dni'}</div><button class="btn" style="margin-top:8px" onclick="nextAction()">⏩ Do dnia meczu</button>`}
    <div class="small mut" style="margin-top:6px">Rywal: ${tDot(op)}${esc(TEAMS[op].short)} · siła ${teamStrength(TEAMS[op])} (Twoja ${teamStrength(myTeam())})</div></div>
   <div class="hcr">${teamCrest(c.a,96)}${formDots(c.a)}</div></div></div>`;}
function hTable(){const s=S();if(!(s.phase==='liga'||s.phase==='po'||s.phase==='end'))return `<div class="pan"><div class="ttl">Tabela ligowa</div><div class="mut small">Tabela ruszy po sparingach, w pierwszej kolejce ligi.</div>${s.phase==='spar'?`<table class="htb">${TEAMS.map(t=>t).sort((a,b)=>teamStrength(b)-teamStrength(a)).slice(0,12).map((t,k)=>`<tr class="${t.idx===SAVE.team?'me':''}"><td>${k+1}.</td><td class="tl">${tDot(t.idx)}${esc(t.name)}</td><td class="mut">siła ${teamStrength(t)}</td></tr>`).join('')}</table><div class="small mut">Kolejność według siły składu.</div>`:''}</div>`;
  const tb=leagueTable();const c=myNext();const op=c?(c.h===SAVE.team?c.a:c.h):-1;
  return `<div class="pan"><div class="ttl">Tabela ligowa</div><table class="htb"><tr><th></th><th class="tl">Drużyna</th><th>M</th><th>Pkt</th><th>Z</th><th>P</th><th>Sety</th><th>+/−</th></tr>
   ${tb.map((x,k)=>`<tr class="${x.i===SAVE.team?'me':x.i===op?'op':''} ${k===7?'cut':''}"><td>${k+1}.</td><td class="tl">${tDot(x.i)}${esc(TEAMS[x.i].name)}</td><td>${x.m}</td><td class="pk">${x.pts}</td><td>${x.w}</td><td>${x.l}</td><td>${x.sw}:${x.sl}</td><td>${x.pw-x.pl>0?'+':''}${x.pw-x.pl}</td></tr>`).join('')}</table>
   <div class="small mut" style="margin-top:4px">Linia pod 8. miejscem: awans do play-off.</div></div>`;}
function hFixtures(){const ev=myEvents();const ds=Object.keys(ev).sort();const up=[],done=[];
  for(const d of ds)for(const e of ev[d]){(e.r?done:up).push({d,...e});}
  const kind=e=>e.kind==='spar'?'Sparing':e.kind==='liga'?`Liga, ${e.k}. kolejka`:'Play-off';
  const row=(e,res)=>{const my=res?e.r:null;let badge='';if(my){const w=(my.h===SAVE.team)===(my.sw[0]===3);const sc=my.h===SAVE.team?my.sw[0]+':'+my.sw[1]:my.sw[1]+':'+my.sw[0];badge=`<span class="hres ${w?'w':'l'}">${sc}</span>`;}
    return `<tr><td>${e.d.slice(8)}.${e.d.slice(5,7)}</td><td class="tl">${tDot(e.op)}${esc(TEAMS[e.op].name)} <span class="mut">(${e.home?'D':'W'})</span></td><td>${badge}</td><td class="mut">${kind(e)}</td></tr>`;};
  return `<div class="pan"><div class="ttl">Nadchodzące mecze</div><table class="hfx">${up.slice(0,4).map(e=>row(e,false)).join('')||'<tr><td class="mut">Brak.</td></tr>'}</table>
   <div class="ttl" style="margin-top:10px">Rozegrane mecze</div><table class="hfx">${done.slice(-4).reverse().map(e=>row(e,true)).join('')||'<tr><td class="mut">Jeszcze nic nie rozegrano.</td></tr>'}</table></div>`;}
function newsIcon(t){const m=String(t).match(/^\p{Extended_Pictographic}/u);return m?m[0]:'📰';}
function hNews(){const n=SAVE.news||[];
  const strip=t=>String(t).replace(/^\p{Extended_Pictographic}️?\s*/u,'');
  const big=n.slice(0,3),rest=n.slice(3,9);
  return `<div class="pan"><div class="ttl">Wiadomości</div>${n.length?`<div class="hnews">${big.map(x=>`<div class="hncard"><span class="d">${x.d?fmtLong(x.d).replace(/ \d{4}$/,''):''}</span><span class="ico">${newsIcon(x.t)}</span><span class="t">${esc(strip(x.t))}</span></div>`).join('')}</div>
   ${rest.map(x=>`<div class="hnl"><span>${newsIcon(x.t)}</span><span class="mut small">${x.d?fmtShort(x.d):''}</span><span class="t">${esc(strip(x.t))}</span></div>`).join('')}`:'<div class="mut small">Brak wiadomości. Tu pojawią się wyniki, kontuzje, transfery i decyzje zarządu.</div>'}</div>`;}
function hLast(){const L=SAVE.lastMatch;if(!L)return `<div class="pan"><div class="ttl">Podsumowanie ostatniego meczu</div><div class="mut small">Po pierwszym meczu zobaczysz tu wynik, MVP i najważniejsze liczby.</div></div>`;
  const w=(L.h===SAVE.team)===(L.sw[0]===3);
  return `<div class="pan"><div class="ttl">Podsumowanie ostatniego meczu</div>
   <div class="hlast"><span>${tDot(L.h)}</span><b>${esc(TEAMS[L.h].name)} – ${esc(TEAMS[L.a].name)} ${L.sw[0]}:${L.sw[1]}</b><span class="hres ${w?'w':'l'}">${w?'Wygrana':'Porażka'}</span><span class="mut small" style="margin-left:auto">${L.sets.map(x=>x[0]+':'+x[1]).join(' · ')} · ${L.d?fmtDMY(L.d):''}</span></div>
   <div class="hsum"><div><span class="lab">MVP</span><b>${esc(L.mvp||'—')}</b></div><div><span class="lab">Atak</span><b>${L.atk}%</b></div><div><span class="lab">Bloki</span><b>${L.blk}</b></div><div><span class="lab">Asy</span><b>${L.ace}</b></div><div><span class="lab">${L.home?'Widzów':'Mecz'}</span><b>${L.home?(L.att||0).toLocaleString('pl-PL'):'wyjazdowy'}</b></div></div></div>`;}
function hCalendar(){const ev=myEvents();const s=S();const tr=SAVE.training?(TRAIN_FOCUS.find(x=>x[0]===SAVE.training.focus)||[])[1]:null;const out=[];
  for(let k=0;k<5;k++){const d=addDays(today(),k);const list=[];
    for(const e of ev[d]||[]){const lab=e.kind==='spar'?'Sparing':e.kind==='liga'?'Liga':'Play-off';list.push(`<div class="hev m">${lab}: ${esc(TEAMS[e.home?SAVE.team:e.op].short)} – ${esc(TEAMS[e.home?e.op:SAVE.team].short)}${e.r?` (${e.r.sw[0]}:${e.r.sw[1]})`:''}</div>`);if(e.kind==='liga')list.push('<div class="hev">Liga juniorów</div>');}
    if(s.offDate===d)list.push('<div class="hev">Otwarcie okna transferowego</div>');
    if(!list.length)list.push(s.phase==='off'?'<div class="hev">Urlop / przygotowania</div>':`<div class="hev">Trening${tr?': '+esc(tr.toLowerCase()):''}</div>`);
    out.push(`<div class="hdaycol ${k===0?'today':''}"><div class="hdh">${k===0?'Dziś':fmtShort(d)}</div>${list.join('')}</div>`);}
  return `<div class="hcal">${out.join('')}</div>`;}
function homeView(){const s=S();if(!s)return '';
  return `${ui.msg?`<div class="card msg">${ui.msg}</div>`:''}${s.phase==='off'?'':boardCard()}<div class="hgrid"><div class="hcol">${hNext()}${hTable()}${hFixtures()}</div><div class="hcol">${hNews()}${hLast()}</div></div>${hCalendar()}`;}
applyCustom();
// ================= START =================
if(SAVE.team!=null){if(!SAVE.date&&!SAVE.world)SAVE.date=GAME_START;if(!SAVE.world)initWorld();else syncTeams();if(!SAVE.season)newSeason(1);migrateDates();initClub();}
if(SAVE.live){try{ui.match=deserMatch(SAVE.live);ui.match.log.push({t:'Wznowiono zapisany mecz — kliknij „Graj”, żeby kontynuować.',c:'sys'});}catch(e){SAVE.live=null;ui.match=null;}}
render();

if(document.addEventListener)document.addEventListener('keydown',e=>{if(e.code==='Space'&&ui.match&&!ui.match.over&&ui.tab==='mecz'&&!/INPUT|SELECT|TEXTAREA/.test((e.target||{}).tagName||'')){e.preventDefault();togglePause();}});

</script><script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
