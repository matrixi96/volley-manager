  return `<div class="card"><h2>Test silnika meczu</h2><p class="mut">Symulacja wielu meczów naraz (automatyczne składy). Pozwala sprawdzić, czy wyniki i statystyki są realistyczne.</p>

}

let PLAYERS={};
function rebuildIndex(){PLAYERS={};if(SAVE.world){for(const p of SAVE.world.players)PLAYERS[p.id]={p,t:p.tm>=0&&!p.jr?TEAMS[p.tm]:null};}else for(const t of TEAMS)for(const p of t.players)PLAYERS[p.id]={p,t};}

const N_SPAR=7;

function makeFixtures(n){const t=[...Array(n).keys()].sort(()=>R()-0.5);const rounds=[];for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];pr.push(r%2?[b,a]:[a,b]);}rounds.push(pr);t.splice(1,0,t.pop());}return rounds;}
function newSeason(n,phase){
  const first=makeFixtures(TEAMS.length);const second=first.map(rd=>rd.map(([h,a])=>[a,h]));
  const others=TEAMS.map(t=>t.idx).filter(i=>i!==SAVE.team).sort(()=>R()-0.5).slice(0,N_SPAR);
  SAVE.season={n:n||1,phase:phase||'spar',spar:{opps:others,res:[]},rounds:first.concat(second),round:0,results:[],po:null,final:null,ps:{}};
  if(SAVE.world)for(const p of SAVE.world.players)p.base=snap(p);

  if(SAVE.team!=null&&SAVE.world)SAVE.season.goal=goalFor(SAVE.team);

}
const PHASE_NAMES={off:'Okno transferowe',spar:'Okres przygotowawczy',liga:'Faza zasadnicza',po:'Play-off',end:'Koniec sezonu'};
function tName(i){return esc(TEAMS[i].name);}
function tDot(i){if(SAVE.custom&&SAVE.custom.idx===i&&typeof crestSvg==='function')return `<span class="tcrest">${crestSvg(TEAMS[i].name,TEAMS[i].short,TEAMS[i].color,14,SAVE.custom.crest)}</span>`;return `<span class="dot" style="background:${TEAMS[i].color}"></span>`;}

// ---- tabela ----
function leagueTable(){return tableFrom(S().results);}
function tableFrom(results){const T=TEAMS.map(t=>({i:t.idx,m:0,w:0,l:0,pts:0,sw:0,sl:0,pw:0,pl:0}));
  for(const rd of results)for(const g of rd){const h=T[g.h],a=T[g.a];h.m++;a.m++;h.sw+=g.sw[0];h.sl+=g.sw[1];a.sw+=g.sw[1];a.sl+=g.sw[0];
    for(const st of g.sets){h.pw+=st[0];h.pl+=st[1];a.pw+=st[1];a.pl+=st[0];}
    const hw=g.sw[0]===3,W=hw?h:a,Lo=hw?a:h,ls=Math.min(...g.sw);W.w++;Lo.l++;W.pts+=ls<=1?3:2;Lo.pts+=ls===2?1:0;}
  const ratio=(x,y)=>y?x/y:x?99:0;
  return T.sort((x,y)=>y.pts-x.pts||y.w-x.w||ratio(y.sw,y.sl)-ratio(x.sw,x.sl)||ratio(y.pw,y.pl)-ratio(x.pw,x.pl));}
function rankOf(i){return leagueTable().findIndex(x=>x.i===i)+1;}

// ---- uczestnicy / symulacja ----
function participant(i,home){const t=TEAMS[i];const mine=i===SAVE.team;return {team:t,lineup:mine?healthyLineup(t,myLineup()).lu:autoLineup(t),tactics:mine?Object.assign({},myTac()):{serve:1,dist:0},home,x:(()=>{const md=clubMods(i);const o={hb:md.hb,fat:md.fat,sb:md.sb};if(mine){o.cap=SAVE.captain;const cx=coachMatchX();o.sb+=(cx.sb||0)+(typeof tacPrep==='function'?tacPrep()*0.004:0)+(typeof oppPrepBonus==='function'?oppPrepBonus():0);o.momMul=cx.momMul;o.prB=cx.prB;o.trB=cx.trB;}return o;})()};}
function resultOf(m,h,a){const flip=m.sides[0].team.idx!==h;return {h,a,sets:m.sets.map(x=>flip?[x[1],x[0]]:x.slice()),sw:flip?[m.setsWon[1],m.setsWon[0]]:m.setsWon.slice()};}
function addTogether(m){try{formAfterMatch(m);}catch(e){console.error(e);}try{if(typeof pairsAfterMatch==='function')pairsAfterMatch(m);}catch(e){}for(const sd of m.sides)for(const p of sd.pl){const x=p.st;if(x.srv+x.rec+x.att+x.dig+x.blk===0&&!sd.slots.some(z=>z.p.id===p.id)&&sd.libero!==p)continue;
  const w=PLAYERS[p.id]&&PLAYERS[p.id].p;if(!w)continue;if(w.tcTm!==sd.team.idx){w.tcTm=sd.team.idx;w.tc=0;}w.tc=(w.tc||0)+1;}}
function recordStats(m){addTogether(m);const s=S();const ps=s.ps;const ts=s.ts||(s.ts={});
  m.sides.forEach((sd,i)=>{const r=ts[sd.team.idx]||(ts[sd.team.idx]={m:0,sets:0,kill:0,att:0,attErr:0,blk:0,ace:0,srvErr:0,srv:0,rec:0,recPos:0,dig:0,pw:0,pl:0});
    r.m++;r.sets+=m.sets.length;for(const st of m.sets){r.pw+=st[i];r.pl+=st[1-i];}
    for(const p of sd.pl){const x=p.st;r.kill+=x.kill;r.att+=x.att;r.attErr+=x.attErr;r.blk+=x.blk;r.ace+=x.ace;r.srvErr+=x.srvErr;r.srv+=x.srv;r.rec+=x.rec;r.recPos+=x.recPos;r.dig+=x.dig;}});
  for(const sd of m.sides)for(const p of sd.pl){const x=p.st;if(x.srv+x.rec+x.att+x.dig+x.blk===0)continue;
    const r=ps[p.id]||(ps[p.id]={m:0,pts:0,kill:0,att:0,attErr:0,blk:0,ace:0,srvErr:0,rec:0,recPos:0,dig:0,mvp:0});
    r.m++;r.kill+=x.kill;r.att+=x.att;r.attErr+=x.attErr;r.blk+=x.blk;r.ace+=x.ace;r.srvErr+=x.srvErr;r.rec+=x.rec;r.recPos+=x.recPos;r.dig+=x.dig;r.pts+=x.kill+x.blk+x.ace;}
  const w=m.sides[m.winner];const mvp=w.pl.slice().sort((a,b)=>mvpScore(b)-mvpScore(a))[0];if(ps[mvp.id])ps[mvp.id].mvp++;
  injuryCheck(m,1);}
function simFixture(h,a,stats){const m=simMatch(participant(h,true),participant(a,false));if(stats)recordStats(m);return resultOf(m,h,a);}

// ---- mecz użytkownika ----
function myNext(){
  const s=S();
  if(s.phase==='spar'){const k=s.spar.res.length;if(k>=N_SPAR)return null;const o=s.spar.opps[k];return k%2===0?{kind:'spar',h:SAVE.team,a:o}:{kind:'spar',h:o,a:SAVE.team};}
  if(s.phase==='liga'){const f=s.rounds[s.round].find(f=>f[0]===SAVE.team||f[1]===SAVE.team);return {kind:'liga',h:f[0],a:f[1]};}
  if(s.phase==='po'){const sr=activeSeries().find(x=>x.hi===SAVE.team||x.lo===SAVE.team);if(!sr)return null;const h=seriesHome(sr);return {kind:'po',sid:sr.id,h,a:h===sr.hi?sr.lo:sr.hi};}
  return null;
}
function buildMatch(ctx){
  const meHome=ctx.h===SAVE.team;const op=meHome?ctx.a:ctx.h;
  const m=newMatch(participant(SAVE.team,meHome),participant(op,!meHome));
  m.log=[];m.paused=false;m.hl=[];m.ctx=ctx;matchCrowd(m);if(meHome&&m.cap){m.sides[0].form+=(m.att/m.cap-0.75)*0.02;}
  m.log.push({t:`${ctx.kind==='spar'?'Sparing':ctx.kind==='po'?'Play-off':'Liga'} · ${meHome?'mecz u siebie':'mecz wyjazdowy'}. Losowanie: seta zaczyna zagrywką <b>${esc(m.sides[m.serving].team.name)}</b>.`,c:'sys'});
  return m;
}
function playNext(){if(SAVE.fired)return;syncDate();const c=myNext();if(!c)return;const m=buildMatch(c);ui.match=m;ui.view='log';ui.subSel=null;ui.tab='mecz';persistLive();render();schedule();}
function simNext(){if(SAVE.fired)return;syncDate();const c=myNext();if(!c)return;const m=buildMatch(c);m.quick=true;while(!m.over)doRally(m);ui.match=m;ui.view='post';ui.tab='mecz';render();}
function finishMatch(m){
  if(m.recorded||!m.ctx)return;m.recorded=true;const c=m.ctx,s=S();
  const res=resultOf(m,c.h,c.a);res.me=true;res.d=today();
  if(c.kind==='spar'){addTogether(m);s.spar.res.push(res);injuryCheck(m,0.5);roundTick('spar',false);}
  else if(c.kind==='liga'){const psB=psSnap(),tbB=leagueTable();recordStats(m);boardAfterMatch(res);const rd=[];for(const f of s.rounds[s.round]){if(f[0]===c.h&&f[1]===c.a)rd.push(res);else rd.push(simFixture(f[0],f[1],true));}
    s.results.push(rd);simJrRound(s.round);s.round++;leagueNews(psB,tbB,rd,s.round);roundTick('liga',c.h===SAVE.team,m.att);if(s.round>=s.rounds.length)startPlayoff();}
  else if(c.kind==='po'){recordStats(m);boardAfterMatch(res);playPoDay(c.sid,res);roundTick('po',c.h===SAVE.team,m.att);}
  try{fatigueAfterMatch(m);}catch(e){}storeLast(m,c);mailMatch(m,c);try{dcRecord(m,c);}catch(e){console.error(e);}try{for(const p of m.sides[1].pl)if(p.st.srv+p.st.rec+p.st.att+p.st.dig+p.st.blk>0)addKnow(p.id,12);if(SAVE.tactics)delete SAVE.tactics.tgt;}catch(e){}SAVE.live=null;save();
}
function storeLast(m,c){try{const me=m.sides[0];const T=teamTotals(me);const w=m.sides[m.winner];const mvp=w.pl.slice().sort((a,b)=>mvpScore(b)-mvpScore(a))[0];
  const r=resultOf(m,c.h,c.a);const won=m.winner===0;const sc=c.h===SAVE.team?r.sw[0]+':'+r.sw[1]:r.sw[1]+':'+r.sw[0];const op=TEAMS[c.h===SAVE.team?c.a:c.h];
  news(`${won?'✅ Wygrana':'❌ Porażka'} ${sc} z ${op.short} (${c.kind==='spar'?'sparing':c.kind==='po'?'play-off':'liga'}) · MVP: ${mvp?mvp.first+' '+mvp.last:'—'}`);
  if(c.kind==='liga'){const ld=leagueTable()[0].i;if(SAVE.lastLeader!==ld){SAVE.lastLeader=ld;news(`🏆 ${TEAMS[ld].name} ${ld===SAVE.team?'— jesteśmy liderem ligi!':'nowym liderem ligi'}`);}}
  SAVE.lastMatch={h:c.h,a:c.a,sets:r.sets,sw:r.sw,d:today(),home:c.h===SAVE.team,att:m.att||0,mvp:mvp?mvp.last:'',atk:T.att?Math.round(T.kill/T.att*100):0,blk:T.blk,ace:T.ace};}catch(e){}}

// ---- play-off ----
function mkSeries(st,a,b,need){const ra=rankOf(a),rb=rankOf(b);const hi=ra<rb?a:b,lo=hi===a?b:a;return {id:st+'-'+hi+'-'+lo,st,hi,lo,need,w:[0,0],games:[]};}
function startPlayoff(){const s=S();const tb=leagueTable().map(x=>x.i);s.seed=tb;s.phase='po';
  s.po={stage:'QF',day:0,series:[mkSeries('QF',tb[0],tb[7],2),mkSeries('QF',tb[3],tb[4],2),mkSeries('QF',tb[1],tb[6],2),mkSeries('QF',tb[2],tb[5],2)]};}
function seriesDone(sr){return sr.w[0]>=sr.need||sr.w[1]>=sr.need;}
function seriesWinner(sr){return sr.w[0]>=sr.need?sr.hi:sr.lo;}
function seriesLoser(sr){return sr.w[0]>=sr.need?sr.lo:sr.hi;}
function seriesHome(sr){return sr.games.length%2===0?sr.hi:sr.lo;}
function activeSeries(){const s=S();if(!s.po)return [];const st=s.po.stage;return s.po.series.filter(x=>(st==='FB'?(x.st==='F'||x.st==='B'):x.st===st)&&!seriesDone(x));}
function addGame(sr,res){sr.games.push(res);const hiWon=(res.h===sr.hi)===(res.sw[0]===3);sr.w[hiWon?0:1]++;}
function playPoDay(mySid,myRes){
  const s=S();
  for(const sr of activeSeries()){if(sr.id===mySid){addGame(sr,myRes);continue;}const h=seriesHome(sr);const g=simFixture(h,h===sr.hi?sr.lo:sr.hi,true);g.d=today();addGame(sr,g);}
  s.po.day++;advanceStage();
}
function advanceStage(){
  const s=S(),po=s.po;if(activeSeries().length)return;
  const seedRank=i=>s.seed.indexOf(i);
  if(po.stage==='QF'){const w=po.series.filter(x=>x.st==='QF').map(seriesWinner).sort((a,b)=>seedRank(a)-seedRank(b));
    po.series.push(mkSeriesSeed('SF',w[0],w[3],2),mkSeriesSeed('SF',w[1],w[2],2));po.stage='SF';}
  else if(po.stage==='SF'){const sf=po.series.filter(x=>x.st==='SF');
    po.series.push(mkSeriesSeed('F',seriesWinner(sf[0]),seriesWinner(sf[1]),3),mkSeriesSeed('B',seriesLoser(sf[0]),seriesLoser(sf[1]),2));po.stage='FB';}
  else if(po.stage==='FB'){finishSeason();}
}
function mkSeriesSeed(st,a,b,need){const s=S();const hi=s.seed.indexOf(a)<s.seed.indexOf(b)?a:b;const lo=hi===a?b:a;return {id:st+'-'+hi+'-'+lo,st,hi,lo,need,w:[0,0],games:[]};}
function simPoDay(){if(S().phase!=='po')return;const mine=myNext();if(mine)return;playPoDay(null,null);roundTick('po',false);syncDate();save();render();}
function simPoAll(){while(S().phase==='po'&&!myNext()){playPoDay(null,null);roundTick('po',false);syncDate();}save();render();}
function finishSeason(){
  const s=S(),po=s.po,ser=st=>po.series.filter(x=>x.st===st);
  const F=ser('F')[0],B=ser('B')[0];
  const qfL=ser('QF').map(seriesLoser).sort((a,b)=>s.seed.indexOf(a)-s.seed.indexOf(b));
  s.final=[seriesWinner(F),seriesLoser(F),seriesWinner(B),seriesLoser(B)].concat(qfL,s.seed.slice(8));
  s.phase='end';s.endDate=addDays(s.podates[Math.max(0,s.po.day-1)],3);
  s.final.forEach((ti,pl)=>{const a=SAVE.ai[ti];a.rep=Math.round(clamp(a.rep*0.75+(95-pl*7)*0.25,10,100));});
  const myPl=s.final.indexOf(SAVE.team);money(PRIZE[myPl],'Nagrody');finLog(`Nagroda za ${myPl+1}. miejsce w sezonie ${sLabel(s.n)}`,PRIZE[myPl]);
  SAVE.history=SAVE.history||[];SAVE.history.push({n:s.n,team:SAVE.team,place:s.final.indexOf(SAVE.team)+1,champ:s.final[0],league:s.seed.indexOf(SAVE.team)+1});
  seasonEvaluation();
}

  setNo:m.setNo,score:m.score,setsWon:m.setsWon,sets:m.sets,firstServe:m.firstServe,serving:m.serving,run:m.run,rallies:m.rallies,sideout:m.sideout,log:m.log.slice(-150),ctx:m.ctx,hist:m.hist||[],att:m.att,cap:m.cap,hallLv:m.hallLv,homeIdx:m.homeIdx,mid:m.mid,dirStats:m.dirStats||[],mixN:m.mixN||[0,0],rs:m.rs,pt:m.pt};}
function deserMatch(o){const m=Object.assign({},o,{over:false,paused:true,hl:[]});
  m.sides=o.sides.map(x=>{const t=TEAMS[x.ti];const pl=t.players.map(cloneP);const g=id=>pl.find(p=>p.id===id);
    if(typeof pairBonusSide==='function'){try{pairBonusSide(t,{R:x.slots[0].id,P1:x.slots[1].id,S1:x.slots[2].id,A:x.slots[3].id,P2:x.slots[4].id,S2:x.slots[5].id,L:x.lib},pl);}catch(e){}}
    for(const q of x.pl){const p=g(q.id);if(!p)continue;p.en=q.en;p.st=q.st;if(q.mor!=null)p.mor=q.mor;}
    return {team:t,pl,slots:x.slots.map(s=>({role:s.role,p:g(s.id)})),libero:g(x.lib),tmp:x.tmp,rot:x.rot,tactics:x.tactics,mom:x.mom,home:x.home,fatMul:x.fatMul||1,momMul:x.momMul||1,prB:x.prB||0,trB:x.trB||0,form:x.form,to:x.to,subs:x.subs,chem:x.chem!=null?x.chem:chemOf(x.slots.map(s=>g(s.id)).concat([g(x.lib)]),t.idx)};});
  if(m.att==null&&m.ctx)matchCrowd(m);

function W(){return SAVE.world;}
function fmt(n){n=Math.round(n);const a=Math.abs(n);let s;if(a>=1e6)s=(n/1e6).toFixed(2).replace('.',',')+' mln';else if(a>=1e3)s=Math.round(n/1e3)+' tys.';else s=String(n);return s+' zł';}
function fmtFull(n){return Math.round(n).toLocaleString('pl-PL')+' zł';}
function round5k(x){return Math.max(5000,Math.round(x/5000)*5000);}
function pValue(p){const r=rating(p);const af=p.age<=22?1.35:p.age<=28?1.1:p.age<=31?0.85:p.age<=33?0.55:0.3;const pf=1+Math.max(0,(p.pot||r)-r)/35;return Math.max(10000,Math.round(Math.pow(Math.max(0,r-50)/40,2.5)*1500000*af*pf/10000)*10000);}
function wageDemand(p){const r=rating(p);return round5k(Math.max(40000,Math.pow(Math.max(0,r-45)/45,2)*700000)*(p.age>=33?0.8:1));}
function snap(p){const o={};for(const k of ALL_KEYS)o[k]=p[k];return o;}
function baseRating(p){return p.base?rating(Object.assign({},p,p.base)):rating(p);}
function potBonus(age,r){const k=r>=85?0.5:r>=80?0.75:1;return k*(age<=21?3+R()*12:age<=24?2+R()*7:age<=27?R()*3:0);}
function initRep(t){return Math.round(clamp((teamStrength(t)-65)*3.5,20,90));}
function teamQ(t){return teamStrength(t)/5;}
function restoreDefs(){TEAMS.forEach((t,i)=>{const d=TEAM_DEFS[i];t.name=d.name;t.short=d.short;t.color=d.color;t.city='';});applyCustom();}
function resetTeams(){restoreDefs();TEAMS.forEach((t,i)=>{t.players=genTeam(TEAM_DEFS[i],i).players;});rebuildIndex();}
function hashN(id){let h=3;for(const c of String(id))h=(h*131+c.charCodeAt(0))>>>0;return h;}
function syncTeams(){for(const p of W().players){ensTraits(p);if(p.czy==null||p.kiw==null||p.kom==null){ensAttrs(p);if(p.base){p.base.czy=p.czy;p.base.kiw=p.kiw;p.base.kom=p.kom;}}
    if(!W().chemInit&&p.tcTm==null&&p.tm>=0&&!p.jr){p.tcTm=p.tm;p.tc=6+hashN(p.id)%35;}}W().chemInit=1;for(const t of TEAMS)t.players=W().players.filter(p=>p.tm===t.idx&&!p.jr);rebuildIndex();}
function initPlayerMeta(p,season,free){const r=rating(p);p.pot=Math.min(95,Math.round(r+potBonus(p.age,r)));p.inj=0;p.xp={};p.base=snap(p);
  if(free){p.wage=0;p.ce=0;}else{p.wage=round5k(wageDemand(p)*(0.85+R()*0.3));p.ce=season+(R()<0.2?0:1+Math.floor(R()*3));}}
function randPos(){const x=R()*14;return x<2?'R':x<4?'A':x<8?'P':x<12?'S':'L';}
function genPlayer(pos,q,age){const id='n'+(W().nextId++);
  const p={id,first:FIRST[Math.floor(R()*FIRST.length)],last:LAST[Math.floor(R()*LAST.length)],pos,num:0,age};
  const hh=HEIGHT[pos];p.h=Math.round(hh[0]+R()*(hh[1]-hh[0]));
  for(const [k] of ATTRS.concat(PHYS))p[k]=Math.round(clamp(q+TEMPL[pos][k]+nz()*2.2,1,20));
  for(const [k] of MENTAL)p[k]=Math.round(clamp(q-1+nz()*4,1,20));
  p.tc=0;setDob(p);ensTraits(p);return p;}
function assignNum(p,tm){const used=new Set(W().players.filter(x=>x.tm===tm&&x!==p).map(x=>x.num));if(p.num&&!used.has(p.num))return;for(let n=1;n<=40;n++)if(!used.has(n)){p.num=n;return;}}
function initWorld(){
  resetTeams();
  SAVE.world={players:[],nextId:1};
  const sn=SAVE.season?SAVE.season.n:1;
  for(const t of TEAMS)for(const p0 of t.players){const p=Object.assign({},p0,{tm:t.idx});initPlayerMeta(p,sn,false);setDob(p);W().players.push(p);}
  SAVE.ai=TEAMS.map(t=>({rep:initRep(t),bud:0}));
  for(const a of SAVE.ai)a.bud=round5k(200000+a.rep*15000+R()*300000);
  for(let i=0;i<20;i++){const age=20+Math.floor(R()*13);const p=genPlayer(randPos(),10+R()*3,age);p.tm=-1;initPlayerMeta(p,1,true);W().players.push(p);}
  const rep=SAVE.ai[SAVE.team].rep;
  SAVE.fin={bal:round5k(1000000+rep*15000),log:[],sea:{},prev:null};
  SAVE.training={focus:'bal',int:1};
  SAVE.news=[];SAVE.inbox=[];
  syncTeams();initClub();
}
function news(t){SAVE.news=SAVE.news||[];SAVE.news.unshift({d:SAVE._now||today(),t});SAVE.news=SAVE.news.slice(0,40);try{if(typeof mailFromNews==='function')mailFromNews(t);}catch(e){}}
function money(amt,cat){const f=SAVE.fin;f.bal+=amt;f.sea[cat]=(f.sea[cat]||0)+amt;}
function finLog(t,a){const f=SAVE.fin;f.log.unshift({d:today(),t,a});f.log=f.log.slice(0,80);}
function payroll(){return myTeam().players.reduce((s,p)=>s+(p.wage||0),0);}
const TV_ROUND=45000;

// ---- trening / rozwój / kontuzje ----
const TRAIN_FOCUS=[['bal','Zrównoważony','Rozwój wszystkich cech, z naciskiem na te ważne dla pozycji.',[]],['atk','Atak','Atak, siła, skoczność.',['ata','sil','sko']],['def','Przyjęcie i obrona','Przyjęcie, obrona, odbicie dołem, zwinność.',['prz','obr','tod','zwi']],['blk','Blok','Blok, skoczność, szybkość.',['blo','sko','szy']],['srv','Zagrywka','Zagrywka i siła.',['zag','sil']],['set','Rozegranie','Rozegranie i odbicie palcami.',['roz','tpa']],['phy','Przygotowanie fizyczne','Siła, szybkość, skoczność, zwinność, kondycja.',['sil','szy','sko','zwi','kon']],['men','Mentalny','Koncentracja, opanowanie, zaangażowanie, waleczność.',['kcj','opa','zaa','wal']]];
const TRAIN_INT=[['Lekki',0.7,0.6,'Wolniejszy rozwój, mniej kontuzji.'],['Normalny',1,1,'Balans rozwoju i ryzyka.'],['Ciężki',1.35,1.8,'Szybszy rozwój, ale prawie 2× więcej kontuzji.']];
const GRP={};for(const [k] of ATTRS)GRP[k]='tech';for(const [k] of PHYS)GRP[k]='phys';for(const [k] of MENTAL)GRP[k]='ment';
function develop(p,focus,intI,played,mods,jr,km){
  const r=rating(p);const gap=(p.pot||r)-r;if(gap<=0)return;
  const af=p.age<=20?1:p.age<=23?0.75:p.age<=26?0.45:p.age<=29?0.2:0.05;
  const tm=(hasT(p,'amb')?1.15:1)*(hasT(p,'pra')?1.2:1)*(hasT(p,'len')?0.78:1)*(hasT(p,'pro')?1.05:1);
  const pts=tm*af*TRAIN_INT[intI][1]*(played?1.25:1)*Math.min(1.5,0.5+gap/20)*0.17*(mods?(jr?mods.jr:mods.all):1)*(km==null?1:km);
  const fk=(TRAIN_FOCUS.find(f=>f[0]===focus)||TRAIN_FOCUS[0])[3];const pw=WEIGHTS[p.pos];
  const w={};let tot=0;for(const k of ALL_KEYS){let x=0.3;if(pw[k])x+=1.5;if(fk.includes(k))x+=3;w[k]=x;tot+=x;}
  p.xp=p.xp||{};
  for(const k of ALL_KEYS){if(p[k]>=20)continue;const v=(p.xp[k]||0)+pts*w[k]/tot*(mods?mods[GRP[k]]:1);if(v>=1){p[k]++;p.xp[k]=Math.round((v-1)*100)/100;}else p.xp[k]=Math.round(v*1000)/1000;}
}
function injuryCheck(m,mult){
  for(const sd of m.sides){const mine=sd.team.idx===SAVE.team;const md=clubMods(sd.team.idx);const im=(mine?TRAIN_INT[SAVE.training.int][2]:1)*md.injChance;
    for(const cp of sd.pl){const x=cp.st;if(x.srv+x.rec+x.att+x.dig+x.blk===0)continue;ROUND_PLAYED.add(cp.id);
      const P=PLAYERS[cp.id];if(!P)continue;const p=P.p;if(p.inj)continue;
      if(R()<0.012*im*(1.3-p.kon/20*0.6)*mult){const d=1+Math.floor(R()*R()*7);const days=Math.max(3,Math.round((d*7-3+R()*6)*md.injDur));p.inj=days;p.injUntil=addDays(today(),days);if(!mine)aiStarInjNews(p,days);if(mine)news(`🚑 ${p.first} ${p.last} doznał kontuzji — przerwa ok. ${days} dni (powrót ok. ${fmtDMY(p.injUntil)}).`);}}}
}
function roundTick(kind,home,att){
  const tr=SAVE.training;
  const MODS={};const mm=ti=>MODS[ti]||(MODS[ti]=clubMods(ti));
  for(const p of W().players){
    if(p.tm<0)continue;const mine=p.tm===SAVE.team;
    if(mine&&!p.jr){if(ROUND_PLAYED.has(p.id))develop(p,'bal',tr.int,true,mm(p.tm),false,0.3);continue;}// reszta rozwoju: codzienne treningi (training.js)
    develop(p,mine?(tr.focus||'bal'):'bal',mine?tr.int:1,ROUND_PLAYED.has(p.id),mm(p.tm),p.jr);}
  if(kind==='liga'||kind==='po')for(const p of myTeam().players){if(ROUND_PLAYED.has(p.id)){p.unh=0;continue;}if(p.inj)continue;p.unh=(p.unh||0)+1;
    if(hasT(p,'kap')&&p.unh===3)news(`😤 ${p.first} ${p.last} jest wściekły, że nie gra. Psuje atmosferę w szatni (niższe morale drużyny).`);
    if(hasT(p,'amb')&&p.unh===4)news(`📢 ${p.first} ${p.last} (ambitny) chce więcej grać. Jeśli nadal będzie siedział na ławce, straci humor.`);}
  ROUND_PLAYED=new Set();
  const s=S();
  if(kind==='liga'){money(TV_ROUND,'Prawa TV');
    let t=null;if(home){t=att!=null?{att,inc:att*tixPrice()}:ticketIncome(1);money(t.inc,'Bilety');}
    finLog(`Kolejka ${s.round}: prawa TV${t?`, bilety (${t.att} widzów)`:''}`,TV_ROUND+(t?t.inc:0));}
  if(kind==='po'&&home){const t=att!=null?{att,inc:att*tixPrice()}:ticketIncome(1.5);money(t.inc,'Bilety');finLog(`Play-off: bilety (${t.att} widzów)`,t.inc);}
}

// ---- transfery ----
function windowOpen(){const p=S().phase;return p==='off'||p==='spar';}
function posCount(t,pos){return t.players.filter(p=>p.pos===pos).length;}
function isStarter(p){if(p.tm<0)return false;const lu=autoLineup(TEAMS[p.tm]);return Object.values(lu).includes(p.id);}
function askingPrice(p){return Math.round(pValue(p)*(isStarter(p)?1.35:1.05)/10000)*10000;}
function canSellAI(p){const t=TEAMS[p.tm];return posCount(t,p.pos)-1>=POS_MIN[p.pos]&&t.players.length-1>=SQUAD_MIN;}
function wageNeeded(p){if(p.tm===SAVE.team)return round5k(wageDemand(p)*negF());const my=SAVE.ai[SAVE.team].rep;const cur=p.tm>=0?SAVE.ai[p.tm].rep:0;return round5k(wageDemand(p)*(p.tm<0?0.9:cur>my+10?1.15:1)*negF());}
function contractEndFor(years){const s=S();return (s.phase==='off'?s.n-1:s.n)+years;}
function movePlayer(p,tm){p.tm=tm;if(tm>=0)assignNum(p,tm);syncTeams();}
function tradeMsg(ok,t){ui.tmsg={ok,t};render();}
function makeOffer(pid,fee,wage,years){
  const P=PLAYERS[pid];if(!P)return;const p=P.p;const me=myTeam();
  if(!windowOpen())return tradeMsg(false,'Okno transferowe jest zamknięte (otwarte przed sezonem i w trakcie sparingów).');
  if(me.players.length>=SQUAD_MAX)return tradeMsg(false,`Kadra jest pełna (maks. ${SQUAD_MAX}). Najpierw kogoś sprzedaj albo zwolnij.`);
  fee=p.tm>=0?Math.max(0,Math.round(fee)):0;
  if(p.tm>=0){const club=TEAMS[p.tm].name;
    if(!canSellAI(p))return tradeMsg(false,`${club} nie sprzeda zawodnika — nie ma go kim zastąpić.`);
    const ask=Math.round(askingPrice(p)*(1.05-cA('neg')/200)/10000)*10000;if(fee<ask)return tradeMsg(false,`${club} odrzuca ofertę. Oczekuje co najmniej ${fmt(ask)}.`);}
  if(SAVE.fin.bal-fee<-500000)return tradeMsg(false,'Za mało pieniędzy. Dopuszczalny debet to 500 tys. zł.');
  const need=wageNeeded(p);if(wage<need)return tradeMsg(false,`${p.first} ${p.last} odrzuca warunki. Chce co najmniej ${fmt(need)} rocznie.`);
  const from=p.tm;
  if(from>=0){money(-fee,'Transfery');SAVE.ai[from].bud+=fee;finLog(`Zakup: ${p.first} ${p.last} (${TEAMS[from].short})`,-fee);}
  movePlayer(p,SAVE.team);p.wage=round5k(wage);p.ce=contractEndFor(years);
  news(`✍️ ${p.first} ${p.last} dołącza do zespołu${from>=0?` z ${TEAMS[from].name} za ${fmt(fee)}`:' jako wolny zawodnik'}.`);
  ui.card=null;save();tradeMsg(true,`${p.first} ${p.last} podpisał kontrakt do ${ceDate(p.ce)}!`);
}
function findBuyers(pid){const p=PLAYERS[pid].p;const r=rating(p);const out=[];
  for(const t of TEAMS){if(t.idx===SAVE.team||t.players.length>=17)continue;
    const best=t.players.filter(x=>x.pos===p.pos).map(x=>rating(x)).sort((a,b)=>b-a);
    const need=best.length<POS_STD[p.pos]||r>(best[1]||0);if(!need)continue;
    const fee=Math.round(pValue(p)*(0.8+R()*0.3)*(0.95+cA('neg')/200)/10000)*10000;if(SAVE.ai[t.idx].bud<fee)continue;out.push({tm:t.idx,fee});}
  return out.sort((a,b)=>b.fee-a.fee).slice(0,3);}
function seekBuyers(pid){if(!windowOpen())return tradeMsg(false,'Okno transferowe jest zamknięte.');ui.offers={pid,list:findBuyers(pid)};render();}
function acceptBuy(pid,tm,fee){const p=PLAYERS[pid].p;
  if(myTeam().players.length-1<SQUAD_MIN)return tradeMsg(false,`Nie możesz zejść poniżej ${SQUAD_MIN} zawodników w kadrze.`);
  money(fee,'Transfery');SAVE.ai[tm].bud-=fee;finLog(`Sprzedaż: ${p.first} ${p.last} (${TEAMS[tm].short})`,fee);
  movePlayer(p,tm);p.wage=wageDemand(p);p.ce=contractEndFor(1+Math.floor(R()*3));
  SAVE.inbox=(SAVE.inbox||[]).filter(o=>o.pid!==pid);
  news(`💰 ${p.first} ${p.last} sprzedany do ${TEAMS[tm].name} za ${fmt(fee)}.`);ui.offers=null;ui.card=null;save();tradeMsg(true,`Sprzedano: ${p.first} ${p.last} za ${fmt(fee)}.`);}
function rejectInbox(i){SAVE.inbox.splice(i,1);save();render();}
function releaseCost(p){return round5k(p.wage*Math.max(1,p.ce-S().n+(S().phase==='off'?1:0))*0.5);}
function releasePlayer(pid){const p=PLAYERS[pid].p;
  if(ui.confirm!=='rel'+pid){ui.confirm='rel'+pid;render();return;}ui.confirm=null;
  if(myTeam().players.length-1<SQUAD_MIN)return tradeMsg(false,`Nie możesz zejść poniżej ${SQUAD_MIN} zawodników w kadrze.`);
  const c=releaseCost(p);money(-c,'Odprawy');finLog(`Rozwiązanie kontraktu: ${p.first} ${p.last}`,-c);
  movePlayer(p,-1);p.wage=0;p.ce=0;news(`📄 Rozwiązano kontrakt z ${p.first} ${p.last} (odprawa ${fmt(c)}).`);ui.card=null;save();tradeMsg(true,`Rozwiązano kontrakt. Odprawa: ${fmt(c)}.`);}
function renew(pid,wage,years){const p=PLAYERS[pid].p;const need=wageNeeded(p);
  if(wage<need)return tradeMsg(false,`${p.last} nie zgadza się. Chce co najmniej ${fmt(need)} rocznie.`);
  p.wage=round5k(wage);p.ce=contractEndFor(years);news(`✍️ ${p.first} ${p.last} przedłużył kontrakt do ${ceDate(p.ce)}.`);save();tradeMsg(true,`${p.last} przedłużył kontrakt do ${ceDate(p.ce)}.`);}

// ---- AI: transfery i kontrakty ----
function aiSign(t,pos){
  const fa=W().players.filter(p=>p.tm<0&&p.pos===pos&&!p.inj).sort((a,b)=>rating(b)-rating(a));
  let p=fa.find(x=>rating(x)<=teamStrength(t)+4)||fa[0];
  if(!p){p=genPlayer(pos,teamQ(t)-2.5+R(),21+Math.floor(R()*10));initPlayerMeta(p,S().n,true);W().players.push(p);}
  p.tm=t.idx;assignNum(p,t.idx);p.wage=wageDemand(p);p.ce=S().n+Math.floor(R()*2);
  t.players=W().players.filter(x=>x.tm===t.idx&&!x.jr);return p;}
function aiOffseason(){
  const n=S().n;
  for(const t of TEAMS){if(t.idx===SAVE.team)continue;
    for(const p of t.players){if(p.ce<n){const keep=R()<(isStarter(p)?0.85:0.55)&&p.age<34;if(keep){p.wage=wageDemand(p);p.ce=n+Math.floor(R()*3);}else{p.tm=-1;p.wage=0;p.ce=0;}}}}
  syncTeams();
  const order=TEAMS.filter(t=>t.idx!==SAVE.team).sort(()=>R()-0.5);
  for(const t of order){
    if(R()<0.4){const pos=['R','A','P','P','S','S','L'][Math.floor(R()*7)];
      const cur=t.players.filter(x=>x.pos===pos).map(x=>rating(x)).sort((a,b)=>b-a);
      const c=W().players.filter(p=>p.tm>=0&&p.tm!==t.idx&&p.tm!==SAVE.team&&p.pos===pos&&!isStarter(p)&&canSellAI(p)&&rating(p)>(cur[1]||0)).sort((a,b)=>rating(b)-rating(a))[0];
      if(c){const fee=askingPrice(c);if(SAVE.ai[t.idx].bud>=fee){const from=c.tm;SAVE.ai[t.idx].bud-=fee;SAVE.ai[from].bud+=fee;movePlayer(c,t.idx);c.wage=wageDemand(c);c.ce=n+1+Math.floor(R()*2);
        news(`🔁 Transfer: ${c.first} ${c.last} przechodzi z ${TEAMS[from].name} do ${t.name} za ${fmt(fee)}.`);}}}
    for(const pos of ['R','A','P','S','L'])while(posCount(t,pos)<POS_STD[pos]&&t.players.length<16)aiSign(t,pos);
    while(t.players.length<SQUAD_MIN+1)aiSign(t,randPos());
    while(t.players.length>16){const ex=t.players.filter(p=>posCount(t,p.pos)>POS_STD[p.pos]).sort((a,b)=>rating(a)-rating(b))[0]||t.players.slice().sort((a,b)=>rating(a)-rating(b))[0];ex.tm=-1;ex.wage=0;ex.ce=0;t.players=W().players.filter(x=>x.tm===t.idx&&!x.jr);}
  }
  syncTeams();
}
function offseason(){
  const old=S(),n=old.n+1;
  advanceTo(`${2026+old.n}-06-01`);
  // starzenie, spadek formy, emerytury
  const keep=[];
  for(const p of W().players){
    if(p.age>=28)for(const [k] of PHYS)if(R()<(p.age-27)*0.14*(hasT(p,'pro')?0.6:1)&&p[k]>1)p[k]--;
    if(p.age>=31)for(const [k] of ATTRS)if(k!=='czy'&&R()<(p.age-30)*0.1*(hasT(p,'pro')?0.6:1)&&p[k]>1)p[k]--;
    const r=rating(p);if(p.pot<r)p.pot=r;
    const retire=p.age>=37||(p.age>=35&&R()<0.5)||(p.tm<0&&p.age>=33&&R()<0.5);
    if(retire){if(p.tm===SAVE.team)news(`👋 ${p.first} ${p.last} (${p.age} l.) kończy karierę.`);continue;}
    keep.push(p);}
  W().players=keep;syncTeams();
  // nowy sezon (okno transferowe)
  newSeason(n,'off');
  aiOffseason();juniorsOffseason();aiInfraOffseason();refreshStaffPool();
  for(const r in SAVE.staff){const st=SAVE.staff[r];if(st){st.age++;if(st.age<50&&R()<0.4&&st.skill<20)st.skill++;}}
  // wolni zawodnicy: porządki i uzupełnienie
  let fa=W().players.filter(p=>p.tm<0).sort((a,b)=>rating(b)-rating(a));
  if(fa.length>30){const drop=new Set(fa.slice(30).map(p=>p.id));W().players=W().players.filter(p=>!drop.has(p.id));}
  while(W().players.filter(p=>p.tm<0).length<20){const p=genPlayer(randPos(),10+R()*3,20+Math.floor(R()*12));p.tm=-1;initPlayerMeta(p,n,true);W().players.push(p);}
  for(const a of SAVE.ai)a.bud=round5k(a.bud*0.5+200000+a.rep*15000+R()*300000);
  for(const p of W().players){p.base=snap(p);}
  // oferty za zawodników użytkownika
  SAVE.inbox=[];
  const mine=myTeam().players.filter(p=>rating(p)>=74&&p.ce>=n).sort(()=>R()-0.5);
  for(const p of mine.slice(0,1+Math.floor(R()*2))){const buyers=findBuyers(p.id);if(buyers.length&&R()<0.7){const b=buyers[0];const o={pid:p.id,tm:b.tm,fee:Math.round(b.fee*(1.05+R()*0.25)/10000)*10000};SAVE.inbox.push(o);sendMail({cat:'trans',from:TEAMS[b.tm].name,t:`Oferta za ${p.first} ${p.last}: ${fmt(o.fee)}`,s:`${TEAMS[b.tm].name} chce kupić zawodnika. Decyzja w oknie transferowym.`,b:{type:'offer',pid:p.id,tm:b.tm,fee:o.fee},act:1,lab:'Oferta kupna'});}}
  SAVE.fin.prev=SAVE.fin.sea;SAVE.fin.sea={};
  syncTeams();save();
}
function expiring(){const n=S().n;return myTeam().players.filter(p=>p.ce<n);}
function startSeasonFromOff(){
  const s=S();const exp=expiring();const left=myTeam().players.length-exp.length;
  if(left<SQUAD_MIN&&ui.confirm!=='start'){ui.tmsg={ok:false,t:`Po odejściu zawodników z wygasającymi kontraktami zostanie Ci ${left} zawodników, a minimum to ${SQUAD_MIN}. Przedłuż kontrakty albo kup zawodników.`};render();return;}
  if(exp.length&&ui.confirm!=='start'){ui.confirm='start';render();return;}
  ui.confirm=null;
  for(const p of exp){p.tm=-1;p.wage=0;p.ce=0;news(`👋 ${p.first} ${p.last} odchodzi — wygasł kontrakt.`);}
  for(const p of agedOut()){p.tm=-1;p.jr=false;news(`👋 ${p.first} ${p.last} (${p.age} l.) kończy wiek juniora i odchodzi z akademii.`);}
  syncTeams();
  if(myTeam().players.length<SQUAD_MIN){while(myTeam().players.length<SQUAD_MIN){const t=myTeam();const pos=['R','A','P','S','L'].find(x=>posCount(t,x)<POS_MIN[x])||randPos();aiSign(t,pos);syncTeams();}news('Klub dobrał zawodników z wolnego rynku, żeby uzupełnić kadrę do minimum.');}
  s.phase='spar';ui.tmsg=null;syncDate();save();render();
}

function healthyLineup(team,lu){
  const ok=validLineup(team,lu)?Object.assign({},lu):autoLineup(team);
  const used=new Set(Object.values(ok));const ch=[];
  for(const [k,l,pos] of LINEUP_KEYS){const p=team.players.find(x=>x.id===ok[k]);if(p&&!p.inj)continue;
    const c=team.players.filter(x=>!x.inj&&!used.has(x.id)).sort((a,b)=>lineupScore(b,pos)-lineupScore(a,pos))[0];
    if(c){used.add(c.id);ch.push([p,c,l]);ok[k]=c.id;}}
  return {lu:ok,ch};}

const MON_GEN=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MON_NOM=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const DOW=['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const DOW_S=['nd.','pn.','wt.','śr.','czw.','pt.','sob.'];
const GAME_START='2026-08-01';
function dP(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);}
function dS(t){const x=new Date(t);return x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0')+'-'+String(x.getUTCDate()).padStart(2,'0');}
function addDays(s,n){return dS(dP(s)+n*86400000);}
function daysBetween(a,b){return Math.round((dP(b)-dP(a))/86400000);}
function dow(s){return new Date(dP(s)).getUTCDay();}
function nextDow(s,w){let d=s;while(dow(d)!==w)d=addDays(d,1);return d;}
function fmtLong(s){const [y,m,d]=s.split('-').map(Number);return `${DOW[dow(s)]}, ${d} ${MON_GEN[m-1]} ${y}`;}
function fmtMid(s){const [y,m,d]=s.split('-').map(Number);return `${DOW_S[dow(s)]} ${d} ${MON_GEN[m-1]}`;}
function fmtShort(s){const [y,m,d]=s.split('-');return `${DOW_S[dow(s)]} ${d}.${m}`;}
function fmtDMY(s){const [y,m,d]=s.split('-');return `${d}.${m}.${y}`;}
function seasonYear(n){return 2025+n;}
function sLabel(n){const y=seasonYear(n);return y+'/'+String(y+1).slice(2);}
function ceDate(ce){return '30.06.'+(2026+ce);}
function today(){return SAVE.date||GAME_START;}
// ---- daty sezonu ----
const SLOTS=[[-1,'20:30'],[0,'14:45'],[0,'17:30'],[0,'20:30'],[1,'14:45'],[1,'17:30']];
function ensureDates(s){
  const Y=seasonYear(s.n);
  if(!s.sdates){let d=nextDow(`${Y}-08-15`,6);s.sdates=[];for(let k=0;k<N_SPAR;k++){s.sdates.push(d);d=addDays(d,k%2?3:4);}}
  if(!s.rdates){let d=nextDow(`${Y}-09-26`,6);s.rdates=[];while(s.rdates.length<s.rounds.length){const md=d.slice(5);const brk=(d.slice(0,4)==String(Y)&&md>='12-20')||(d.slice(0,4)==String(Y+1)&&md<='01-06');if(!brk)s.rdates.push(d);d=addDays(d,7);}}
  if(!s.podates){const st=addDays(s.rdates[s.rdates.length-1],14);s.podates=[0,4,7,11,14,18,21,25,28,32,35,39,42,46,49].map(o=>addDays(st,o));}
  if(!s.offDate)s.offDate=`${Y}-06-01`;
  if(s.po&&s.po.day==null){let day=0;for(const st of ['QF','SF','F']){const g=s.po.series.filter(x=>x.st===st).map(x=>x.games.length);if(g.length)day+=Math.max(...g);}s.po.day=day;}
}
function fixtureWhen(s,r,f){const i=s.rounds[r].findIndex(x=>x[0]===f[0]&&x[1]===f[1]);const sl=SLOTS[Math.max(0,i)%SLOTS.length];return {d:addDays(s.rdates[r],sl[0]),t:sl[1]};}
function poTime(d){return dow(d)===6?'17:30':'20:30';}
function nextEvent(){const s=S();if(!s)return null;ensureDates(s);
  if(s.phase==='off')return {d:s.offDate};
  if(s.phase==='spar'){const k=s.spar.res.length;return k<N_SPAR?{d:s.sdates[k],t:'18:00'}:null;}
  if(s.phase==='liga'){const f=s.rounds[s.round].find(f=>f[0]===SAVE.team||f[1]===SAVE.team);return fixtureWhen(s,s.round,f);}
  if(s.phase==='po'){const d=s.podates[Math.min(s.po.day,s.podates.length-1)];return {d,t:poTime(d)};}
  if(s.phase==='end')return {d:s.endDate||addDays(s.podates[Math.max(0,(s.po?s.po.day:1)-1)],3)};
  return null;}
function syncDate(){const e=nextEvent();if(e&&e.d>today())advanceTo(e.d);}

function ageAt(dob,d){let a=+d.slice(0,4)-+dob.slice(0,4);if(d.slice(5)<dob.slice(5))a--;return a;}
function setDob(p,ref){ref=ref||today();const mm=1+Math.floor(R()*12),dd=1+Math.floor(R()*28);let y=+ref.slice(0,4)-p.age;let dob=`${y}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;if(ageAt(dob,ref)!==p.age){y--;dob=`${y}`+dob.slice(4);}p.dob=dob;}
function updateAges(){if(!SAVE.world)return;const d=today();for(const p of W().players){if(!p.dob)setDob(p,d);p.age=ageAt(p.dob,d);}}
function updateInjuries(){if(!SAVE.world)return;const d=today();
  for(const p of W().players){if(!p.injUntil){if(p.inj>0){p.injUntil=addDays(d,p.inj*7);p.inj=daysBetween(d,p.injUntil);}continue;}
    const rem=daysBetween(d,p.injUntil);if(rem<=0){p.inj=0;delete p.injUntil;if(p.tm===SAVE.team)news(`✅ ${p.first} ${p.last} wrócił do zdrowia.`);}else p.inj=rem;}}
function monthly(d){if(!SAVE.fin||SAVE.team==null)return;const m=+d.slice(5,7);const pay=payroll()/12,sp=sponsorAmt()/12;
  const stp=staffPay()/12,mnt=maintenance(),shp=shopIncome(myInfra().sklep);

      for(let i=0;i<Math.floor(w/0.9);i++){const xx=x+0.3+i*0.9;if(xx+0.45>x+w-0.1)break;const a=P(xx,y+d,z+0.45),bq=P(xx+0.45,y+d,z+0.45),c=P(xx+0.45,y+d,z),dq=P(xx,y+d,z);s+=`<polygon points="${pts([a,bq,c,dq])}" fill="#fde68a" opacity=".45"/>`;}}return s;};

  g+=`<polygon points="${pts([P(7.2,-1.5,0),P(7.9,-1.5,0),P(7.9,13.5,0),P(7.2,13.5,0)])}" fill="#4b5563"/>`;
  g+=`<polygon points="${pts([P(14.2,-1.5,0),P(14.9,-1.5,0),P(14.9,6.1,0),P(14.2,6.1,0)])}" fill="#4b5563"/>`;
  const order=Object.keys(plots).sort((a,b)=>(plots[a][0]+plots[a][1])-(plots[b][0]+plots[b][1]));
  for(const k of order){const f=INFRA.find(x=>x.k===k);const [x,y,w,d]=plots[k];const L=inf[k];const building=b&&b.k===k;

    let h;

  for(const p of oc){const mor=p.mor==null?60:p.mor;let d=0;
    if(k==='enc')d=2+(mot-10)*0.5+(behind>=3?3:0)+(mor<50?2:0);
    else if(k==='dem')d=((p.zaa+(hasT(p,'amb')?16:p.wal))/2-10)*0.8+(mot-10)*0.3-(p.opa<9?2:0)-(mor<45?2:0);
    else if(k==='calm')d=1+(60-mor)*0.12+(12-p.opa)*0.45;
    else if(k==='wake')d=((p.wal+p.zaa)/2-10.5)*1.1+(aut-10)*0.5-(p.opa<9?3:0);
    d=Math.round(d*amp+(R()-0.5)*2);addMor(p,d);del[p.id]=d;}

  const avg=Object.values(del).reduce((a,b)=>a+b,0)/Math.max(1,oc.length);const f=clamp(shoutPow()*1.25*(0.75+avg/12),0.3,1.8);
  const F=SH_FX[T[4]]||{};const fx={};for(const x in F)fx[x]=F[x]*(x==='e'?Math.min(1.3,f):f);s.sh=Object.assign({k:T[4],u:m.rallies+7,n:T[2].replace(/[„”]/g,''),ic:'⏱'},fx);
  if(k==='enc'&&Math.abs(behind)<=3)s.mom=Math.min(3,Math.max(0,s.mom)+1);

  st.tone=k;ui.talkRes={k,del};if(ui.to)ui.to.said=T[1];if(st.hint)ui.talk=false;persistLive();render();}
function applyHint(k,id){const m=ui.match;if(!m)return;const st=talkState();if(st.hint)return;const s=m.sides[0];const dur=5+Math.floor(cA('tak')/4);let txt='';

function applyTalk(k){if(TALK_TONE.some(x=>x[0]===k))return applyTone(k);if(k==='target'){const w=weakestReceiver(ui.match);return applyHint('target',w&&w.id);}return applyHint(k);}

function fmTeamStats(m,i){const t=teamTotals(m.sides[i]);const kc=kitColors(m)[i];

  const rows=[['Punkty',t.pts],['Atak',pc(t.kill,t.att)],['Przyjęcie+',pc(t.recPos,t.rec)],['Asy',t.ace],['Bloki',t.blk],['Błędy',t.attErr+t.srvErr],['Zgranie',chemPct(sd.chem??0.6)+'%'],['Nieporoz.',mixN]];
  return `<div class="fmst"><div class="fmh"><b style="border-bottom:2px solid ${kc}">${esc(m.sides[i].team.short)}</b></div>${rows.map(r=>`<div class="fmsr"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`;}
// ---- pasek składu ----
function fmStrip(m){const a=m.sides[0];const oc=onCourt(a,m.serving===0);const ord={R:0,A:1,P:2,S:3,L:4};
  const on=oc.slice().sort((x,y)=>ord[x.role]-ord[y.role]||x.zone-y.zone);
  const mine=e=>{const p=e.p,r=liveRating(p),mor=p.mor==null?60:p.mor;const click=!m.over?`onclick="selSub(${e.slot==='L'?"'L'":e.slot})"`:'';
    return `<div class="fmsp ${click?'clk':''} ${ui.subSel===e.slot?'sel':''}" ${click} title="${esc(p.first+' '+p.last)} · energia ${Math.round(p.en)}% · morale ${mor}">
      <span class="fmps2">${POS_SHORT[e.role]}</span>${fmJersey(m,0,e,28)}<b class="fmnm">${esc(p.last)}</b><span class="fmps2">ogólna <b style="color:var(--acc)">${rating(p)}</b></span>
      <span class="fmrow"><span class="fmrt ${rCls(r)}">${fmtR(r)}</span><span>${mor>=62?'😀':mor>=45?'😐':'😟'}</span>${formChip(p)}</span>
      <span class="fmen"><i style="width:${Math.round(p.en)}%;background:${energyCol(p.en)}"></i></span></div>`;};
  return `<div class="card fmstrip"><div class="fmsi"><b>Skład</b><div class="small mut">Zmian zostało <b style="color:var(--txt)">${a.subs}</b></div><div class="small mut">Czasów zostało <b style="color:var(--txt)">${a.to}</b></div><div class="small mut">Kliknij, by zmienić</div></div>${on.map(mine).join('')}</div>`;}
// ---- pasek górny ----
function fmTop(m){const [a,b]=m.sides;const kc=kitColors(m);const sp=[[1600,'0,5x'],[800,'1x'],[250,'2x'],[50,'4x']];
  const curSp=sp.findIndex(x=>x[0]===ui.speed);const nxt=sp[(Math.max(0,curSp)+1)%sp.length][0];
  const chip=(i)=>`<span class="fmchip" style="background:${kc[i]};color:${lum(kc[i])>0.6?'#111':'#fff'}">${esc(m.sides[i].team.short)}</span>`;
  return `<div class="card fmtop">
   <div class="fmtl">${m.over?'':`<button class="ghost sm ${ui.fmPanel==='tac'?'on':''}" onclick="ui.fmPanel=ui.fmPanel==='tac'?null:'tac';render()">📋 Taktyka</button>
     <button class="ghost sm tobtn ${ui.toReq?'on':''}" ${a.to<=0||ui.to?'disabled':''} onclick="myTimeout()">${ui.toReq?'⏱ Czas po akcji…':`⏱ Czas (${a.to})`}</button>
     <button class="ghost sm ${ui.fmPanel==='stats'?'on':''}" onclick="ui.fmPanel=ui.fmPanel==='stats'?null:'stats';render()">📊 Statystyki</button>
     <button class="ghost sm ${ui.fmPanel==='asst'?'on':''}" onclick="ui.fmPanel=ui.fmPanel==='asst'?null:'asst';render()">💬 Asystent</button>`}</div>
   <div class="fmsc"><span class="fmset">${m.over?'KONIEC':'SET '+m.setNo}</span>${chip(0)}<b class="fmsw">${m.setsWon[0]}</b>
     <b class="fmpt ${m.serving===0&&!m.over?'srv':''}">${m.over?'–':m.score[0]}</b><span class="fmcol">:</span><b class="fmpt ${m.serving===1&&!m.over?'srv':''}">${m.over?'–':m.score[1]}</b>
     <b class="fmsw">${m.setsWon[1]}</b>${chip(1)}
     <span class="fmsets small mut">${m.sets.map(s=>`${s[0]}:${s[1]}`).join(' · ')}</span></div>
   <div class="fmtr2">${m.over?'':`<button class="ghost sm" onclick="setSpeed(${nxt})" title="Prędkość">⏩ ${curSp>=0?sp[curSp][1]:'1x'}</button>
     <button class="ghost sm ${ui.fmPanel==='more'?'on':''}" onclick="ui.fmPanel=ui.fmPanel==='more'?null:'more';render()" aria-label="Więcej">⋯</button>`}</div></div>`;}
function fmPanel(m){const a=m.sides[0];
  if(ui.fmPanel==='tac')return `<div class="card fmpanel"><div class="row wrap" style="gap:12px">
    <label class="small">Zagrywka <select onchange="setServe(+this.value)">${SERVE_OPT.map((o,i)=>`<option value="${i}" ${a.tactics.serve===i?'selected':''}>${o[0]}</option>`).join('')}</select></label>
    <label class="small">Rozegranie <select onchange="setDist(+this.value)">${DIST_OPT.map((o,i)=>`<option value="${i}" ${a.tactics.dist===i?'selected':''}>${o[0]}</option>`).join('')}</select></label>
    <span class="small mut">${esc(SERVE_OPT[a.tactics.serve][1])} ${esc(DIST_OPT[a.tactics.dist][1])}</span></div>
    <div class="tacgrid wide">${atkTacHtml(a.tactics)}</div>
    <div class="tacgrid">${tgtTacHtml(m)}${freeTacHtml(a.tactics)}</div><div class="tacgrid wide">${blockTacHtml(a.tactics)}</div>${rotCard(m)}</div>`;
  if(ui.fmPanel==='more')return `<div class="card fmpanel"><div class="row wrap" style="gap:6px">
    <button class="ghost sm" onclick="ui.fmPanel=null;simToSetEnd()">⏭ Do końca seta</button><button class="ghost sm" onclick="ui.fmPanel=null;simToEnd()">⏭⏭ Do końca meczu</button>
    <button class="ghost sm" onclick="ui.mview=ui.mview==='klasyczny'?'hala':'klasyczny';ui.fmPanel=null;render()">${ui.mview==='klasyczny'?'🏟️ Widok hali':'▦ Widok klasyczny'}</button>
    <button class="ghost sm ${ui.anim!==false?'on':''}" onclick="ui.anim=ui.anim===false;render()">🏐 Animacja: ${ui.anim!==false?'wł.':'wył.'}</button>
    <span class="small mut">Libero: <b style="color:var(--txt)">${esc(a.libero.last)}</b> <button class="link" onclick="selSub('L')">zmień</button></span></div></div>`;
  if(ui.fmPanel==='asst')return asstPanel(m);
  if(ui.fmPanel==='stats')return `<div class="card fmpanel">${statsBlock(m)}</div>`;
  if(ui.fmPanel==='ana')return `<div class="card fmpanel"><h3 style="margin-top:0">Analityk: kierunki ataków zawodników</h3><div class="shares"><div><div class="mut small">${esc(m.sides[1].team.name)} (rywal)</div>${anaTable(m,1)}</div><div><div class="mut small">${esc(m.sides[0].team.name)}</div>${anaTable(m,0)}</div></div></div>`;
  return '';}
function fmLiveView(subPanel){const m=ui.match;
  return `${fmTop(m)}${fmPanel(m)}
  ${ui.talk&&!m.over?talkCard(m):''}
  ${m.over?`<div class="card row"><b>Mecz zakończony: ${esc(m.sides[m.winner].team.name)} wygrywa ${Math.max(...m.setsWon)}:${Math.min(...m.setsWon)}</b><span class="sp"></span><button class="btn" onclick="ui.view='post';render()">Podsumowanie</button><button class="ghost" onclick="ui.match=null;render()">Dalej</button></div>`:''}
  <div class="fmwrap"><div class="fmlay">
   <div class="fml">${fmFormation(m,0)}${fmLiveTable(m)}${fmPlayerStats(m,0)}</div>
   <div class="fmc">
    <div class="card fmcourt">${fmTeamStats(m,0)}<div class="fmcv">
      ${ui.mview==='klasyczny'?courtHtml(m):`<div class="hallbar small mut">🏟️ ${tName(m.homeIdx!=null?m.homeIdx:m.sides[0].team.idx)} · <b style="color:var(--txt)">${(m.att||0).toLocaleString('pl-PL')}</b> / ${(m.cap||0).toLocaleString('pl-PL')} widzów · <span class="mcom ${m.comm&&m.comm.w!=null?(m.comm.w===0?'me':'op'):''}">${m.comm?esc(m.comm.t):''}</span><span id="mph" class="mph">${ui.to?'Czas':m.over?'Koniec meczu':'Przed zagrywką'}</span></div>${toBanner(m)}<canvas id="mcv" class="mcv"></canvas>`}
      ${m.over?'':`<div class="fmctl">${ui.to?`<button class="btn fmbig go" onclick="endTimeout()">↩ Wracamy na boisko</button>`:`<button class="btn ppbtn fmbig ${m.paused?'go':''}" onclick="togglePause()">${m.paused?'▶ Graj':'⏸ Pauza'}</button>`}<button class="ghost sm tobtn ${ui.toReq?'on':''}" ${m.sides[0].to<=0||ui.to?'disabled':''} onclick="myTimeout()">${ui.toReq?'⏱ Czas po akcji…':`⏱ Czas (${m.sides[0].to})`}</button><span class="small mut">Spacja = pauza</span></div>${shoutBar(m)}`}</div>${fmTeamStats(m,1)}</div>
    <div class="fmws">${fmAssistant(m)}${fmMomentum(m)}${fmAnalyst(m)}</div>
   </div>
   <div class="fmr">${fmFormation(m,1)}${fmRecent(m)}${fmPlayerStats(m,1)}</div>
  </div>
  ${fmStrip(m)}
  ${m.over?'':fmBench(m)}
  ${subPanel?`<div class="fmsub">${subPanel}</div>`:''}</div>`;}

// ---- statystyki zawodników pod formacją ----
function fmPlayerStats(m,i){const sd=m.sides[i];const onIds=new Set(onCourt(sd,m.serving===i).map(e=>e.p.id));
  const ps=sd.pl.filter(p=>onIds.has(p.id)||p.st.srv+p.st.rec+p.st.att+p.st.dig+p.st.blk>0)
    .sort((a,b)=>(onIds.has(b.id)-onIds.has(a.id))||((b.st.kill+b.st.blk+b.st.ace)-(a.st.kill+a.st.blk+a.st.ace)));
  return `<div class="card fmside2 fmps-card"><div class="fmh"><b>Statystyki zawodników</b><span class="small mut">${esc(sd.team.short)}</span></div>
   <table class="fmpt-t"><thead><tr><th class="l">Zawodnik</th><th title="Punkty: atak + blok + as">Pkt</th><th title="Skończone ataki / wszystkie">Atak</th><th title="Przyjęcie pozytywne">Prz+</th><th title="Bloki">Blok</th><th title="Asy">As</th><th title="Błędy: atak, zagrywka, przyjęcie">Bł.</th></tr></thead><tbody>
   ${ps.map(p=>{const x=p.st;const err=x.attErr+x.srvErr+x.recErr;return `<tr class="${onIds.has(p.id)?'':'off'}"><td class="l"><span class="mut">${p.num}</span> ${esc(p.last)}</td><td><b>${x.kill+x.blk+x.ace}</b></td><td>${x.att?`${x.kill}/${x.att}`:'–'}</td><td>${x.rec?pc(x.recPos,x.rec):'–'}</td><td>${x.blk||'–'}</td><td>${x.ace||'–'}</td><td class="${err?'bad':''}">${err||'–'}</td></tr>`;}).join('')}
   </tbody></table></div>`;}
// ---- ławka rezerwowych z umiejętnościami ----
const FM_KEY={R:['roz','zag','kiw'],P:['prz','ata','kiw'],A:['ata','blo','kiw'],S:['blo','czy','ata'],L:['prz','obr','czy']};
const attrShort=k=>(ALL_ATTRS.find(a=>a[0]===k)||[k,k,k])[2];
const attrCol=v=>v>=16?'#22c55e':v>=12?'#a3e635':v>=8?'#eab308':'#ef4444';
function fmBench(m){const a=m.sides[0];const bench=benchOf(a);if(!bench.length)return '';
  const sel=ui.subSel;const need=sel==null?null:sel==='L'?'L':a.slots[sel].role;
  const ord={R:0,A:1,P:2,S:3,L:4};
  const list=bench.slice().sort((x,y)=>(need?(x.pos===need?0:1)-(y.pos===need?0:1):0)||ord[x.pos]-ord[y.pos]||rating(y)-rating(x));
  return `<div class="card fmbench ${sel!=null?'subbing':''}"><div class="fmsi"><b>Ławka</b><div class="small mut">${sel!=null?`Wybierz, kto wchodzi za: <b style="color:var(--acc)">${esc((sel==='L'?a.libero:a.slots[sel].p).last)}</b>`:'Kliknij zawodnika, by zobaczyć kartę'}</div>${sel!=null?`<button class="ghost sm" onclick="ui.subSel=null;render()">Anuluj</button>`:''}</div>
   ${list.map(p=>{const fit=need&&p.pos===need;const inj=p.inj>0;
     return `<div class="fmbp clk ${fit?'fit':''} ${inj?'inj':''}" onclick="${sel!=null&&!inj?`doSub('${p.id}')`:`openPop('${p.id}')`}" title="${esc(p.first+' '+p.last)} · ${POS_NAMES[p.pos]} · ${p.age} lat">
      <div class="fmbh"><span class="fmj" style="width:26px;height:26px;font-size:12px;background:${p.pos==='L'?libColor(kitColors(m)[0],'#000'):kitColors(m)[0]};color:${lum(p.pos==='L'?libColor(kitColors(m)[0],'#000'):kitColors(m)[0])>0.6?'#111':'#fff'}">${p.num}</span>
       <div class="fmbn"><b class="fmnm">${esc(p.last)}</b><span class="fmps2">${POS_SHORT[p.pos]} · ${p.age} l.</span></div><span class="fmov" title="Ocena ogólna">${rating(p)}</span></div>
      <div class="fmattrs">${FM_KEY[p.pos].map(k=>`<span title="${esc((ALL_ATTRS.find(x=>x[0]===k)||[])[1]||k)}"><small>${attrShort(k)}</small><b style="color:${attrCol(p[k])}">${p[k]}</b></span>`).join('')}</div>
      ${inj?'<div class="small bad">kontuzja</div>':`<span class="fmen" style="width:100%"><i style="width:${Math.round(p.en)}%;background:${energyCol(p.en)}"></i></span>`}</div>`;}).join('')}</div>`;}
// ================= TAKTYKA: BLOK, OBRONA, PIŁKI SYTUACYJNE, CEL ZAGRYWKI =================
const BLK_OPT=[['Skos','Blok zamyka skos.'],['Zrównoważony','Blokujący czytają atak.'],['Prosta','Blok zamyka prostą.']];
const MID_OPT=[['Prosto','Blok zamyka środek boiska.'],['Zrównoważony','Blokujący czyta atak.'],['Skos na 5','Blok zamyka skos na strefę 5 (lewą).'],['Skos na 1','Blok zamyka skos na strefę 1 (prawą).']];
const MID_ORDER=[1,0,2,3];
const B3_OPT=[['Podwójny','Dwóch blokuje, trzeci asekuruje za blokiem.'],['Potrójny przy wysokiej piłce','Gdy rywal źle wystawi: trzech w bloku.'],['Zawsze potrójny na skrzydłach','Najmocniejszy blok na skrzydłach, ale odsłania środek i nikt nie asekuruje kiwek.']];
function midDefTxt(v){return v===0?'Obrońcy wychodzą z linii bloku: strefy 5 i 1 bronią skosów, szóstka cofa się poza cień bloku.':v===2?'Blok zamyka stronę stref 5 i 6: obrońca strefy 5 wychodzi na krótki skos, szóstka i strefa 1 kryją drugą stronę boiska.':v===3?'Blok zamyka skos na strefę 1: obrona kryje przeciwny skos (strefa 5) i środek.':'Obrona standardowa, środkowy czyta kierunek ataku.';}
const FREE_OPT=[['Na środek boiska','Między zawodników: możliwe nieporozumienie rywala.'],['Na rozgrywającego','Rozgrywający musi przyjąć, wystawia ktoś inny.'],['Na środkowego','Środkowy przyjmuje, więc nie zaatakuje szybkiej piłki.']];
function defTxt(side,v,t){t=t||{};const rot=t.dsys===1;const tip=!!t[side==='L'?'tipL':'tipR'];
  const lz=side==='L'?'Libero / środkowy (strefa 5)':'Rozgrywający / atakujący (strefa 1)';const off=side==='L'?'strefy 2':'strefy 4';
  if(v===0)return `Blok zamyka skos. Szóstka przechodzi na głęboką prostą, ${lz.toLowerCase()} zostaje w głębi prostej, a gracz ze ${off} schodzi pod blok na kiwkę.`;
  if(v===2)return rot?`Obrona rotacyjna: ${lz.toLowerCase()} wychodzi pod blok, szóstka cofa się w róg prostej za jego plecy, obrońca skosu przesuwa się na środek.`
    :tip?`Blok zamyka prostą. Kiwkę pod blokiem łapie gracz ze ${off}, ${lz.toLowerCase()} zostaje w głębi prostej, szóstka broni głębokiego skosu.`
    :`Blok zamyka prostą. ${lz} wychodzi pod blok (kiwki, piłki po bloku), szóstka broni głębokiego skosu, gracz ze ${off} krótkiego skosu.`;
  return `Blok staje w kierunku ataku. ${lz} broni w głębi prostej, gracz ze ${off} schodzi pod blok, szóstka czyta grę: głęboki skos albo prosta.`;}
function tipBtn(k,t,lab){const on=!!t[k];return `<button class="tipt ${on?'on':''}" onclick="tacSet('${k}',${on?0:1})" title="Jeden zawodnik stale asekuruje kiwkę pod blokiem. Mniej punktów z kiwek rywala, ale trochę mniej obrońców w głębi.">${on?'✓ ':''}+ kiwka${lab?' '+lab:''}</button>`;}
function setPreset(k){const t=myTac();const P={pl:{dsys:0,blkL:1,blkR:1,blkM:2,blk3:1,tipL:0,tipR:0,tipM:0}}[k];if(!P)return;Object.assign(t,P);save();if(ui.match&&!ui.match.over)Object.assign(ui.match.sides[0].tactics,P);render();}
function tacSet(k,v){const t=myTac();t[k]=v;save();if(ui.match&&!ui.match.over)ui.match.sides[0].tactics[k]=v;render();}
function setBlk(side,v){if(side==='B'){tacSet('blkL',v);tacSet('blkR',v);}else tacSet(side==='L'?'blkL':'blkR',v);}
function setTgt(id){if(!ui.match)return;ui.match.sides[0].tactics.tgt=id||null;persistLive();render();}
function segBtns(cur,fn){return `<div class="seg">${BLK_OPT.map((o,i)=>`<button class="${(cur??1)===i?'on':''}" onclick="${fn}(${i})" title="${esc(o[1])}">${o[0]}</button>`).join('')}</div>`;}
function blockTacHtml(t){const rot=t.dsys===1;return `
  <div class="tacrow"><div class="tacl"><b>System obrony</b><small class="mut">pozycja wyjściowa i ruch obrońców</small></div><div class="seg"><button class="${rot?'':'on'}" onclick="tacSet('dsys',0)">„Diament”</button><button class="${rot?'on':''}" onclick="tacSet('dsys',1)">Rotacyjna</button></div>
   <div class="small mut tacd">${rot?'Przy bloku na prostą obrońca prostej wychodzi pod blok, a szóstka chowa się za jego plecy w rogu boiska. Mocniej przeciw piłkom po bloku, słabiej przeciw głębokiemu skosowi.':'Obrońcy startują z „diamentu” (strefy 1 i 5 ok. 4,5 m od siatki, szóstka ok. 7 m) i przechodzą na pozycje zależne od ustawienia bloku. Nikt nie stoi w cieniu bloku.'}</div></div>
  <div class="tacrow"><div class="tacl"><b>Blok — lewa strona siatki</b><small class="mut">przeciw atakującemu rywala (jego prawe skrzydło)</small></div><div class="row wrap" style="gap:6px">${segBtns(t.blkL,"setBlk.bind(null,'L')")}${tipBtn('tipL',t)}</div><div class="small mut tacd">${defTxt('L',t.blkL??1,t)}</div></div>
  <div class="tacrow"><div class="tacl"><b>Blok — prawa strona siatki</b><small class="mut">przeciw przyjmującemu rywala (jego lewe skrzydło)</small></div><div class="row wrap" style="gap:6px">${segBtns(t.blkR,"setBlk.bind(null,'R')")}${tipBtn('tipR',t)}</div><div class="small mut tacd">${defTxt('R',t.blkR??1,t)}</div></div>
  <div class="tacrow"><div class="tacl"><b>Blok — środek siatki</b><small class="mut">przeciw szybkiej piłce i atakowi z drugiej linii</small></div><div class="row wrap" style="gap:6px"><div class="seg">${MID_ORDER.map(i=>`<button class="${(t.blkM??1)===i?'on':''}" onclick="tacSet('blkM',${i})" title="${esc(MID_OPT[i][1])}">${MID_OPT[i][0]}</button>`).join('')}</div>${tipBtn('tipM',t)}</div><div class="small mut tacd">${midDefTxt(t.blkM??1)}${t.tipM?' Gracze pierwszej linii, którzy nie blokują, stoją bliżej siatki i łapią kiwki.':''}</div></div>
  <div class="tacrow"><div class="tacl"><b>Liczba blokujących</b><small class="mut">blok podwójny czy potrójny</small></div><select onchange="tacSet('blk3',+this.value)">${B3_OPT.map((o,i)=>`<option value="${i}" ${(t.blk3||0)===i?'selected':''}>${o[0]}</option>`).join('')}</select><div class="small mut tacd">${esc(B3_OPT[t.blk3||0][1])}${(t.blk3||0)>0?' Przy potrójnym bloku z „+ kiwka” kiwkę łapie obrońca prostej, który wychodzi pod blok.':''}</div></div>
  <div class="row wrap small" style="gap:8px;align-items:center"><button class="ghost sm" onclick="setPreset('pl')">★ Ustaw jak najczęściej w PlusLidze</button><span class="mut">„Diament”, blok w kierunek ataku na skrzydłach, środek zamyka stronę stref 5/6, potrójny przy wysokiej piłce.</span></div>
  <div class="small mut">Obie strony naraz: ${BLK_OPT.map((o,i)=>`<button class="link" onclick="setBlk('B',${i})">${o[0].toLowerCase()}</button>`).join(' · ')}.</div>`;}
function freeTacHtml(t){return `<div class="tacrow"><div class="tacl"><b>Piłki sytuacyjne</b><small class="mut">gdy nie da się zaatakować: przebicie</small></div>
  <select onchange="tacSet('free',+this.value)">${FREE_OPT.map((o,i)=>`<option value="${i}" ${(t.free||0)===i?'selected':''}>${o[0]}</option>`).join('')}</select><div class="small mut tacd">${esc(FREE_OPT[t.free||0][1])} Przy złej wystawie zawodnicy z dobrą kiwką częściej kiwają zamiast przebijać.</div></div>`;}

const PS_KEYS=['pts','kill','blk','ace','dig','recPos','recErr','attErr','m'];
function psSnap(){const o={};for(const [id,r] of Object.entries(S().ps||{})){o[id]={};for(const k of PS_KEYS)o[id][k]=r[k]||0;}return o;}
function roundSummary(before,rd,n){const s=S();const ps=s.ps||{};const perf=[];
  for(const [id,r] of Object.entries(ps)){const b=before[id]||{};const dm=(r.m||0)-(b.m||0);if(dm<=0||!PLAYERS[id])continue;const d=k=>(r[k]||0)-(b[k]||0);
    const sc=d('pts')+d('dig')*0.25+d('recPos')*0.15-d('attErr')*0.5;perf.push({id,sc:Math.round(sc*10)/10,pts:d('pts'),blk:d('blk'),ace:d('ace')});}
  perf.sort((a,b)=>b.sc-a.sc);const used=new Set();const team=[];
  for(const [pos,c] of [['R',1],['A',1],['P',2],['S',2],['L',1]]){const xs=perf.filter(x=>!used.has(x.id)&&PLAYERS[x.id].p.pos===pos).slice(0,c);xs.forEach(x=>{used.add(x.id);team.push(x);});}
  s.lastRound={n,res:rd.map(g=>({h:g.h,a:g.a,sw:g.sw,sets:g.sets})),mvp:perf[0]||null,team};}
function streakOf(ti){let n=0,w=null;const res=S().results;for(let i=res.length-1;i>=0;i--){const g=res[i].find(x=>x.h===ti||x.a===ti);if(!g)continue;const won=(g.h===ti)===(g.sw[0]===3);if(w==null)w=won;if(won!==w)break;n++;}return {n,w};}

}catch(e){}}

const FORM_LV=[[80,'znakomita','#22c55e','▲▲'],[68,'dobra','#84cc16','▲'],[52,'przeciętna','#eab308','►'],[40,'słaba','#f97316','▼'],[0,'bardzo słaba','#ef4444','▼▼']];

function formAfterMatch(m){if(typeof PLAYERS==='undefined')return;
  m.sides.forEach((sd,i)=>{const won=m.winner===i;
    for(const cp of sd.pl){const P=PLAYERS[cp.id];if(!P)continue;const p=P.p;const x=cp.st;const played=x.srv+x.rec+x.att+x.dig+x.blk>0;
      if(!played){formAdd(p,(55-fmOf(p))*0.08-(hasT(p,'kap')||hasT(p,'amb')?1:0));continue;}
      const r=liveRating(cp)||6;let d=(r-6.6)*4.5+(won?1.5:-1.5);

function asstPlan(d,md){const sk=staffSkill('asy');const rnd=mulberry32(hashStr(d)*7+sk*101);const q=clamp((sk-3)/15,0,1);
  const W=teamWeak();const w=i=>W[Math.min(W.length-1,i)];const fr=teamFr();const t=myTeam();
  const chem=chemOf(t.players.filter(p=>Object.values(myLineup()||{}).includes(p.id)),SAVE.team);

  return `<p class="mtext">${esc(TEAMS[b.tm].name)} chce kupić <b>${esc(p.first)} ${esc(p.last)}</b> (${POS_NAMES[p.pos]}, ${p.age} l., ocena ${rating(p)}) i oferuje <b>${fmt(b.fee)}</b>.</p>
   ${o&&p.tm===SAVE.team?`<div class="mact">${windowOpen()?`<button class="btn" onclick="mailDone('${m.id}');acceptBuy('${p.id}',${b.tm},${b.fee})">Akceptuj</button>`:''}<button class="ghost" onclick="mailDone('${m.id}');rejectInbox(SAVE.inbox.indexOf(SAVE.inbox.find(x=>x.pid==='${b.pid}'&&x.tm===${b.tm})))">Odrzuć</button><button class="ghost" onclick="openCard('${p.id}')">Karta zawodnika</button></div>`:'<p class="mut small">Oferta jest już nieaktualna.</p>'}`;}
// ================= SKAUTING: WIEDZA O ZAWODNIKACH, ZADANIA SKAUTÓW, RAPORT O RYWALU =================
function SC(){const s=SAVE.sc||(SAVE.sc={});if(!s.know)s.know={};if(!s.tasks)s.tasks=[];if(!s.short)s.short=[];if(!s.opp)s.opp={on:1,done:{}};if(!s.nid)s.nid=1;return s;}
function isMineP(p){return p&&p.tm===SAVE.team;}
function knowOf(p){if(!p)return 0;if(isMineP(p))return 100;const k=SC().know[p.id];return k!=null?k:(p.tm>=0?(p.jr?5:25):10);}
function addKnow(pid,v){const P=PLAYERS[pid];if(!P)return;const s=SC();s.know[pid]=Math.min(100,Math.round(knowOf(P.p)+v));}
function hId(s){return hashId(String(s));}
function rEst(p){const r=rating(p);if(isMineP(p))return [r,r];const k=knowOf(p);const w=Math.round((100-k)/100*7);const off=Math.round(hId(p.id+'r')*w*0.6);return [clamp(r+off-w,1,100),clamp(r+off+w,1,100)];}
function rTxt(p){const [a,b]=rEst(p);return a===b?String(a):`${a}–${b}`;}
function rMid(p){const [a,b]=rEst(p);return Math.round((a+b)/2);}
function aEst(p,k){const v=p[k];if(isMineP(p))return [v,v];const kn=knowOf(p);if(kn>=85)return [v,v];const a=Math.max(1,Math.round((100-kn)/25));const off=Math.round(hId(p.id+k)*a*0.5);return [clamp(v+off-a,1,20),clamp(v+off+a,1,20)];}
function aTxt(p,k){const [a,b]=aEst(p,k);return a===b?String(a):`${a}–${b}`;}
// potencjał: zakres (pewny – możliwy), węższy przy dużej wiedzy i dobrym skaucie
function potRange(p){if(isMineP(p))return [p.pot,p.pot];const c=potSeen(p);const w=Math.round((100-knowOf(p))/100*10);return [clamp(c-w,40,99),clamp(c+w,40,99)];}
function starsN(v){return Math.max(1,Math.min(5,Math.round((v-62)/7)));}
function potStars(p){const [lo,hi]=p.pot!=null||!isMineP(p)?potRange(p):[rating(p),rating(p)];const a=starsN(lo),b=starsN(hi);
  return '★'.repeat(a)+(b>a?`<span class="pstp" title="możliwe">${'★'.repeat(b-a)}</span>`:'')+'<span class="mut">'+'★'.repeat(5-b)+'</span>';}
function potSeen(p){if(p.tm===SAVE.team)return p.pot;const k=SAVE.sc?knowOf(p):25;const err=(20-staffSkill('sk'))/2*(0.4+0.6*(1-k/100));return Math.round(clamp((p.pot||rating(p))+hashId(p.id)*err,40,99));}
function knowBar(p){const k=knowOf(p);return `<span class="kbar" title="Wiedza o zawodniku: ${k}%"><i style="width:${k}%;background:${k>=80?'var(--good)':k>=45?'var(--acc)':'#c2410c'}"></i></span>`;}
function isShort(id){return SC().short.includes(id);}
function toggleShort(id){const s=SC();const i=s.short.indexOf(id);if(i>=0)s.short.splice(i,1);else s.short.push(id);save();render();}
// ---- skauci i zadania ----
function scoutSlots(sc){return 1+(sc.skill>=11?1:0)+(sc.skill>=16?1:0);}
function oppScout(){const s=SC();if(!s.opp.on)return null;const a=allScouts().slice().sort((x,y)=>y.skill-x.skill);return a[0]||null;}
function scoutLoad(sc){return SC().tasks.filter(t=>t.sid===sc.id&&t.start).length;}
function scoutQueue(sc){return SC().tasks.filter(t=>t.sid===sc.id&&!t.start).length;}
function taskDays(type,sc){return type==='obs'?Math.round(clamp(8-sc.skill/3,2,7)):Math.round(clamp(14-sc.skill/2.5,5,12));}
function freeScout(pref){const a=allScouts();if(pref){const x=a.find(s=>s.id===pref);if(x&&scoutLoad(x)<scoutSlots(x))return x;}return a.filter(s=>scoutLoad(s)<scoutSlots(s)).sort((x,y)=>y.skill-x.skill)[0]||null;}
function scoutFired(id){const s=SC();s.tasks=s.tasks.filter(t=>t.sid!==id);}
function scoutName(id){const x=allScouts().find(s=>s.id===id);return x?`${x.first[0]}. ${x.last}`:'Skaut';}
function newTask(o){const s=SC();const all=allScouts();if(!all.length){ui.scMsg='Nie masz skauta. Zatrudnij go w zakładce Sztab.';render();return;}
  const pref=o.sid||ui.scAs||'';let sc=pref?all.find(x=>x.id===pref):null;if(!sc)sc=freeScout()||all.slice().sort((a,b)=>(scoutLoad(a)+scoutQueue(a))-(scoutLoad(b)+scoutQueue(b)))[0];
  const free=scoutLoad(sc)<scoutSlots(sc);const days=taskDays(o.type,sc);
  s.tasks.push(Object.assign({},o,{id:'tk'+(s.nid++),sid:sc.id,start:free?today():null,until:free?addDays(today(),days):null}));
  ui.scMsg=free?`Zadanie przypisane: ${scoutName(sc.id)}. Raport trafi do poczty za ok. ${days} dni.`:`${scoutName(sc.id)} jest zajęty — zadanie czeka w kolejce i ruszy, gdy zwolni się miejsce.`;save();render();}
function observe(pid){if(SC().tasks.some(t=>t.type==='obs'&&t.pid===pid)){ui.scMsg='Ten zawodnik jest już obserwowany.';render();return;}if(!isShort(pid))SC().short.push(pid);newTask({type:'obs',pid});}
function cancelTask(id){const s=SC();s.tasks=s.tasks.filter(t=>t.id!==id);save();render();}
function marketTask(){const v=k=>{const e=document.getElementById(k);return e?e.value:'';};newTask({type:'mkt',crit:{pos:v('scpos'),age:+v('scage')||40,val:+v('scval')||0,minR:+v('scmin')||0}});}
// codzienny przebieg (z advanceTo)
function scoutDay(d){if(SAVE.team==null||!SAVE.world)return;const s=SC();
  for(const t of s.tasks.slice()){const sc=allScouts().find(x=>x.id===t.sid);if(!sc){s.tasks=s.tasks.filter(x=>x!==t);continue;}
    if(!t.start){if(scoutLoad(sc)<scoutSlots(sc)){t.start=d;t.until=addDays(d,taskDays(t.type,sc));}continue;}
    if(t.type==='obs'){addKnow(t.pid,(40+sc.skill*2.5)/Math.max(1,daysBetween(t.start,t.until)));}
    if(t.until<=d){s.tasks=s.tasks.filter(x=>x!==t);if(t.type==='obs')obsReport(t,sc);else mktReport(t,sc);}}
  if(s.opp.on){const e=nextEvent();const c=myNext();if(e&&c&&e.d>=d&&daysBetween(d,e.d)<=2){const op=c.h===SAVE.team?c.a:c.h;const key=e.d+':'+op;if(!s.opp.done[key]){s.opp.done[key]=1;oppReport(op,e);}}}}
// ---- raport z obserwacji ----
function recFor(p){const my=myTeam().players.filter(x=>x.pos===p.pos).map(x=>rating(x)).sort((a,b)=>b-a);const best=my[0]||0,second=my[1]||0;const r=rMid(p);const pr=potRange(p);
  if(r>=best+2)return ['Polecam','good','Wzmocni pierwszy skład.'];if(r>=second+2||(p.age<=22&&pr[1]>=best))return ['Do rozważenia','warn',p.age<=22?'Młody, z potencjałem na pierwszy skład.':'Dobra zmiana na ławce.'];return ['Odradzam','bad','Nie jest lepszy od naszych zawodników na tej pozycji.'];}
function strengths(p){const w=WEIGHTS[p.pos];const ks=Object.keys(w).filter(k=>w[k]>=0.8);const sorted=ks.sort((a,b)=>p[b]-p[a]);return {top:sorted.slice(0,3),low:sorted.slice(-2).reverse()};}
function obsReport(t,sc){const P=PLAYERS[t.pid];if(!P)return;const p=P.p;const rc=recFor(p);const st=strengths(p);
  sendMail({cat:'skaut',from:`${sc.first[0]}. ${sc.last} (skaut)`,t:`Obserwacja: ${p.first} ${p.last} (${POS_SHORT[p.pos]}, ${p.tm>=0?TEAMS[p.tm].short:'wolny'})`,s:`${rc[0]}. ${rc[2]}`,b:{type:'scout',pid:p.id,rc,st,r:rTxt(p),pot:potRange(p),know:knowOf(p)},lab:'Raport z obserwacji',act:rc[0]==='Polecam'?1:0});}
// ---- przeszukanie rynku ----
function mktReport(t,sc){const c=t.crit||{};let xs=W().players.filter(p=>p.tm!==SAVE.team&&!p.jr&&(!c.pos||p.pos===c.pos)&&p.age<=(c.age||40)&&(!c.val||(p.tm<0?0:pValue(p))<=c.val)&&rating(p)>=(c.minR||0));
  const noise=(20-sc.skill)/2;xs=xs.map(p=>({p,s:rating(p)+Math.max(0,(p.pot||0)-rating(p))*(p.age<=24?0.45:0.1)+hId(p.id+sc.id)*noise})).sort((a,b)=>b.s-a.s);
  const n=3+(sc.skill>=12?1:0)+(sc.skill>=17?1:0);const pick=xs.slice(0,n).map(x=>x.p);for(const p of pick){addKnow(p.id,30+sc.skill*1.5);if(!isShort(p.id))SC().short.push(p.id);}
  const crit=`${c.pos?POS_NAMES[c.pos]:'każda pozycja'}, do ${c.age||40} lat${c.val?', do '+fmt(c.val):''}${c.minR?', ocena od '+c.minR:''}`;

function oppReport(op,e){const t=TEAMS[op];const acc=clamp(oppAcc(),3,20);const nz2=(20-acc)/20;const lu=autoLineup(t);const P=id=>t.players.find(p=>p.id===id);
  const seed=hashStr(e.d+op);const rnd=mulberry32(seed);const jit=v=>v+(rnd()-0.5)*2*nz2*0.35;
  const line=LINEUP_KEYS.map(([k,l,pos])=>{const p=P(lu[k]);return p?[p.id,p.last,pos,Math.round(rating(p,pos)+(rnd()-0.5)*nz2*12)]:null;}).filter(Boolean);
  const att=['A','P1','P2','S1','S2'].map(k=>P(lu[k])).filter(Boolean).map(p=>[p.id,p.last,p.pos,Math.round(clamp(jit(dirTend(p)),0.1,0.95)*100),p.ata]);
  const key=att.slice().sort((a,b)=>(b[4]+(rnd()-0.5)*nz2*6)-(a[4]+(rnd()-0.5)*nz2*6))[0];
  const recs=['P1','P2','L'].map(k=>P(lu[k])).filter(Boolean).sort((a,b)=>(a.prz+a.tod)-(b.prz+b.tod));const weak=rnd()<nz2*0.6&&recs[1]?recs[1]:recs[0];
  const srv=line.map(x=>P(x[0])).filter(p=>p&&p.pos!=='L').sort((a,b)=>b.zag-a.zag)[0];
  const blk=['S1','S2','A'].map(k=>P(lu[k])).filter(Boolean);const blkAvg=blk.reduce((s,p)=>s+p.blo,0)/Math.max(1,blk.length);
  const aA=att.find(x=>x[2]==='A'),aP=att.filter(x=>x[2]==='P');const pC=aP.length?aP.reduce((s,x)=>s+x[3],0)/aP.length:50;
  const rec={blkL:aA?(aA[3]>=60?0:aA[3]<=42?2:1):1,blkR:pC>=60?0:pC<=42?2:1,tgt:weak?weak.id:null,adir:blkAvg+(rnd()-0.5)*nz2*4>=14.5?4:0,serve:weak&&weak.prz<12?2:1};
  const form=teamForm(op);const tb=leagueTable?(()=>{try{return leagueTable().findIndex(x=>x.i===op)+1;}catch(e){return 0;}})():0;
  const names=[allScouts().length?scoutName(oppScout()?oppScout().id:allScouts()[0].id)+' (skaut)':null,SAVE.staff&&SAVE.staff.sta?`${SAVE.staff.sta.first[0]}. ${SAVE.staff.sta.last} (analityk)`:null].filter(Boolean);
  sendMail({cat:'skaut',from:names.join(' i ')||'Sztab szkoleniowy',t:`Raport o rywalu: ${t.name} (${fmtShort(e.d)})`,s:`Najgroźniejszy: ${key?key[1]:'—'}. Słabe przyjęcie: ${weak?weak.last:'—'}. ${rec.adir===4?'Wysoki blok — gramy po bloku.':''}`,
    b:{type:'opp',op,md:e.d,acc:Math.round(acc),line,att,key:key?key[0]:null,weak:weak?[weak.id,weak.last,Math.round((weak.prz+(rnd()-0.5)*nz2*4))]:null,srv:srv?[srv.id,srv.last]:null,blk:Math.round(blkAvg*10)/10,form,pos:tb,str:teamStrength(t),rec},act:1,lab:'Następny rywal'});}

const SP_CAT=[['tit','Tytularny',0.38,'Nazwa klubu w szyldzie ligi, największe pieniądze. Zawsze dokładnie jedno miejsce.'],['main','Główny',0.2,'Logo na przodzie koszulek i na parkiecie.'],['tech','Techniczny',0.09,'Stroje i sprzęt: oprócz pieniędzy trochę mniej kontuzji.'],['mid','Średni',0.045,'Bandy reklamowe, rękawy koszulek.'],['small','Mały',0.016,'Lokalne firmy: drobne, ale pewne pieniądze.']];
const SP_BASE=260000;
const SP_A=['Vistula','Baltic','Polon','Mazovia','Warta','Odra','Tatra','Silesia','Amber','Kronos','Orbita','Nova','Delta','Atlas','Horyzont','Sokół','Żubr','Magnum','Karpaty','Bursztyn','Pomorze','Wawel','Narew','Kujawy','Jantar','Lechia','Mewa','Sudety'];
const SP_B=['Energia','Logistics','Bank','Telecom','Foods','Ubezpieczenia','Motors','Steel','Pharma','Tech','Group','Budownictwo','Media','Travel','Wody','Chem','Software','Paliwa','Agro','Meble','Okna','Dom','Finanse','Transport'];
const SP_T1=['Spike','Vertex','Arvo','Kinetic','Jump','Libero','Ace','Net','Block','Smash','Volta','Rally'],SP_T2=['Sport','Pro','Wear','Athletics','Gear','Team'];
const SP_COL=['#e8b73a','#38bdf8','#ef6b5b','#5ad17a','#a78bfa','#f97316','#2dd4bf','#f472b6','#94a3b8','#facc15'];
function SPN(){const s=SAVE.spons||(SAVE.spons={act:[],off:{},ref:null,nid:1});if(!s.off)s.off={};if(!s.act)s.act=[];return s;}
function spSlots(L,rep){L=L||myInfra().sied;rep=rep==null?SAVE.ai[SAVE.team].rep:rep;return {tit:1,main:L>=3?2:1,tech:1,mid:1+Math.floor(L/2)+(rep>=60?1:0),small:2+L+(rep>=50?1:0)};}
function spSlotsTxt(L){if(!SAVE.ai||SAVE.team==null)return '';const s=spSlots(L);return `główni ${s.main}, średni ${s.mid}, mali ${s.small}`;}
function spStar(){const t=myTeam();const best=t.players.slice().sort((a,b)=>rating(b)-rating(a))[0];if(!best)return [0,null];const r=rating(best);return [(r>=88?0.12:r>=84?0.07:r>=80?0.03:0)+(best.star?0.04:0),best];}
function spQuality(){const rep=SAVE.ai[SAVE.team].rep;const s=S();let pb=0;try{if(s&&(s.phase==='liga'||s.phase==='po')){const pos=leagueTable().findIndex(x=>x.i===SAVE.team)+1;pb=pos<=2?0.08:pos<=4?0.04:pos>=10?-0.04:0;}}catch(e){}
  return clamp(0.55+rep/100*0.55+(myInfra().sied-1)*0.06+spStar()[0]+pb,0.5,1.7);}
function spName(cat){if(cat==='tech')return SP_T1[Math.floor(R()*SP_T1.length)]+' '+SP_T2[Math.floor(R()*SP_T2.length)];return SP_A[Math.floor(R()*SP_A.length)]+' '+SP_B[Math.floor(R()*SP_B.length)];}
function spDurMul(mo){return 1.05-0.01*(mo-1);}
function genSpOffers(){const s=SPN();const q=spQuality();const n={tit:3,main:3,tech:2,mid:4,small:5};s.off={};
  for(const [k,,sh] of SP_CAT){s.off[k]=[];for(let i=0;i<n[k];i++){const m=Math.round(SP_BASE*sh*q*(0.8+R()*0.4)/1000)*1000;s.off[k].push({id:'sp'+(s.nid++),n:spName(k),col:SP_COL[Math.floor(R()*SP_COL.length)],m,maxM:R()<0.3?6:12});}s.off[k].sort((a,b)=>b.m-a.m);}
  s.ref=(SAVE._now||today()).slice(0,7);}
function spUsed(cat){return SPN().act.filter(c=>c.cat===cat).length;}
function spMonthly(){return SPN().act.reduce((a,c)=>a+c.m,0);}
function sponsorAmt(){return spMonthly()*12;}
function techBonus(){const c=SPN().act.find(x=>x.cat==='tech');return c?clamp(0.02+c.m/(SP_BASE*0.09)*0.03,0,0.07):0;}
function signSponsor(cat,id){const s=SPN();const o=(s.off[cat]||[]).find(x=>x.id===id);if(!o)return;const el=document.getElementById('spd'+id);const mo=clamp(+(el?el.value:12)||12,1,o.maxM||12);
  if(spUsed(cat)>=spSlots()[cat]){ui.spMsg={ok:false,t:`Brak wolnego miejsca dla sponsora: ${SP_CAT.find(x=>x[0]===cat)[1].toLowerCase()}. ${cat==='tit'?'Sponsor tytularny może być tylko jeden.':'Więcej miejsc daje rozbudowa siedziby klubu i wyższa renoma.'}`};render();return;}
  const m=Math.round(o.m*spDurMul(mo)/1000)*1000;const c={id:o.id,cat,n:o.n,col:o.col,m,left:mo-1,months:mo,start:today()};s.act.push(c);s.off[cat]=s.off[cat].filter(x=>x.id!==id);
  money(m,'Sponsor');finLog(`Sponsor ${o.n}: pierwsza rata`,m);news(`🤝 Nowy sponsor (${SP_CAT.find(x=>x[0]===cat)[1].toLowerCase()}): ${o.n} — ${fmt(m)} miesięcznie przez ${mo} mies.`);
  ui.spMsg={ok:true,t:`Podpisano umowę z ${o.n}: ${fmt(m)}/miesiąc, ${mo} mies.`};save();render();}
function addMonths(d,n){const [y,m]=d.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-01';}
// 1. dnia miesiąca: raty, wygasanie umów, nowe oferty. Zwraca {inc}
function sponsorsMonth(d){const s=SPN();let inc=0;const ended=[],ending=[];
  for(const c of s.act.slice()){if(c.left>0){inc+=c.m;c.left--;if(c.left===0)ending.push(c);}else{ended.push(c);s.act=s.act.filter(x=>x!==c);}}
  genSpOffers();
  for(const c of ended)sendMail({cat:'spon',from:'Dział marketingu',t:`Wygasła umowa: ${c.n}`,s:`Miejsce sponsora (${SP_CAT.find(x=>x[0]===c.cat)[1].toLowerCase()}) jest wolne. Sprawdź nowe oferty.`,b:{type:'spexp',c},act:1,lab:'Umowa wygasła'});
  for(const c of ending)sendMail({cat:'spon',from:'Dział marketingu',t:`Ostatni miesiąc umowy: ${c.n}`,s:`Od 1. dnia przyszłego miesiąca to miejsce zwolni się.`,b:{type:'spexp',c,soon:1},lab:'Koniec umowy'});
  const free=SP_CAT.reduce((a,[k])=>a+Math.max(0,spSlots()[k]-spUsed(k)),0);
  sendMail({cat:'spon',from:'Dział marketingu',t:`Nowe oferty sponsorskie: ${MON_NOM[+d.slice(5,7)-1]}`,s:`${free?`Wolne miejsca: ${free}. `:''}Najlepsza oferta tytularna: ${s.off.tit[0]?fmt(s.off.tit[0].m)+'/mies.':'—'}.`,b:{type:'spons',free},act:free?1:0,lab:'Oferty'});
  return {inc};}
function initSponsors(){const s=SPN();if(s.init)return;s.init=1;genSpOffers();
  // na start klub ma tytularnego i głównego sponsora na kilka miesięcy
  for(const k of ['tit','main','tech']){const o=s.off[k][0];if(!o)continue;s.act.push({id:o.id,cat:k,n:o.n,col:o.col,m:o.m,left:3,months:4,start:today()});s.off[k].shift();}
  sendMail({cat:'spon',from:'Dział marketingu',t:'Sponsorzy klubu: wybierz partnerów',s:'Mamy tytularnego i głównego sponsora na najbliższe miesiące. Wolne miejsca czekają na umowy.',b:{type:'spons'},act:1,lab:'Oferty'});}

function crowdFor(ti,k,price,est){const rep=SAVE.ai[ti].rep;const L=infraOf(ti).hala;const cap=HALA_CAP[L-1];price=price==null?tixPrice(ti):price;

function pairKey(a,b){return a<b?a+'|'+b:b+'|'+a;}
function pairN(a,b){if(!a||!b)return 0;const P=SAVE.pairs||{};const k=pairKey(a.id,b.id);if(P[k]!=null)return P[k];const ti=a.tm;return Math.round(Math.min(togetherOf(a,ti),togetherOf(b,ti))*0.6);}
function pairChem(a,b){if(!a||!b)return 0.5;let c=0.3+0.7*Math.min(1,pairN(a,b)/25);if(hasT(a,'ind')||hasT(b,'ind'))c-=0.05;if(hasT(a,'lid')||hasT(b,'lid'))c+=0.03;return clamp(c,0.3,1);}
function pairsAfterMatch(m){if(SAVE.team==null)return;const sd=m.sides.find(s=>s.team.idx===SAVE.team);if(!sd)return;const P=SAVE.pairs||(SAVE.pairs={});
  const ids=sd.slots.map(z=>z.p).concat([sd.libero]).filter(p=>p&&p.st.srv+p.st.rec+p.st.att+p.st.dig+p.st.blk>0).map(p=>p.id);
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const k=pairKey(ids[i],ids[j]);P[k]=(P[k]!=null?P[k]:pairN(PLAYERS[ids[i]]&&PLAYERS[ids[i]].p,PLAYERS[ids[j]]&&PLAYERS[ids[j]].p))+1;}}

function pairBonusSide(team,lu,pl){const W=id=>PLAYERS[id]&&PLAYERS[id].p;const g=id=>pl.find(p=>p.id===id);const R=W(lu.R);
  for(const k of ['A','P1','P2','S1','S2']){const p=g(lu[k]);if(p&&R)p.pcB=(pairChem(R,W(lu[k]))-0.65)*0.03;}
  const rl=[['P1','P2'],['P1','L'],['P2','L']].map(([a,b])=>pairChem(W(lu[a]),W(lu[b])));const av=rl.reduce((a,b)=>a+b,0)/3;
  for(const k of ['P1','P2','L']){const p=g(lu[k]);if(p)p.pcB=(p.pcB||0)+(av-0.65)*0.02;}}

function actLabel(){if(liveMatch())return 'WRÓĆ DO MECZU';const e=nextEvent();const c=myNext();if(e&&e.d<=today()&&c)return 'GRAJ MECZ';return 'DALEJ';}
function topBar(){const t=myTeam();const s=S();const d=today();

function searchDrop(){const el=document.getElementById('psd');if(!el)return;const q=(ui.q||'').trim().toLowerCase();if(q.length<2){el.innerHTML='';el.classList.remove('on');return;}

function ctxBar(){if(ui.tab==='mecz'&&liveMatch())return '';const t=myTeam();const s=S();const ps=t.players;
  const mor=Math.round(ps.reduce((a,p)=>a+(p.mor==null?60:p.mor),0)/Math.max(1,ps.length));
  const chem=chemPct(chemOf(myLineupPlayers(),t.idx));const conf=SAVE.board?Math.round(SAVE.board.conf):60;
  const okLu=validLineup(t,SAVE.lineup)&&!myLineupPlayers().some(p=>p.inj);
  let pos='—';if(s&&(s.phase==='liga'||s.phase==='po'||s.phase==='end')){const tb=leagueTable();pos=(tb.findIndex(x=>x.i===SAVE.team)+1)+'.';}
  const c=s?myNext():null;const e=nextEvent();const op=c?(c.h===SAVE.team?c.a:c.h):null;
  const comp=!s?'':s.phase==='spar'?`Sparing ${s.spar.res.length+1}/${N_SPAR}`:s.phase==='liga'?`Liga · ${s.round+1}. kolejka`:s.phase==='po'?'Play-off':phaseName(s);
  const st=(l,v,col,go)=>`<div class="cst" ${go?`onclick="go('${go}')"`:''}><span>${l}</span><b style="${col?'color:'+col:''}">${v}</b></div>`;

  return `<div class="ctx"><div class="cpair"><span class="clab">Rozgrywki</span><b>${esc(comp)}</b></div>
   ${op!=null?`<div class="cpair"><span class="clab">Następny rywal</span><span class="ccr" onclick="openTeam(${op})">${teamCrest(op,22)}</span><b>${esc(TEAMS[op].name)}</b><span class="mut">${e?fmtMid(e.d)+(e.t?', '+e.t:''):''}</span></div>`:''}
   <span class="sp"></span>${st('Morale',mor+'%',pc(mor))}${st('Zgranie',chem+'%',pc(chem),'sklad')}${st('Zarząd',conf+'%',pc(conf),'trener')}${st('Skład',okLu?'OK':'!',okLu?'var(--good)':'var(--bad)','sklad')}${st('Pozycja',pos,null,'tabela')}${st('Budżet',fmt(SAVE.fin?SAVE.fin.bal:0),null,'finanse')}</div>`;}
